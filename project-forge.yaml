version: 1

# Build/test/clean descriptor for prompt-heaven.
#
# The repo compiles nothing -- it is a fleet of stdlib-only Python MCP servers
# plus a prompt corpus -- so "build" here means "does every Python file still
# parse". That is a genuinely useful prerequisite: it fails in under a second,
# before a test suite spends 45 of them starting language servers.
#
# Every syntax check compiles IN MEMORY from bytes and runs under `python3 -B`.
# Never reintroduce `py_compile`: it writes __pycache__/*.pyc into the tree as a
# side effect, every suite that snapshots bytecode asserts the tree stays
# empty, and the Bash guard denies it outright.
#
# ClaudeCode/skills is globbed whole, not just */scripts/: cmake, drawio and
# static-linking keep their runnable .py beside SKILL.md. The sandbox-run `sbx`
# wrapper is Python with no extension -- the one such file under skills -- so it
# is named explicitly; a rename then fails the target loudly instead of silently
# dropping the trust-boundary script out of the check.

configuration:
  settings:
    timeout: 600
    cwd: .
  env:
    PYTHONDONTWRITEBYTECODE: "1"

build:
  syntax:
    description: "Compile-check every Python file in Scripts, tests, hooks and skills, plus the extensionless sbx (in memory, no .pyc)"
    commands:
      - python3 -B -c "import pathlib; ps=[p for d in ('Scripts','tests','ClaudeCode/hooks','ClaudeCode/skills') for p in pathlib.Path(d).rglob('*.py')]+[pathlib.Path('ClaudeCode/skills/sandbox-run/scripts/sbx')]; [compile(p.read_bytes(), str(p), 'exec') for p in ps]; print('syntax OK', len(ps), 'files')"
    filter:
      grep: 'syntax OK|Error|error|Traceback'

test:
  all:
    description: "Every suite via the single entry point. Pass suite names and flags through RUN_ARGS."
    requires: [syntax]
    commands:
      - python3 tests/run.py ${env.RUN_ARGS}
    env_schema:
      RUN_ARGS:
        description: "Extra args for tests/run.py -- suite names and/or --brief, --keep, --whitebox, --show <substr>"
        default: ""
    filter:
      grep: 'SUITE|AGGREGATE|cases|servers|ALL PASS|FAIL|INFO|SKIP|DRIFT|declared'

  inspect_validate:
    description: "mcp-inspect VALIDATION family (validate + 11 format wrappers)"
    requires: [syntax]
    commands:
      - python3 tests/run.py inspect_validate
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP'

  mcp_first_guard:
    description: "The PreToolUse Bash guard. For split_top/heredoc internals use RUN_ARGS=--whitebox on the all target."
    requires: [syntax]
    commands:
      - python3 tests/run.py mcp_first_guard
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP'

  sbx_gate:
    description: "The grant-only PreToolUse Bash gate for the sbx sandbox wrapper: inverted classify, R1-R13 adversarial matrix, cross-file parity, folded offline containment."
    requires: [syntax]
    commands:
      - python3 tests/run.py sbx_gate
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP'

  sbx_seccomp:
    description: "The sbx --seccomp Linux syscall filter (R-0003): the x86_64 classic-BPF allowlist executed by the suite's own interpreter against an independent copy of the kernel syscall table -- arch check first, foreign arch and the x32 bit KILL_PROCESS, every allowlisted call ALLOW and every other number EPERM, the dangerous names absent, socket domains, ioctl TIOCSTI/TIOCLINUX and clone CLONE_NEW* checked by argument, clone3 ENOSYS; _bwrap_argv emitting exactly --seccomp N and staying pure; main() refusing off Linux x86_64; and a live prctl probe on Linux x86_64 (INFO elsewhere). Writes nothing."
    requires: [syntax]
    commands:
      - python3 tests/run.py sbx_seccomp
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|DRIFT|declared|PROBLEM'

  purity_lsp:
    description: "purity_call semantic navigation against live clangd + lua-language-server. The slow one, ~45s."
    requires: [syntax]
    commands:
      - python3 tests/run.py purity_lsp
    timeout: 300
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|timing'

  purity_file_ops:
    description: "purity_call gitignore-aware file handlers: the .claude/tmp exemption, the inheritance rule keeping it narrow, list_dir both branches, the param contract, and the glob spellings that can only ever match nothing. No binary, ~3s."
    requires: [syntax]
    commands:
      - python3 tests/run.py purity_file_ops
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP'

  mcp_git_params:
    description: "mcp-git named params to git argv, fully offline (subprocess stubbed)"
    requires: [syntax]
    commands:
      - python3 tests/run.py mcp_git_params
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP'

  name_existence:
    description: "Every MCP name the corpus and server text prescribe must exist in the live inventory"
    requires: [syntax]
    commands:
      - python3 tests/run.py name_existence
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|GAP|orphan'

  spawn_stdin:
    description: "Every subprocess spawn site under Scripts/ must pass an explicit stdin= (AST-based, offline)"
    requires: [syntax]
    commands:
      - python3 tests/run.py spawn_stdin
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|EXPLICIT|MISSING|INDETERMINATE|NO-STDIN-FORM'

  mcp_footprint:
    description: "Fleet token footprint: tools/list description tax, per-call result ceilings, boilerplate. Measures, does not gate."
    requires: [syntax]
    commands:
      - python3 tests/run.py mcp_footprint
    timeout: 300
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|TOTAL|desc|wire|ceiling|CONFORMS|MATCH|DRIFT'

  wiki_recall:
    description: "mcp-wiki search relevance gate on a synthetic corpus: silence, measured calibration window, floored percentages"
    requires: [syntax]
    commands:
      - python3 tests/run.py wiki_recall
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|window|gate'

  wiki_index:
    description: "INDEX.md rendering, the wiki page-type constants in both copies (Scripts/mcp-wiki.py and the p:wiki _wikilib.py), and the freshness.py / reindex.py wrappers over the server: roadmap-item pages counted in one line and never listed, the orphan exemption, freshness classification, server/_wikilib code and constant parity, the freshness.py exit code equal to the server's gating number, reindex.py failing on a duplicate slug through the server's exported prefix, and exit 2 with no server. Writes only mkdtemp corpora and fixture git repos -- never the live docs/INDEX.md."
    requires: [syntax]
    commands:
      - python3 tests/run.py wiki_index
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|DRIFT|declared'

  wiki_addendum:
    description: "addendum.py (ClaudeCode/skills/wiki/scripts/), the one legal write to an accepted ADR, driven as a child process against a fake wiki root in a mkdtemp sandbox with GIT_CEILING_DIRECTORIES at its parent -- never the live docs/, which is digested before and after. The exact appended bytes with every old byte kept, the file mode and a fresh inode; only an active type: adr page inside <git top-level>/docs (draft, other types, missing pages, paths and symlinks out of the root refused); the staged title/body item (unknown or duplicate keys, a multi-line or backticked title, a body with a level 1-2 ATX or setext heading refused, ### accepted); the same heading never appended twice. Every refusal: exit 2, one stderr line, the page byte-identical."
    requires: [syntax]
    commands:
      - python3 tests/run.py wiki_addendum
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|DRIFT|declared|PROBLEM'

  jira_cli:
    description: "The Jira CLI, fully offline (transport injected): auth mode, context-path URL join, lazy deployment probe, four pagers (the Cloud token model and the DC offset model behind one iterator, the agile isLast/startAt envelope behind boards, sprints and create metadata, and the hand-rolled projects walk a census by call graph missed), each walked past page one and bounded against a server that ignores startAt -- JIRA_READ_ONLY, --dry-run, error mapping, and the byte-pinned multipart attachment body."
    requires: [syntax]
    commands:
      - python3 tests/run.py jira_cli
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP'

  bitbucket_cli:
    description: "The Bitbucket Server/DC CLI, fully offline (transport injected, nothing dialled): the context-path URL join with None-valued query keys dropped and the rest sorted, the two refusals at the door -- an http:// scheme that would hand the bearer PAT to the network in cleartext, and a userinfo base URL whose refusal is asserted NOT to reproduce the secret it exists to protect -- plus the scheme-less spelling that used to reach reject_cloud with hostname None and pass. The same-origin redirect handler is gated component by component (host, scheme, port each on their own row, because urllib's default strips content-length and content-type and leaves Authorization attached), the absent-https-port-is-443 normalisation in both directions, an unparseable port refused rather than raised, and the built opener's redirect chain asserted to contain ONLY SameOriginRedirectHandler -- reached with no socket at all, by calling urllib_fetch with a host-less URL that urllib rejects in do_request_. BITBUCKET_READ_ONLY is gated at BOTH layers, and the row that matters is neither: every entry in HANDLERS is driven through a verb-recording transport and WRITE_COMMANDS is compared against the MEASURED non-GET set, never against a typed list, because the defect being prevented is a subcommand added to one list and forgotten in the other. The four merge refusals are each measured as ZERO requests rather than asserted as statement order -- _target() legitimately runs first, and there is a case showing exactly that. pr-builds pins the verdict precedence, the blank state that made the verdict row VANISH from the document rather than read wrong, and the exit code in Markdown AND --json in ONE case, since the --json branch used to return a hard-coded OK and every gate piping to jq was silently green. A control group plants four mutants -- a reject_cloud comparing only the full hostname, a _build_verdict returning states[0], a WRITE_COMMANDS missing an entry, a redirect handler comparing only the host -- plus the mirror asserting the real implementations pass those same oracles."
    requires: [syntax]
    commands:
      - python3 tests/run.py bitbucket_cli
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|DRIFT|declared|READ_ONLY|ORIGIN|VERDICT|UNVERIFIED|control'

  checkpoint:
    description: "The checkpoint section reader and TOC writer. Writes only inside a mkdtemp sandbox -- never the live .claude/tmp/checkpoint.md, which is the script's own default target: line ranges, the two-render offset fix point, idempotence, byte preservation, and the refusals."
    requires: [syntax]
    commands:
      - python3 tests/run.py checkpoint
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP'

  roadmap:
    description: "The roadmap.py single writer (ClaudeCode/skills/roadmap/scripts/roadmap.py). Writes only inside a mkdtemp sandbox -- never the live docs/roadmap/roadmap.md or its archive, the script's own default target; every child runs with GIT_CEILING_DIRECTORIES at the sandbox's parent and no global or system git config. The on-disk format contract spelled independently of the module, the wiki type membership, and the security AST gates over its source (stdlib only, one git spawn site with a pinned argv prefix and read-only subcommands, no shell, exact write-route caller sets). Hygiene runs even when the script is missing, so the guards are proven to bite first. The DRIFT|declared filter keeps the placeholder count's drift line visible until the first green run sets it."
    requires: [syntax]
    commands:
      - python3 tests/run.py roadmap
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|DRIFT|declared'

  roadmap_board:
    description: "The read-only kanban board over roadmap-export/2 (ClaudeCode/skills/roadmap/scripts/board.py, R-0042). Runs the script as a child inside a mkdtemp sandbox; the live docs/roadmap is digested before and after. Anything but schema roadmap-export/2 is refused with one line on every input route, the markdown board is matched byte for byte against a hand-written rendering of test_roadmap.py's GOLDEN_EXPORT with planted | / newline / backslash cells decoded back through ADR 0016's vocabulary and the reverse blocks edges computed, the html page's embedded JSON cannot close its script block (a planted </script> stays inert), no v-html anywhere, the pinned Vue build the only external script, and --out refused outside roadmap-board-*.html and through a symlink with nothing left behind."
    requires: [syntax]
    commands:
      - python3 tests/run.py roadmap_board
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|DRIFT|declared'

  generated_region:
    description: "The generated-region drift gate: every # BEGIN GENERATED region in Scripts/mcp-*.py and in the generator's hand-declared non-server hosts (DECLARED_HOSTS: Scripts/search_duckduckgo.py and Scripts/search_github.py) re-rendered in memory from the canonical source its own marker names (one of the nine in the generator's CANONICAL_NAMES) and demanded byte-identical, the marker format contract, the source registry and the declared-host list asserted against the generator, every canonical module imported and its blocks unit-tested, and a synthetic control group proving each mutation is detected, a cross-source name is refused, and a quoted marker stays inert. Plus the tab group: re-indentation is decided per BLOCK by tokenize rather than per file, an unsafe block is refused by name for a tab host, and a space host is served exactly what it was before. In-memory only -- writes nothing."
    requires: [syntax]
    commands:
      - python3 tests/run.py generated_region
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP'

  mcp_websocket:
    description: "The stdlib WebSocket client (Scripts/_mcp_websocket.py, ADR 0023): the upgrade request with no Origin, the response checked by EXACT status line, Upgrade, Connection token and Sec-WebSocket-Accept (RFC 6455's worked example pinned), the header-block cap, the ws:// URL parser; client frames at every length form decoded by an oracle written from the RFC, the mask against a per-byte oracle, and every refusal a frame header earns -- RSV bits, a masked server frame, an unknown opcode, an oversized or unfinished control frame, a frame over the cap refused from its header alone; fragments assembled around a ping, ping answered with its own payload, close echoed and returned as None, the message cap across fragments, strict UTF-8, and a 3000-ping stream handled without recursion. Then both wrappers over in-memory and loopback transports, and both hosts' generated copies -- mcp-gdc's CdpSession and search_duckduckgo's CDPSearcher -- driven against a loopback CDP peer. Loopback only; writes nothing."
    requires: [syntax]
    commands:
      - python3 tests/run.py mcp_websocket
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|PROBLEM'

  chrome_capture:
    description: "The Chrome capture harness (Scripts/chrome_capture.py), the independent oracle the stdlib Chrome client is measured with: ONE committed Chrome 153 ClientHello fixture (tests/files/chrome_capture/navigate-r0017.json) parsed and fingerprinted, its JA3/JA4 checked against a walker and a JA4 written in the suite from the spec and against the value R-0017 recorded in spec-ddg 2.9; the HPACK decoder against RFC 7541 C.1-C.6 and its refusals; serve on port 0 driven by a stdlib client -- h2 with two streams sharing one HPACK state, h1 over TLS, plaintext h1, the scripted HelloRetryRequest fed a raw ClientHello and a real stdlib client, and the CLI as a child; diff of the fixture against itself (exit 0) and against a copy with one signature algorithm removed (exit 1, named), a GREASE-only change not reported; export refusing a foreign cookie and a non-loopback Referer with nothing written; every non-loopback bind refused. Loopback only; writes only into a mkdtemp workspace."
    requires: [syntax]
    commands:
      - python3 tests/run.py chrome_capture
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|PROBLEM'

  mcp_chrome:
    description: "The stdlib Chrome 154 HTTP client (Scripts/_mcp_chrome.py, canonical source generated into search_github.py, search_duckduckgo.py and mcp-webfetch.py; R-0044) from the crypto layer up to its three hosts. Crypto (Gate G3): known-answer vectors pasted as hex from the published documents, each row citing its source -- X25519 (RFC 7748 5.2 incl. the 1 and 1000 iteration rows, 6.1 both ways), P-256 ECDH (RFC 5903 8.1), AES-GCM 128/256 (Wycheproof aes_gcm_test.json by tcId), ChaCha20 / Poly1305 key / AEAD (RFC 8439 2.4.2, 2.6.2, 2.8.2, A.5), HKDF-SHA256 (RFC 5869 A.1-A.3) and the RFC 8448 section 3 key schedule down to the traffic keys; ML-KEM-768 round trip, determinism and FIPS 203 implicit rejection, plus the OpenSSL >= 3.5 cross-check in both directions (INFO when absent). Negative control: Wycheproof ModifiedTag vectors and flipped bytes refused as 'tls: bad record MAC', all-zero X25519, off-curve/compressed/short P-256, ML-KEM length and hash checks, HKDF bounds, and an AST gate that every AEAD tag is compared only through hmac.compare_digest, with a planted != it must catch. Generator block contract (shapes, no module-level loop, no duplicates, _ch_/_Ch/CH_/_CH_ prefixes plus five declared exceptions, tab safety, free names, no assert) with planted controls. Throughput: MiB/s decrypting 1 MiB per AEAD, FAIL only when AES-256-GCM is below 0.5 MiB/s; ML-KEM and P-256 timings and the CHROME_PROFILE age are INFO. Gate G4: the ClientHello from 20 seeded rand sources judged by Scripts/chrome_capture.py's independent parser (GREASE positions, 17 extensions, permutation, ECH buckets, length rule, README JA4, no SNI for an IP literal, diff against eight capture sets, a one-sigalg-short profile the diff must catch); TLS 1.3 against an ssl.MemoryBIO server, a loopback ssl server, the RFC 8448 section 3 records (flight decrypt, Finished, replay, tampering), a scripted peer (both groups x three suites, client ALPS EE, TLS 1.2 answer, 16640/16641 records, handshake ceiling, bad Finished/tag, alerts, KeyUpdate and its bound, tickets, short key shares, sequence exhaustion) and an openssl s_server matrix (INFO below 3.5); HelloRetryRequest to P-256 per suite, CH2 vs set 9, every refused HRR. HPACK and h2 (Step 7): RFC 7541 Appendix B and C.2-C.6 vectors (copied from the RFC text), every committed Chrome 154 HEADERS block decoded (vs chrome_capture) and re-encoded byte-identical, the profile lists and every caller-header rule with its exact message, and _ChH2Connection against a test-side RFC 9113 responder: first flight vs every h2 capture and the Akamai string, frame size, CONTINUATION/control/empty-frame floods and the header-list ceiling each at N and N+1 read off the module, WINDOW_UPDATE, GOAWAY/RST, padding, max_bytes -> RST_STREAM(CANCEL), 1xx and trailers. The client over loopback peers: HTTP/1.1 over TLS and cleartext with every head/chunk ceiling; the session (h2 / h1-over-TLS / h1, redirects, downgrade, br/zstd/gzip decoders, cookies, cross-origin header rules); body and decode budgets and the per-hop connect policy (one row per SSRF form); the test-CA-verified TLS 1.2 fallback with *_PROXY ignored; and the transport selector (group P: the verified default vs transport=\"chrome\", the weakest-hop chain label, verified: refusals). The hosts: group M runs search_github's and search_duckduckgo's generated copies (captured cors GET / POST, their policy, the verified-first bot-block ladders, the AST rules); group O runs mcp-webfetch's handle_fetch over loopback (verified default, profile=chrome opt-in, labels, cache admission, the policy split). Writes only into a mkdtemp workspace."
    requires: [syntax]
    commands:
      - python3 tests/run.py mcp_chrome
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|PROBLEM|DRIFT|declared|MiB'

  mcp_decoders:
    description: "The ctypes content decoders (Scripts/_mcp_brotli.py, Scripts/_mcp_zstd.py; canonical sources registered in amalgamate.py CANONICAL_NAMES and WHOLE_SOURCES, generated into mcp-webfetch.py and both search scripts, R-0044): the per-platform load order under a stubbed sys.platform and stub host hooks -- linux x86_64/aarch64, darwin homebrew/intel/macports, freebsd sonames only, absent-everywhere on linux AND darwin -- with Linux making ZERO find_library calls in every scenario, darwin handing dlopen only absolute paths (no bare soname; the real _cdll hook refuses a bare or relative name there, F36), a relative find_library answer never opened, a library missing a symbol skipped and a LookupError cached; the tests/files/enc fixtures decoded byte-exact against the CLI-made originals and their README sha256 pins; the output budget at its exact boundary, both bombs, truncated/corrupt/trailing input, and window-27.zst whose frame header is parsed by the suite before the refusal and which decodes once the cap is lifted; legacy zstd v0.x frame magics refused at byte 0 and at a later frame boundary while all 16 skippable magics still pass (F13); a one-line LookupError when the library is absent; lying stub libraries refused as ValueError and never as bytes; two threads racing the first load 50 times against function objects that refuse a call before their restype is set; generator block shapes, prefixes, tab safety, free names and no assert, with planted controls. Rows that need the host's libbrotlidec/libzstd are INFO when it is absent. Writes nothing."
    requires: [syntax]
    commands:
      - python3 tests/run.py mcp_decoders
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|PROBLEM|DRIFT|declared'

  amalgamate_check:
    description: "The generator's OWN staleness gate: `Scripts/amalgamate.py --check` over every Scripts/mcp-*.py plus the hand-declared non-MCP hosts in its DECLARED_HOSTS (today Scripts/search_duckduckgo.py and Scripts/search_github.py), writing nothing and exiting 1 if a region is stale or hand-edited. It neither subsumes the generated_region suite nor is subsumed by it -- that suite re-renders every region in memory from the canonical source its own marker names and demands byte identity, this one gates the CLI's exit code, the thing a human or a hook actually runs. A clean tree prints NOTHING; the exit code is the verdict. Only --check is wrapped: --force and the bare rewriting form stay unreachable from forge, because a target that repairs the tree it is measuring has no verdict left to report."
    requires: [syntax]
    commands:
      - python3 -B Scripts/amalgamate.py --check
    filter:
      grep: 'CHANGED|HAND-EDITED|Error|error|Traceback'

  read_loop:
    description: "The ADR 0008 read-loop gate: every Scripts/mcp-*.py must run sys.stdin.readline on its OWN single-thread ThreadPoolExecutor that no handler can enter, and must hand each message to its own task rather than awaiting the handler on the read loop. The per-server concurrency split is DECLARED in a table (eight servers run handlers in a worker pool, seven keep them as coroutines because their id-counter safety depends on a single event-loop thread) and measured against it, never inferred from the fleet -- inferring it would only prove the fleet agrees with itself. A synthetic control group plants each defect in turn: the reader on the default pool, the reader on the handler pool, a two-thread reader, an inline handler await, a reader leaked into _serve, an executor nobody shuts down. AST only -- starts nothing, writes only its sandbox."
    requires: [syntax]
    commands:
      - python3 tests/run.py read_loop
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|READLINE|READER|DISPATCH|SHUTDOWN'

  cancel:
    description: "The R-0006 cancellation gate: every Scripts/mcp-*.py must honour notifications/cancelled ON ITS READ LOOP -- a dict registry mapping a request id to its in-flight task, filled after dispatch and forgotten by a done-callback so a finished id is unknown; a hook on the method placed before the task factory that ends in continue, reads params.requestId behind an isinstance(params, dict) guard, refuses a bool (True == 1 hashes to request 1) and calls task.cancel() without ever replying; initialize never registered, so the handshake is not cancellable; and a dispatch target that lets the CancelledError through. What a cancel RECLAIMS is DECLARED per server in a table -- task (gdc, lldb: the coroutine work stops), kill (forge, git, inspect, tshark, wiki: every request-scoped Popen is adopted, started in its own session, and its process group signalled from the dispatch target's re-raising CancelledError arm; tshark's session-owned capture child, wiki's vendored git() and git's MUTATING runner (_run_git_mutating: every stash but list/show, never killed mid-way) are declared exemptions, and an exemption is held to its word -- an exempt spawn that is adopted fails, and so does a row naming no spawning function), lsp-cancel (clangd, cuda, lua-lsp, purity: _request's CancelledError arm pops its pending waiter, sends $/cancelRequest and re-raises), pg-cancel (postgres, R-0043: BackendKeyData stored at startup, a CancelRequest built in a function that opens its own socket, reached from the dispatch target's re-raising CancelledError arm) or reply-only (context7, jenkins, webfetch: a thread or remote peer finishes regardless) -- and every class but reply-only is MEASURED: a task row against read_loop's coroutine dispatch, kill, lsp-cancel and pg-cancel rows by their own AST analysers. A synthetic control group plants each defect in turn for all four analysers, and Scripts/MCP_SKELETON.md's section 5 sample is lifted by script and gated the same way. Group G drives mcp-postgres.py's cancel against an in-process fake PostgreSQL on a loopback socket: the 16 CancelRequest bytes on a second socket after the same SSLRequest, the 57014 error drained so the SAME connection answers the next statement, no CancelRequest after the exchange ended, no statement sent for a request cancelled first, and no re-execution or redial after a cancelled statement's connection drops. The live half is in the smoke target (forge's and wiki's children killed). Groups A-F are AST only; G starts no process and writes nothing."
    requires: [syntax]
    commands:
      - python3 tests/run.py cancel
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|DRIFT|declared|HOOK|REGISTRY|CANCEL|REQUESTID|PARAMS|INITIALIZE|FORGOTTEN'

  wire_log:
    description: "The F12/CWE-532 wire-logging gate: every Scripts/mcp-*.py must log protocol STRUCTURE at both wire sites -- McpServer._write outbound and McpServer.run inbound -- and never a payload body or value. Truncation is not a mitigation: out[:200] is the FRONT of the frame, where the method, the tool name and the first arguments live, so any payload-derived expression is refused whether sliced, f-string-interpolated or wrapped in json.dumps. The shape each site may log is DECLARED per server in a table (twelve servers at the canonical method+id+fn+keys form, one at method+id, two that log nothing on the read loop at all) and measured against it, never inferred -- inferring it would pass, green, on today's thirteen broken servers. A synthetic control group plants each defect in turn: a bare out, a sliced out[:200], the bare response parameter, a non-structural key on it, an f-string over the raw line, json.dumps(msg)[:200], a value reached inside arguments, and the arguments container logged whole -- plus three correct forms it must stay silent on. Scripts/MCP_SKELETON.md is GATED rather than surveyed, its section 5 sample lifted out of the markdown by script and handed to the same analyser, because that template is the proven propagation vector for this defect. AST only -- starts nothing, writes only its sandbox."
    requires: [syntax]
    commands:
      - python3 tests/run.py wire_log
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|PAYLOAD|SHAPE|WIRE|skeleton'

  handler_crash:
    description: "The silent-crash gate: every Scripts/mcp-*.py tool-handler catch-all must leave a traceback at a level the default configuration emits. _mcp_logging.py sets WARNING with no flags, so a catch-all reporting a crashed handler with log.debug reports it to nobody -- six of the fifteen did exactly that, and they are precisely the _dispatch_tool family. The rule is the PROPERTY, not the spelling: log.exception qualifies, so does error/critical/warning with exc_info=True, while debug and info never do and exc_info=False never does. BOTH site layers are gated and DECLARED per server in a table rather than inferred -- the McpServer wrap, which all fifteen have, and the module-level handle_x_call dispatcher, which nine do -- and the six absences are recorded with WHICH of the two reasons applies, since absent-because-the-family and absent-because-this-one-does-not are different facts. One security clause, deliberately only one: the format string must be a literal, which catches the f-string accident that would interpolate a caller payload into a log that IS written, without re-implementing the wire-log suite's payload machinery at a site ADR 0011 declared out of scope. A synthetic control group plants each defect in turn: log.debug, log.error with no exc_info, an explicit exc_info=False, an f-string format, a bare except pass, a catch-all that returns but logs nothing, and a log.exception in a neighbouring function so the scoping is proven rather than assumed -- plus three correct forms it must stay silent on. AST only -- starts nothing, writes only its sandbox."
    requires: [syntax]
    commands:
      - python3 tests/run.py handler_crash
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|CATCH-ALL|TRACEBACK|LOGGED|LITERAL|control'

  table_cells:
    description: "The forged-column gate: a rendered table cell must not be able to invent a column boundary. Every renderer the fleet owns satisfies this by exactly ONE of two declared routes -- it ESCAPES its own delimiter and documents the scheme in its tools/list description, or it is whitespace-delimited inside a fence and has no delimiter to escape, which is a real answer and not an excuse. Eight renderers exist -- swept across BOTH roots the roster spans, Scripts/ and ClaudeCode/skills/*/scripts/, after a Scripts/-only sweep stated as a tree-wide measurement hid one of them -- and the table declares each with a prose reason: mcp-postgres escapes reversibly and says so on the wire, the jira CLI escapes the pipe with a DECLARED deviation (a newline collapses to a space, the backslash is not escaped) that the suite asserts is exactly what the row claims rather than tolerating, mcp-tshark is declared ESCAPED as a REQUIREMENT because its cells carry packet bytes off an untrusted capture, checkpoint.py renders the TOC a COLD MODEL reads a line range out of and was safe only because its own parser ate the delimiter first, roadmap.py beside checkpoint.py renders the roadmap summary and list as a padded GFM table with the same escape vocabulary because its Title cell is free user text, the R-0042 kanban board.py beside it renders unpadded GFM tables with that vocabulary (declared by name, since the alignment sweep cannot see an unpadded table), and mcp-jenkins plus mcp-inspect are STRUCTURE rows whose reason is MEASURED by rendering a pipe-bearing cell rather than accepted. Reversibility is a SEPARATE clause from the column count, and jira is the worked example of the gap: an encoder that escapes the pipe but not its own escape character passes count(|)-count(\\|) while a decoder correctly reads the survivor as a column boundary. The escaper oracle and the unescaped-pipe counter are both lifted from the jira suite, which is where this fleet first wrote the problem down. A control group plants an escaper that ignores the pipe, one that skips the backslash, one that is lossy, and one that rewrites a clean value -- plus two correct forms it must stay silent on, and a four-way PAIRING control combining a lossy or bounded header parse with a raw or escaping renderer, because the checkpoint TOC's defect lived in two functions and in neither alone: a lossy parse makes an unescaped renderer look safe, an escaping renderer makes a lossy parse look harmless, and exactly one of the four combinations satisfies both assertions. Imports the real functions and calls them: starts no server, writes nothing at all."
    requires: [syntax]
    commands:
      - python3 tests/run.py table_cells
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|SEPARATOR|REVERSIB|COLUMN|SCHEME|DEVIATION|control'

  protocol_version:
    description: "The second-home gate: every Scripts/mcp-*.py server must declare the MCP handshake protocol version ONCE, as the first non-docstring member of class McpServer, and the initialize reply must READ that member rather than restate the literal. Seven of fifteen servers had inlined it before the convergence commit and nothing failed, because the live smoke handshake asserts the VALUE and a server inlining the RIGHT string is indistinguishable on the wire from one reading the constant -- the live gate answers 'does the fleet agree on a version', this one answers 'is there one place to change it'. Three clauses per server, one case each so a failure names which broke: decl, use, literal. The suite NEVER contains the version: group B asserts the fifteen declared values agree WITH EACH OTHER, which is strictly stronger than a typed copy because it cannot go stale -- a correct version bump leaves this suite green and reports the new value in an INFO row, where a typed string would fail fifteen cases. Name matching is exact AST identity, because mcp-postgres declares an unrelated PROTOCOL_VERSION_3 for the PostgreSQL wire protocol and a regex matcher would flag it until a maintainer learned to ignore the suite. The enclosing method is never matched: this fleet spells it three ways and MCP_SKELETON.md declares that drift intentional, so the anchors are the class name and the protocolVersion dict key. An annotated declaration passes on purpose -- the rule is the property, not the spelling. A synthetic control group plants each defect in turn: the literal re-inlined, the constant moved to module level, removed, demoted below __init__, read unqualified, bound to a non-string, annotated with no value, the class renamed away, the initialize branch deleted, the file made unparseable, and the value restated in a second dict -- plus six correct forms it must stay silent on, including the tab-indented host, the docstring-first host, the async-dispatcher host, the annotated declaration and the PROTOCOL_VERSION_3 collision. That group is load-bearing rather than ceremonial: the fleet converged before the gate existed, so it can never be observed red against a real file. AST only -- starts nothing, imports no server, writes nothing at all."
    requires: [syntax]
    commands:
      - python3 tests/run.py protocol_version
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|CONSTANT|VERSION|INITIALIZE|MCPSERVER|control'

  forge_dispatch:
    description: "forge_call's own dispatcher, imported in-process: function=status answers exactly what the empty call answers on all four of its paths (missing config, YAML parse error, validation errors, the ordinary status reply), each path with a control proving the fixture reached it, and status is named in the unknown-function error, the tool description and the inputSchema. mkdtemp fixtures only -- starts no server."
    requires: [syntax]
    commands:
      - python3 tests/run.py forge_dispatch
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP'

  py_deps:
    description: "The ADR 0024 dependency gate: every Python file under Scripts/, ClaudeCode/ and tests/ plus the extensionless sbx is pure Python 3.9 + stdlib. AST-read imports (plain, from, function-local, and __import__/import_module with a literal name) whose top-level name is neither embedded 3.9 stdlib nor a repo module must be on the allowlist (yaml, tomli; tomllib as newer-than-3.9 stdlib) and preceded by an importlib.util.find_spec('<name>') literal, never wrapped in except ImportError; Scripts/mcp-webfetch.py's bs4/markdownify are a declared, temporary, per-NAME exception. No import of a stdlib module removed after 3.9. Every file parses with ast.parse(feature_version=(3, 9)) -- SYNTAX ONLY. Every ctypes library name (CDLL/PyDLL/cdll.LoadLibrary/find_library literals and lib-named elements of top-level *SONAMES*/*FILES* tuples) reduces to a stem declared in SYSTEM_LIBS (brotlidec, zstd), CDLL(None) listed as the process's own namespace, no stale declaration. The new sources (Scripts/_mcp_chrome.py, _mcp_brotli.py, _mcp_zstd.py, chrome_capture.py) use none of a listed set of 3.10+ stdlib APIs (bit_count, zip/map strict=, to_bytes/from_bytes without explicit length and byteorder, bisect key=, itertools.pairwise, create_connection all_errors=, hashlib.file_digest, VERIFY_X509_PARTIAL_CHAIN, X | Y annotations); an absent listed file is INFO. 3.10+ API use elsewhere, and any API off that list, remains a declared blind spot. The embedded 3.9 stdlib table is cross-checked against sys.stdlib_module_names on 3.10+. The stdlib Bing parser in search_duckduckgo.py is pinned to the fields lxml produced on tests/files/html/tf_bing_serp.html. A control group plants each defect in turn, including a re-import of a browser-impersonation library that left the allowlist. Starts nothing, writes only its .claude/tmp sandbox."
    requires: [syntax]
    commands:
      - python3 tests/run.py py_deps
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|DRIFT|declared|PROBLEM'

  search_parsers:
    description: "The search scripts' result parsers as single html.parser passes (R-0057, F32): search_duckduckgo's parse_lite_results and search_github's extract_code_from_snippet / parse_grep_results, imported in-process, must return the exact fields the regex parsers they replaced produced -- recorded from them and pinned as literals: the uddg redirect unwrapped, a direct href kept as written, the default snippet, the row a link wins, an unterminated row dropped, a grep.app row whose <pre> is in a later row, limit and defaults. Then four hostile bodies shaped from the old patterns' worst case (unterminated <tr> openers, one row of classless anchors, unterminated data-line rows, rows with an unclosed <pre>), each one KiB under the module's SEARCH_MAX_BYTES, parsed in a child process that must finish within a 10 s bound (the regex parsers ran past a 60 s timeout on all four). Writes nothing."
    requires: [syntax]
    commands:
      - python3 tests/run.py search_parsers
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|DRIFT|declared'

  webfetch_roots:
    description: "mcp-webfetch's two roots (R-0054), imported in-process with stub bs4/markdownify and _fetch_once/_check_host_allowed swapped (no network): --cache-root names the cache directory itself (entries <dir>/<sha256>.json, nothing under the project root), and without it the cache is $XDG_CACHE_HOME/web-fetch when that is set, non-empty and absolute, else ~/.cache/web-fetch; save_to lands under the project root and a save_to into the cache dir -- absolute or ../ relative -- is refused before any fetch; the dispatcher and the status reply carry the cache dir, the tool description names it and the default, and main() threads --cache-root (~ expanded) to handle_fetch and McpServer with both swapped. HOME and XDG_CACHE_HOME are pinned into the mkdtemp sandbox for the whole run and the real default cache dir is asserted not created -- starts no server."
    requires: [syntax]
    commands:
      - python3 tests/run.py webfetch_roots
    filter:
      grep: 'SUITE|AGGREGATE|cases|ALL|FAIL|INFO|SKIP|DRIFT|declared'

  smoke:
    description: "JSON-RPC plumbing invariants across the whole server fleet"
    requires: [syntax]
    commands:
      - python3 tests/run.py smoke
    timeout: 300
    filter:
      grep: 'SUITE|AGGREGATE|servers|ALL|FAIL|PASS|SKIP'

clean:
  pycache:
    description: "Remove every __pycache__ directory outside .git (the tree must stay bytecode-free)"
    commands:
      - python3 -B -c "import pathlib,shutil; ds=[p for p in pathlib.Path('.').rglob('__pycache__') if '.git' not in p.parts]; [shutil.rmtree(d) for d in ds]; print('removed', len(ds), 'pycache dirs')"
    filter:
      grep: 'removed|Error|error|Traceback'

# `pycache` is the only clean target on purpose. An `all` alias would collide
# with test.all (forge matches `describe` across sections) and would have been a
# byte-for-byte copy of the command above -- a duplicate that rots on its own
# schedule. If you add a second clean target, give it its own command.
#
# There is deliberately NO clean target that wipes .claude/tmp.
#
# That directory is the project's only scratch location, and it holds
# .claude/tmp/checkpoint.md -- the session handoff document that lets a fresh
# session resume this work. Wiping it would silently destroy the one artifact
# that carries context across sessions, and it is gitignored, so it is not
# recoverable from history. The suites clean up their own fixture subdirectories
# in a `finally`, which is where that responsibility belongs.
