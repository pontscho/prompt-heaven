requirements:
  - category: architecture
    question: "How is the router structured (threads, locks, files)?"
    answer: >-
      One single file Scripts/sd-router.py with numbered units 1-9; ONE scheduler thread, ONE
      threading.Condition, per-connection handler threads on the generated HTTP front; the scheduler
      DECISION logic (decide) is a pure function. Rejected: per-model supervisor threads, semaphore(1),
      async/selectors, lifting mcp-proxy's ChildSlot, stream-through proxy.
    details:
      - "Source: plan Section 4 and Section 5 Overview; units: 1 config (PURE), 2 routing+sniffer (PURE), 3 decide (PURE), 4 supervisor, 5 _sd_send, 6 scheduler runtime, 7 HTTP front, 8 handlers, 9 main."
      - "Only one lock plus per-ticket Events; no blocking call under the lock; logging under the lock forbidden (round-4 L6)."
    options:
      - "single file, one scheduler thread, one Condition (selected)"
      - "per-model supervisor threads with locks (rejected: deadlock risk)"
      - "async/selectors loop (rejected: cannot reuse the generated thread-based front)"
    status: answered
  - category: interface
    question: "How is a model selected (FR-2, D-11)?"
    answer: >-
      Path prefix /m/<model>/<sd-server path> is primary and AUTHORITATIVE (the body model is neither
      sniffed nor cross-checked, so the closed table has no model_mismatch); the body model field (JSON,
      or a strict canonical-only multipart sniffer) applies only to un-prefixed image routes; /sdapi/*
      without a prefix is 400 model_required.
    details:
      - "Amends the user's FR-2 mismatch rule (D-11); needs explicit user sign-off recorded in ADR 0034."
      - "llm-router sends the route key as body model (IMAGE_MODEL_IS_KEY = False), which need not equal an sd-router model name."
    options:
      - "prefix authoritative, no cross-check (selected)"
      - "route key must equal the sd-router model name (rejected: unenforceable from sd-router)"
    status: answered
  - category: architecture
    question: "What does a client abort of a running request do (D-12)?"
    answer: >-
      It kills the child (stop ladder, group verified gone) and the model returns to STOPPED; the next
      ticket cold-starts (about 20 s). Not a crash, no retry, no budget charge. Rejected: tainting the
      model until idle (no reliable idle signal).
    details:
      - "Changes visible behaviour; needs user sign-off recorded in ADR 0034."
    options:
      - "kill the child on client abort (selected)"
      - "taint the model until idle (rejected)"
    status: answered
  - category: security
    question: "How is the router authenticated and bound (FR-8, D-13, NFR-10)?"
    answer: >-
      A bearer token is REQUIRED (min length 32, same distinct-character rule as llm-router, via the
      generated _http_token_value), compared with hmac.compare_digest on UTF-8 bytes of both sides,
      exactly one Authorization header, scheme Bearer matched case-insensitively, on EVERY route
      including /v1/models and /v1/unload; the child binds 127.0.0.1 only; --allow-remote is refused
      unless --insecure-cleartext is also given, then one cleartext WARNING is logged.
    details:
      - "Source: FR-8, NFR-9, NFR-10, S-L1..S-L3, S-M1, S-M2, D-13."
      - "Single-user-host assumption is logged at every startup and declared: the child is unauthenticated and reachable by any local uid."
    options:
      - "bearer required, remote bind needs --insecure-cleartext (selected)"
    status: answered
  - category: implementation
    question: "How does the router spawn and stop children (FR-9, D-1, D-2, NFR-3)?"
    answer: >-
      argv is a list (never a shell), start_new_session=True, stdout/stderr/stdin DEVNULL, minimal fixed
      env (PATH, HOME, LANG) plus config env; stop = killpg(SIGTERM) -> stop_grace -> killpg(SIGKILL) ->
      reap -> confirm ESRCH; kill-before-reap via a per-platform _sd_wait_exit_unreaped selected by
      sys.platform (kqueue on darwin, os.waitid WNOWAIT polling on linux), a declared adapted copy of sbx.
    details:
      - "Source: plan Section 3 'Process lifecycle', Section 5 Key Design Decisions."
      - "A registry of spawned pgids backs a last-resort shutdown sweep; entries are dropped on confirmed ESRCH/EPERM and re-probed with signal 0 before each SIGKILL (M3, S-L6)."
    options:
      - "adapted copy of mcp-proxy/sbx ladder (selected)"
      - "import or lift ChildSlot (rejected: stdio MCP child, many seams)"
    status: answered
  - category: data
    question: "What are the bounds and defaults (D-6, D-14, D-15, NFR-4, NFR-7)?"
    answer: >-
      retries 0..3 default 1 (ADDITIONAL sends); start_timeout (1,3600] default 120; stop_grace (0,60]
      default 5; request_timeout (1,7200] default 600; --body-limit 32 MiB; --max-connections 8; control
      reserve 4; response_limit 64 MiB (to be measured live); body-read deadline 120 s; restart budget 5
      crashes in 600 s then DISABLED; worst-case image memory max_connections x (body_limit +
      response_limit) = about 768 MiB at the defaults.
    details:
      - "Source: plan Section 1 NFR-4, Section 5 'Bounds', D-14, D-15."
    options:
      - "as planned (selected)"
    status: answered
  - category: interface
    question: "What is the unload contract (FR-5, D-3, D-16, D-17)?"
    answer: >-
      A non-force unload ALWAYS queues (strict FIFO) and answers 200 only after the child group is
      verified gone; ?force=1 is immediate but SCOPED to the resident model (a non-resident force is
      answered by submit_unload itself under the lock with 200 {"unloaded": false}); unknown model is
      404 model_unknown; strict hand-written query splitter without percent-decoding; queued normal
      requests stay queued and cold-start again after a forced stop.
    details:
      - "Source: FR-5, D-3, D-16, D-17; resident = STARTING, READY, STOPPING or DEAD with a live group; DISABLED is a flag, not an enum member."
    options:
      - "as planned (selected)"
    status: answered
  - category: interface
    question: "What is the llm-router credential rule for kind sdcpp (FR-11, D-10)?"
    answer: >-
      sdcpp accepts api_key with auth_header omitted or authorization (a bearer to sd-router);
      x-api-key or none WITH a key is a ConfigError naming backends.<n>.auth_header; the new branch sits
      BEFORE the generic `elif auth_header is None` default; the _RT_AUTH_HEADERS vocabulary is unchanged;
      the non-loopback-http cleartext rule still applies.
    details:
      - "Source: plan Section 3 'llm-router credential facts', Step 8; J12, J39, A14 must stay green UNCHANGED; R1 and R6 change deliberately, red first."
    options:
      - "authorization only (selected)"
      - "also x-api-key (rejected)"
    status: answered
  - category: implementation
    question: "How is the new host registered with the generator (H3, M6)?"
    answer: >-
      Scripts/amalgamate.py DECLARED_HOSTS first, then the order-sensitive mirror tuple in
      tests/test_generated_region.py (same position, appended at the end), BEFORE the first generator
      run; regions are seeded with empty marker pairs and filled by `python3 Scripts/amalgamate.py`, never
      by hand; HTTPFRONT_HOSTS/HTTPFRONT_ADAPTATIONS rows are derived from the computed override set only
      AFTER both classes exist; NEW_39_SCOPE is added when the file is complete.
    details:
      - "Source: plan Section 3 'Generated-region seeding', Step 2, Step 5, Step 7; the Step 1 early probe verifies the hashless-END seeding claim in a scratch copy under .claude/tmp/."
    options:
      - "register first, seed empty pairs, generate (selected)"
    status: answered
  - category: implementation
    question: "What does the docs phase deliver and who executes it (FR-12)?"
    answer: >-
      p:minion-librarian writes docs/components/sd-router.md, ADR 0034 (next free number), an ADR 0028
      addendum via ClaudeCode/skills/wiki/scripts/addendum.py (append-only), updates scripts.md,
      llm-router.md, generated-regions.md and tests.md, sets R-0112 via roadmap.py, and regenerates
      docs/INDEX.md via /p:wiki; docs/roadmap/ is otherwise untouched.
    details:
      - "Source: plan Step 9; D-11 and D-12 are listed in the ADR under 'needs user sign-off'."
    options:
      - "librarian-executed docs phase (selected)"
    status: answered

constraints:
  - type: technical
    description: "Pure Python 3.9 and the standard library only; absence of an optional module is detected with importlib.util.find_spec, never except ImportError; no 3.10+ API (tests/test_py_deps.py NEW_39_SCOPE)."
    impact: "Every task in Scripts/sd-router.py and tests/test_sd_router.py; group A pins it with ast.parse(feature_version=(3, 9))."
  - type: technical
    description: "Generated regions are produced only by python3 Scripts/amalgamate.py between hashed markers; a host must be in DECLARED_HOSTS (generator) and its mirror (tests) BEFORE the first generator run."
    impact: "task-008 and task-009 precede any marker seeding in task-024; `amalgamate --check` must exit 0 per commit."
  - type: technical
    description: "Pure units 1-3 import no socket/subprocess/http/threading; Popen appears only in unit 4; exactly one upstream send site (_sd_send)."
    impact: "Ticket (owns Events) lives in unit 6; decide() works on plain TicketView data; enforced by static AST group A."
  - type: technical
    description: "The generated front does not refuse Transfer-Encoding; sd-router carries its own hand-written 411 before any body read."
    impact: "A hand-written check in the do_POST pipeline and a framing test in group P."
  - type: security
    description: "Structure-only logging (ADR 0011): no bodies, tokens, prompts or env values in any log line, error body or repr; no --config-json (argv visible in ps); config file 0600, O_NOFOLLOW, owner-checked; redacting __repr__ for Settings and ModelSpec."
    impact: "Leak sentinels in groups L and P; AST scan of log arguments in group A."
  - type: security
    description: "No orphan GPU process: after unload, after a handled crash and after router exit by SIGTERM/SIGINT the child's group is gone; unload 200 means 'group gone, verified'. SIGKILL of the router is a declared limit."
    impact: "Groups S, Q-sched and Q-http assert pid/group checks; the stub records grandchild pids."
  - type: business
    description: "Tests are written first and observed red; typed case counts are written down once (SUITES row, # TYPED: ledger comment, forge description) and machine-checked (CASE COUNT DRIFT is a hard failure)."
    impact: "Every test-group task states the running count; the exact integer is fixed in task-036 (about 201 planned)."
  - type: business
    description: "Commits and pushes are never tasks; the four unrelated dirty files are never staged; docs/roadmap/ is edited only via roadmap.py; ADR 0028 is append-only (addendum.py)."
    impact: "Docs-phase tasks are librarian-executed and name the tool; no task contains git commit."

success_criteria:
