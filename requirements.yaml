                finally:
                    if own:
                        kq.close()
            while True:
                try:
                    info = os.waitid(os.P_PID, pid,
                                     os.WEXITED | os.WNOWAIT | os.WNOHANG)
                except ChildProcessError:
                    return True
                if info is not None:
                    return True
                if flag:
                    return False
                if time.monotonic() >= deadline:
