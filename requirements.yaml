original_request: |
  A sandbox-run skill + a stdlib-only sbx sandbox helper (macOS Seatbelt / Linux
  bwrap) + a grant-only PreToolUse gate sbx-gate.py that auto-allows ONLY a clean,
  contained, single sbx invocation and prompts on everything else. Trust-boundary
  shift: approve the ONE wrapper, not each command.
goal: |
  Ship the "approve-the-wrapper-not-the-command" trust-boundary shift as three
  coordinated artifacts: (1) a stdlib-only sbx sandbox helper built pure-pieces-first
  / execvp-last over macOS Seatbelt and Linux bwrap with a fail-closed platform
  registry, default-deny writes, no network, secret read+write denial, and rlimits;
  (2) a grant-only, metacharacter-REJECTING PreToolUse(Bash) gate sbx-gate.py that
  auto-allows only a single clean sbx invocation verified by canonical-path IDENTITY
  (never basename) with scope inside the project and no --net, and stays silent
  (normal prompt) on all doubt; (3) the mandatory gate contract suite with a
  cross-file parity test plus a folded offline pure-builder containment group, the
  live self-test probe, the SKILL.md, and the wiki/ADR sync. Faithful mechanical
  translation of the LOCKED feature-implementation-plan.md (commit e242624); no
  locked decision is re-litigated.
