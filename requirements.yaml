#   plus the single live samples in task-042, task-044 and task-050 (user OK per request).

original_request: "Build a standalone stdlib-only Python 3.9 Chrome-impersonating HTTP client (_mcp_chrome.py) generated into search_github.py, search_duckduckgo.py and mcp-webfetch; brotli/zstd via ctypes to system libs (_mcp_brotli.py, _mcp_zstd.py); drop primp and curl_cffi everywhere."
goal: >-
  Replace the third-party primp and curl_cffi browser-impersonation backends with a pure
  Python 3.9 standard-library HTTP client that puts a Chrome 153 (macOS) TLS 1.3 ClientHello
  (X25519MLKEM768, HRR to P-256, client ALPS) and Chrome's HTTP/2 and HTTP/1.1 request
  profiles on the wire. The client lives in a new canonical source Scripts/_mcp_chrome.py,
  brotli and zstd are decoded through ctypes by two more canonical sources
  (Scripts/_mcp_brotli.py, Scripts/_mcp_zstd.py), and Scripts/amalgamate.py generates all
  three whole into search_github.py, search_duckduckgo.py and mcp-webfetch.py. Rollout is
  risk-first: measure Chrome, build and gate the sources unregistered, pass a user-authorized
  live gate, then switch one consumer per commit and remove primp/curl_cffi from ALLOWLIST,
  EXCEPTIONS and every PEP 723 block, and record the why in ADR 0026.
