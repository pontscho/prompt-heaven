      implementation_details: |
        Plan Step 17 / section 4 S1. Copy _WEB_LINE_SEPARATORS and def _web_clean(text, keep)
        byte-for-byte from Scripts/_mcp_websearch.py:94-116 at TOP LEVEL, outside any generated region
        (import unicodedata), keeping the canonical NAMES (a renamed copy would be invisible to the
        hand-copy census). Comment above it: source file, "_mcp_websearch.py is a WHOLE source (G-c);
        mcp-skill needs its sanitizer and none of the search", and the parity rows mcp_skill:H1/H2.
      code_references:
        - file: /Users/zoltan.ponekker/Code/prompt-heaven/Scripts/_mcp_websearch.py
          function: _web_clean
          note: "P11: the exact text to copy."
          pattern_excerpt: |
            _WEB_LINE_SEPARATORS = "\N{LINE SEPARATOR}\N{PARAGRAPH SEPARATOR}\x85"


            def _web_clean(text, keep):
                """*text* with every invisible or display-steering code point dropped.

                A character in *keep* (e.g. "\\t\\n") survives; U+2028 U+2029 U+0085 become
                "\\n". Printable ASCII is the fast path; the rest is judged by category.
                """
                out = []
                for ch in text:
                    code = ord(ch)
                    if 0x20 <= code < 0x7f or ch in keep:
                        out.append(ch)
                    elif ch in _WEB_LINE_SEPARATORS:
                        out.append("\n")
                    elif 0xfe00 <= code <= 0xfe0f or 0xe0000 <= code <= 0xe01ef:
                        continue
                    elif unicodedata.category(ch) in ("Cc", "Cf", "Cs"):
                        continue
                    else:
                        out.append(ch)
                return "".join(out)
