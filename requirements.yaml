          function: Assumption 9 (plan:104)
          note: "Why a cancelled tools/call ends its stream without a response and never carries id:."
          pattern_excerpt: |
            9. **HTTP answer for a cancelled request.** A `tools/call` is always SSE (FR-8), so a cancelled
               `tools/call` (by `notifications/cancelled`, DELETE or shutdown) closes its stream with no
               response event. SSE events carry **no `id:` field**: an event id marks a POST stream as
               resumable, and a stream closed without a response would then make the SDK reconnect
