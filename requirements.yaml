requirements:
  - category: architecture
    question: What is the shape and the shared plumbing of the new server?
    answer: >-
      One new single-file server, Scripts/mcp-proxy.py, pure Python 3.9 + stdlib (ADR 0024).
      Shared plumbing comes ONLY through generated regions (ADR 0025), and only the two that are
      used: `_mcp_json.py :: _result, _error` (inside class McpServer) and
      `_mcp_logging.py :: _configure_logging` (module level). No new canonical source for the
      child MCP client (one host only; ADR 0014/0025; revisit when a second Scripts/ file needs
      an MCP client). `_mcp_lsp.py :: _request` is NOT reused (wrong protocol: $/cancelRequest).
    details:
      - "plan:22 (FR-1), plan:614-621 (rejected alternatives)"
      - "Seven units in file order: exceptions; ChildSpec/ProxyConfig/load_config; ChildClient; ChildSlot; McpServer; HttpSession; _ProxyHttpServer + _ProxyHttpHandler (plan:159-171)"
    options: []
    status: answered
  - category: architecture
    question: How many project roots does one proxy serve, and where do children run?
    answer: >-
      One proxy instance per project root. The root comes from --project-root or the config's
      `root`; both given with differing realpaths refuses startup (ADR 0015). Every child is
      spawned with the root as cwd. Several roots means several proxy instances.
    details: ["plan:23 (FR-2)"]
    options: []
    status: answered
  - category: architecture
    question: What is the concurrency model?
    answer: >-
      An asyncio core on ONE loop thread that owns all mutable state (NFR-8). Children are
      asyncio subprocesses read by one reader task each. The stdin reader is the file's ONLY
      ThreadPoolExecutor (max_workers=1, thread_name_prefix="proxy-stdin"); one task per
      upstream message (ADR 0008, coroutine dispatch). Phase 2 uses stdlib ThreadingHTTPServer
      on plain threading.Threads bridged into the loop with run_coroutine_threadsafe /
      call_soon_threadsafe; handler threads own only their socket and a queue.Queue.
    details: ["plan:55 (NFR-1)", "plan:65 (NFR-8)", "plan:593-600", "plan:602-606 (rejected: hand-rolled parser, worker pool)"]
    options: []
    status: answered
  - category: architecture
    question: Which MCP protocol version is answered, on which transport?
    answer: >-
      One version on both transports, no negotiation: McpServer.PROTOCOL_VERSION = "2024-11-05"
      as the FIRST class member; the literal appears nowhere else in the file. The HTTP header is
      validated against SUPPORTED_PROTOCOL_VERSIONS = (PROTOCOL_VERSION, "2025-03-26",
      "2025-06-18", "2025-11-25"); a missing header assumes "2025-03-26". The proxy, as a client
      of its children, sends initialize with McpServer._child_init_params() and accepts any
      version string a child answers.
    details: ["plan:92-97 (Assumptions 1-2)", "plan:608-609 (rejected: negotiation / subclass)"]
    options: []
    status: answered
  - category: dependencies
    question: What runtime dependencies and consumers are in scope?
    answer: >-
      Stdlib only on a bare Python 3.9 (ADR 0024); no sibling imports (the server runs as
      __main__ from the symlinked ~/.claude/scripts). The consumer is ai-soul's
      @modelcontextprotocol/sdk 1.25.3 StreamableHTTPClientTransport (read-only reference under
      ../ai-soul/node_modules/@modelcontextprotocol/sdk/dist/esm/). The proxy is NOT registered
      in ~/.claude.json (registered: False in the smoke table).
    details: ["plan:157", "plan:127", "plan:200"]
    options: []
    status: answered
  - category: data
    question: What is the config format?
    answer: >-
      JSON (--config PATH or --config-json STRING, mutually exclusive, one required). Top-level
      keys {root, children, frame_limit}; child keys {name, command, args, env, wrapper,
      call_timeout, startup_timeout}; unknown keys refused. name matches
      ^[a-z0-9][a-z0-9_-]{0,31}$ and is unique. command (and a non-empty wrapper[0]) absolute or
      a bare name shutil.which resolves; a relative path containing "/" refused. An args element
      exactly "{root}" is replaced with the resolved root (no substring interpolation).
      Timeouts are numbers (not bool), 0 < x <= 86400. frame_limit int within
      [1 MiB, 512 MiB], default 64 MiB. The config file is refused if group/world-writable or
      not owned by the euid. Never a shell.
    details: ["plan:24 (FR-3)", "plan:98-99 (Assumptions 3-4)", "plan:768-780 (Step 2 load_config rules)"]
    options: []
    status: answered
  - category: data
    question: How are request ids and progress tokens mapped between upstream and children?
    answer: >-
      The upstream id stays in the awaiting task's frame and never reaches a child; a child sees
      only a per-slot monotonic int child_id that is never reset across restarts (no remap
      table). Each upstream progressToken that is routable (str or non-bool int) is replaced by
      "px:<slot>:<n>" and progress is routed back with the original token and JSON type; an
      unroutable token is stripped before the call. Routes are popped by the reader on the
      response and again in rpc's finally.
    details: ["plan:31-33 (FR-7)", "plan:193-195", "plan:623-624 (rejected: shared remap table)"]
    options: []
    status: answered
  - category: interface
    question: Which MCP methods does the proxy serve upstream?
    answer: >-
      initialize, ping, tools/list (aggregated, config order, no nextCursor) and tools/call.
      resources/*, prompts/* and every other method -> -32601. Unknown tool -> -32602
      "Unknown tool: <name>" (jenkins precedent). A child failure (dead, restarting, disabled,
      timeout) -> a tool result with isError: true (ADR 0010); a child's own JSON-RPC error is
      relayed verbatim. A child->client request: ping answered {}, everything else -32601 and
      the method logged at WARNING.
    details: ["plan:28-34 (FR-7)", "plan:48 (FR-9)", "plan:100-101 (Assumption 8)"]
    options: []
    status: answered
  - category: interface
    question: What does the Streamable HTTP endpoint look like (Phase 2)?
    answer: >-
      One endpoint (--http-path, default /mcp), POST. initialize issues Mcp-Session-Id
      (secrets.token_urlsafe(32)). Missing session id -> 400, unknown/terminated -> 404. DELETE
      terminates and cancels in-flight calls; GET/PUT/PATCH -> 405 with Allow: POST, DELETE. A
      POSTed notification/response -> 202 no body. EVERY tools/call is text/event-stream: headers
      as soon as the call started, ": keepalive" every 15 s, progress events, then the response
      event, never an id: line. Everything else is application/json. A cancelled tools/call
      closes its stream with no response; a cancelled non-tools/call answers 202 no body. An HTTP
      disconnect is NOT a cancel. Batches refused.
    details: ["plan:35-47 (FR-8)", "plan:104 (Assumption 9)", "plan:1290-1310 (do_POST check order)"]
    options: []
    status: answered
  - category: security
    question: How is the HTTP endpoint protected?
    answer: >-
      Bearer token REQUIRED (from a 0600, euid-owned --token-file opened O_NOFOLLOW, or
      MCP_PROXY_TOKEN; both or neither refused), >= 32 printable ASCII chars, compared with
      hmac.compare_digest, checked before the body is read, never logged. Default bind 127.0.0.1;
      IPv4 literals only; non-loopback needs --allow-remote. Origin present and not allowlisted
      -> 403; on a loopback bind Host must be 127.0.0.1:P or localhost:P. Body capped
      (--max-body-bytes 4 MiB); connections (--max-connections 32), sessions (--max-sessions 16,
      24 h idle), in-flight request tasks (--max-inflight 32) bounded; header-phase socket timeout
      10 s until auth. --http with --config-json refused.
    details: ["plan:43-46", "plan:58 (NFR-4)", "plan:1263-1272 (Step 10)", "plan:695-708 (declared security limitations)"]
    options: []
    status: answered
  - category: security
    question: How is the token kept away from children and logs?
    answer: >-
      main() pops MCP_PROXY_TOKEN from os.environ BEFORE anything is spawned (both transports);
      build_child_env drops it defensively; a config env naming it is refused. Logging is
      structure only at every wire the proxy owns (ADR 0011): never a payload body, argument
      value, token or full session id (6-char prefix only).
    details: ["plan:50 (FR-11)", "plan:56 (NFR-2)"]
    options: []
    status: answered
  - category: implementation
    question: What is the restart policy for a child that dies after startup?
    answer: >-
      Eager start: spawn, initialize, notifications/initialized, tools/list to the end; any
      startup failure or duplicate tool exits non-zero before the first upstream read. After
      startup, a death of the current client while ready starts exactly ONE _restart_loop:
      backoff 1,2,4,8,16,32 then 60 s cap, +0-20 % jitter; budget 5 deaths in a sliding 600 s
      window, exceeding it DISABLES the child until the proxy restarts. After a restart the tool
      NAME set must equal the startup set, else DISABLED. No call is retried automatically.
    details: ["plan:26-27 (FR-5, FR-6)", "plan:102 (Assumption 7)", "plan:925-997"]
    options: []
    status: answered
  - category: implementation
    question: How are cancels, timeouts and shutdown handled?
    answer: >-
      An upstream notifications/cancelled cancels the task (reclaim class `task`);
      ChildClient.rpc's except CancelledError arm sends notifications/cancelled
      {requestId: child_id} to the child only if it has not answered, then re-raises. Per-child
      call_timeout (default 3600 s): on timeout the child gets notifications/cancelled and the
      caller gets isError. Each child is spawned with start_new_session=True; stop() closes stdin,
      waits 3 s, killpg TERM, waits, killpg KILL, reaps, then sweeps the process group once per
      incarnation until ESRCH (pgid = None). SIGTERM/SIGINT/SIGHUP run the teardown and end in
      os._exit(0).
    details: ["plan:49 (FR-10)", "plan:59-62 (NFR-5)", "plan:879-907 (ChildClient.stop)", "plan:1075-1119 (_amain)"]
    options: []
    status: answered
  - category: implementation
    question: How is the work verified?
    answer: >-
      The proxy is declared in every fleet gate in the same commit as the server (read_loop
      coroutine row, cancel `task` row, wire_log FULL row, handler_crash W_HANDLE/D_NONE_OWN row,
      NEW_39_SCOPE, a smoke row with one stub child), plus a new suite tests/test_mcp_proxy.py
      (57 typed cases Phase 1: groups A-I, K, L; 90 Phase 2: + group J; 103 final, round-1/2/3
      review: A13, G6, G7, J34-J42, L4) registered in
      tests/run.py and as forge target mcp_proxy, driven against an adversarial stub child
      tests/files/mcp_proxy/tf_stub_child.py.
    details: ["plan:51 (FR-12)", "plan:67-88 (SC-1..SC-6)", "plan:1199-1235 (Step 8)", "plan:1380-1428 (Step 12)"]
    options: []
    status: answered
  - category: implementation
    question: Is an ADR written, and does the user have to approve it?
    answer: >-
      A PROPOSED ADR 0027 ("The proxy relays; it never composes") is written ONLY after explicit
      user approval of a new wiki page. If not approved, its content stays in the module
      docstring and a roadmap inbox item records the canonical-source revisit via roadmap.py.
      The ADR 0008 addendum is written only through addendum.py.
    details: ["plan:1444-1460 (Step 14)", "plan:1243 (addendum)"]
    options: []
    status: answered

constraints:
  - type: technical
    description: >-
      Pure Python 3.9 + stdlib only; no third-party and no sibling imports (ADR 0024, ADR 0025);
      the file runs as __main__ from the symlinked ~/.claude/scripts.
    impact: >-
      No YAML config (JSON only), no aiohttp/httpx; the HTTP server is http.server; shared
      helpers come only through the two generated regions filled by python3 Scripts/amalgamate.py.
  - type: technical
    description: >-
      The McpServer.run shape is gated by AST (tests/test_read_loop.py:322-454):
      ThreadPoolExecutor(max_workers=1, thread_name_prefix="proxy-stdin"),
      run_in_executor(reader, sys.stdin.readline) spelled exactly so, loop.create_task(self._serve(...)),
      no other executor in run(), no _handle_message call in run(), every executor shut down.
    impact: >-
      run() is copied verbatim from mcp-purity (P1) and never changed by Phase 2; the HTTP path
      is a separate serve_http coroutine.
  - type: technical
    description: >-
      The notifications/cancelled hook is gated by AST (tests/test_cancel.py:479-604): nothing
      reachable from the hook may call _write, _result, _error, _tool_error or write; _serve must
      not swallow CancelledError.
    impact: >-
      Cancel forwarding to the child lives only in ChildClient.rpc's CancelledError arm; the
      McpServer hook only calls task.cancel(); _serve catches Exception only.
  - type: technical
    description: >-
      The smoke harness forces -32603 for "params": "force-error"
      (Scripts/_mcp_smoke_test.py:1158-1173), requires exactly one tool named cfg["tool"] and
      initialize.protocolVersion == "2024-11-05", serverInfo.version == "1.0.0"; its alias probe
      is a file substring check for "def _resolve_aliases(" (Scripts/_mcp_smoke_test.py:396-401).
    impact: >-
      params.get("name") stays OUTSIDE the tool-wrap try; the smoke row runs one stub child with
      tool tf_stub_call; the file must never contain the text "def _resolve_aliases(" (comments
      and docstrings included).
  - type: technical
    description: >-
      tests/test_mcp_footprint.py reads a module constant matching
      CAP_CONST_RX = ^_?(DEFAULT_)?_?MAX_[A-Z0-9_]*(CHARS|BYTES|LINES|ROWS|HTML|LOG|OUTPUT)$
      (:462-463) as an output cap, and any .get("<literal>") whose literal matches
      CAP_PARAM_RX = ^max_[a-z_]*(chars|bytes|lines|len|length)$ (:452, :878-899).
    impact: >-
      Constants are named _MAX_FRAME and _HTTP_BODY_LIMIT; the config key is frame_limit (never
      max_frame_bytes); no DEFAULT_MAX_*CHARS constant anywhere.
  - type: technical
    description: >-
      The hand-copy census (Scripts/amalgamate.py:920-970, consumed at
      tests/test_generated_region.py:490-513) flags any top-level or direct class-member name that
      is a canonical block name not covered by a region.
    impact: >-
      Run `python3 Scripts/amalgamate.py --census hosts` before naming symbols; never use
      _request, _notify, _bool_param, _int_param, _json_error_window, _ensure_dict,
      MAX_INFLIGHT_REQUESTS, DEFAULT_MAX_ANSWER_CHARS, _max_answer_chars, DEFAULT_MAX_CHARS,
      PAGE_LINE_RESERVE, _FENCE_LINE_RE, _offset, _rows_note, encode_lsp_message, uri_to_path,
      path_to_uri, _abs_uri, _abs_path, nor any BR_/_br_/CH_/_ch_/_Ch/WS_/_ws_/ZSTD_/_zstd_/
      _Zstd/Chrome*/WebSocket* prefix family. Child-client methods are rpc / notify_child.
  - type: technical
    description: >-
      Python 3.9 floor: syntax checked by py_deps group B; the fixed 3.10+ API list (api_310) via
      NEW_39_SCOPE; 3.11+ asyncio and exception-group APIs (asyncio.timeout, TaskGroup, Runner,
      ExceptionGroup, BaseExceptionGroup, except*) refused by suite case K4.
    impact: >-
      Use asyncio.wait_for, asyncio.wait, asyncio.gather(return_exceptions=True); asyncio
      primitives (Lock) are created inside the running loop (3.9 binds them at creation).
  - type: technical
    description: >-
      Typed test counts in tests/run.py move with the fleet roster (read_loop 47->49, cancel
      84->86, wire_log 53->55, handler_crash 58->60, protocol_version 71->74, py_deps 57->58,
      mcp_proxy new 57 then 90, 103 final (round-1/2/3 review: A13, G6, G7, J34-J42, L4); generated_region
      stays 97; smoke 16 servers derived).
    impact: >-
      The gate-row tasks (task-017..task-025) land in the same commit as the server; every count
      is confirmed by the run, never typed blind.
  - type: technical
    description: >-
      project-forge.yaml exists, so every build/test goes through forge_call (syntax,
      amalgamate_check, read_loop, cancel, wire_log, handler_crash, protocol_version, py_deps,
      generated_region, spawn_stdin, mcp_footprint, name_existence, smoke, mcp_proxy, all).
    impact: Never run make/pytest/python3 tests/run.py through Bash for verification; use forge targets.
  - type: security
    description: >-
      The config file decides what executes; the bearer token is the primary HTTP control; logs
      must stay structure-only (ADR 0011, CWE-532); resources must be bounded (CWE-400, CWE-770).
    impact: >-
      Config ownership/mode checks, token-file 0600/euid/O_NOFOLLOW checks, token popped before
      any spawn, hmac.compare_digest, no shell, every cap listed in NFR-4, and the declared
      limitations (a)-(g) and INFO items written into the module docstring.
  - type: business
    description: >-
      The consumer is ai-soul (one endpoint per project root); the proxy is not registered in
      ~/.claude.json. TLS, per-server endpoints, legacy /sse, resources/prompts, SSE
      resumability, lazy spawn and automatic retry are out of scope.
    impact: >-
      registered: False in the smoke table; the ai-soul run recipe and the two client-side
      timeout notes are documented in docs/subsystems/scripts.md and the module docstring.
  - type: business
    description: A new wiki page (ADR 0027) requires explicit user approval.
    impact: task-056 is gated; without approval its content goes into the module docstring and a roadmap inbox item.

success_criteria:
  - >-
    SC-1: `python3 tests/run.py` (via forge_call test all) is green with the declared counts:
    read_loop 49, cancel 86, wire_log 55, handler_crash 60, protocol_version 74, py_deps 58,
    generated_region 97 (unchanged), mcp_proxy 57 after Phase 1, 90 after Phase 2 and 103 final
    (round-1/2/3 review: A13, G6, G7, J34-J42, L4), smoke 16 servers (derived); spawn_stdin, name_existence, mcp_footprint derived and green.
  - "SC-2: `forge_call test amalgamate_check` prints nothing and exits 0."
  - >-
    SC-3: A child returning a 5 MiB tools/call result is relayed byte-identical (above asyncio's
    64 KiB default StreamReader limit).
  - >-
    SC-4: If a child is killed mid-call, the caller gets isError: true naming the child; a call
    during backoff gets isError within 1 s; after the backoff the tool works again under a new pid.
  - >-
    SC-5: Closing stdin, or SIGTERM, leaves no child and no child-group grandchild alive,
    including when the child exits promptly on stdin EOF and only the always-on group sweep
    reaches the grandchild (I2). A grandchild that called setsid itself is a declared limit (R-12).
  - >-
    SC-6: In HTTP mode the ai-soul SDK's StreamableHTTPClientTransport can initialize, list
    tools, call a tool with and without a progressToken (both answered as text/event-stream),
    cancel a call and terminate the session; a SIGTERM with a call in flight and an idle
    keep-alive connection still ends the proxy within a bounded time with no child left (J33).
    Verified offline by the suite's HTTP client replaying the SDK's exact headers, and manually
    against ai-soul (INFO evidence, not a gate).

context_summary:
  error_handling: >-
    ADR 0010: every child failure reaches the caller as a tool result with isError: true
    (ChildUnavailable -> str(exc) text; any other Exception in the layer-W wrap of
    McpServer._handle_tool_call -> log.exception with a LITERAL format string and
    "mcp-proxy internal error: <Type>: <msg>"). Only protocol errors are JSON-RPC errors:
    -32700 unparseable line and -32600 non-object (run, plain wording, no _json_error_window),
    -32601 unknown method (upstream) and refused child->client requests, -32602 "Unknown tool:
    <name>", -32603 from _serve's catch-all (except Exception only; CancelledError always
    propagates). A child's own JSON-RPC error is relayed verbatim. Config/CLI refusals raise
    ConfigError and become ONE stderr line `mcp-proxy: <msg>` and exit 2; startup failures
    (ChildStartError) exit 1; HTTP refusals are status codes (400/401/403/404/405/411/413/415/
    503) with Connection: close for every pre-body refusal.
  memory_management: >-
    Python GC; lifetime discipline instead: every fire-and-forget task is strongly referenced
    (ChildClient._side_tasks, ChildSlot.restart_task, McpServer._http_tasks) and carries the
    _log_task_failure done-callback; pending futures are popped on every exit path (response,
    timeout, cancel, death, send failure) and a done future's exception is retrieved in rpc's
    finally; progress routes popped by the reader and in finally; bounded buffers (_MAX_FRAME
    StreamReader limit, --max-body-bytes, _HTTP_SINK_PROGRESS_CAP). Every incarnation has an
    owner that reaps it (start_initial, _restart_loop's finally via pending_client,
    ChildSlot.stop, stop_children).
  logging_pattern: >-
    log = logging.getLogger("mcp-proxy") plus the generated `_mcp_logging.py :: _configure_logging`
    region (WARNING by default; --debug or --log-file -> DEBUG, log file 0600; never stdout),
    called from main() as _configure_logging(args.debug, args.log_file). Structure only
    (ADR 0011, CWE-532): inbound "← method=%s id=%s fn=%s keys=%s" (method, id, params.name,
    list(arguments.keys())); outbound "→ id=%s %s" (id, "error"/"ok"; do NOT add a method field);
    child side "child=%s ..." with child name, method, id, sizes only (never a line, token value
    or payload); HTTP "<- http method=%s id=%s fn=%s keys=%s" and "-> http id=%s %s status=%d";
    session ids as sid[:6] only; exceptions in background paths logged by type(exc).__name__ only.
  naming_conventions: >-
    4-space indentation. Module-private constants _UPPER (_MAX_FRAME, _HTTP_BODY_LIMIT,
    _HTTP_*_S); no DEFAULT_MAX_*CHARS and no constant matching CAP_CONST_RX; config key
    frame_limit. Reader thread prefix proxy-stdin; HTTP threads proxy-http / proxy-http-stop.
    Avoid every canonical block name (census list in constraints): the child-client methods are
    rpc / notify_child, never _request / _notify. The substring "def _resolve_aliases(" must not
    appear anywhere in the file. serverInfo {"name": "mcp-proxy", "version": "1.0.0"}. Test
    fixtures use the tf prefix (tf_stub_child.py, tf_stub_call, tf_* functions); suite sandboxes
    under .claude/tmp/test_mcp_proxy/run-<unique>/.
  key_patterns:
    - >-
      Loop-thread ownership (NFR-8): child _pending, routes, slot ids/tokens, tool table, HTTP
      session table and by_id registries are touched only on the event-loop thread; HTTP
      handler threads go through run_coroutine_threadsafe(...).result(timeout=5) or
      call_soon_threadsafe and own only their socket and a queue.Queue.
    - >-
      Single stdin reader executor (ADR 0008): exactly one ThreadPoolExecutor( in the file;
      no second executor, no run_in_executor(None, ...); the HTTP server runs on plain
      threading.Thread.
    - >-
      Cancel registry hand-written per server (ADR 0012): _request_key / _track_request /
      _cancel_request copied verbatim from mcp-purity; HTTP reuses them with a per-session by_id.
    - >-
      _serve(msg, sink=None) with sink = sink or self._write; stdio sink is self._write, HTTP
      sink is _bounded_sink(queue).
    - >-
      Generated region markers: paste an empty `# BEGIN GENERATED: <src> :: <names>` /
      `# END GENERATED:` pair preceded by the `# Refresh: python3 Scripts/amalgamate.py` comment,
      then run python3 Scripts/amalgamate.py; never edit inside a region.
    - >-
      Typed test counts in tests/run.py: a moved count is the alarm; counts are expected values
      confirmed by the run (tests/run.py:533-536).
    - >-
      Fleet gate rows are declared per server in tables (FLEET / WIRE) with DECLARED_* totals,
      in the same commit as the server.
    - Build and test only through forge_call (project-forge.yaml); never Bash make/pytest.
    - >-
      Asyncio primitives and the objects that create them (ChildClient, ChildSlot, McpServer)
      are constructed inside the running loop (3.9 binds Locks to the current loop).

