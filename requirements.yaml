          pattern_excerpt: |2
            class TLSClient(object):
                def __init__(self, sock, host):
                    self.s = sock
                    self.host = host
                    self.inbuf = b""
                    self.transcript = b""
                    self.hs_pending = b""

                def _recv_record(self):
                    while True:
                        if len(self.inbuf) >= 5:
                            ln = struct.unpack("!H", self.inbuf[3:5])[0]
                            if len(self.inbuf) >= 5 + ln:
                                rec = self.inbuf[:5 + ln]
                                self.inbuf = self.inbuf[5 + ln:]
                                return rec[0], rec[5:5 + ln]
                        chunk = self.s.recv(16384)
                        if not chunk:
                            raise ConnectionError("EOF reading TLS record")
                        self.inbuf += chunk
