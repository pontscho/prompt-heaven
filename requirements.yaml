requirements:
  - category: architecture
    question: "Decision 1: what is the script runner and where do HTTP, tokens and sessions live?"
    answer: >-
      Scripts/mcp-sandbox.py is a stdio fleet MCP server with one tool sandbox_call (functions
      run_script, capabilities) and a global concurrency cap; HTTP, bearer token and sessions come
      from a dedicated mcp-proxy --http instance in front of it. No HTTP code in the runner.
    details:
      - "Source: plan section 0, decision 1 (final, user decision)."
      - "Runner proxy launch: --max-body-bytes 8388608 --session-idle 900 (existing flags, Scripts/mcp-proxy.py:2919, :2928)."
      - "Concurrency cap is global because one runner process serves every per-uid skill proxy."
    options:
      - "stdio runner behind a dedicated mcp-proxy --http (selected)"
      - "runner with its own HTTP front (rejected: duplicates _mcp_httpfront.py, ADR 0029)"
      - "skill server calling sbx directly (rejected: per-uid caps, N plan computations)"
    status: answered
  - category: architecture
    question: "Decision 2: what is the skill server and how does it reach the runner?"
    answer: >-
      Scripts/mcp-skill.py is a stdio fleet MCP server with one tool skill_call (load, run, list,
      validate), read-only, and the runner's only client through a stdlib Streamable HTTP MCP client
      (RunnerClient) written host-locally.
    details:
      - "Source: plan section 0, decision 2."
      - "An MCP HTTP client inside a server is a declared deviation (ADR 0032); lifting it into a canonical source is a roadmap item until a second host appears."
    options:
      - "stdlib client inside mcp-skill (selected)"
      - "canonical MCP HTTP client source now (rejected: one host)"
    status: answered
  - category: data
    question: "Decision 3: what is the skill directory contract with ai-soul?"
    answer: >-
      --household-root / --private-root; skills.json per root is the only enumeration source
      (atomic, never list the root); name ^[a-z0-9][a-z0-9-]{0,63}$; dir is one component and a real
      directory; SKILL.md frontmatter exactly '---' / 'name:' / 'description:' raw remainder / '---'
      (not YAML), description one line <= 120 code points; scripts/ and refs/ leaves only; O_NOFOLLOW
      per component, refuse nlink > 1; runnable = index-listed scripts only with the interpreter from
      the index; every entry carries "scripts" (maybe []).
    details:
      - "Source: plan section 0, decision 3; Contract with ai-soul items 2, 4, 7, 8."
      - "Leaf grammar ^[a-z0-9][a-z0-9._-]{0,63}$, <= 64 files and <= 4 MiB per run (Contract item 4; CONFIRMED by ai-soul 2026-10-11, M0:12 -- ai-soul's own bounds are narrower: <= 16 files and <= 262144 bytes per skill version, base64 only under refs/, so 64 / 4 MiB is a runner-side backstop, never the binding limit for an approved skill)."
      - "Group/world-writable skill files and scripts/ refs/ directories are refused writable-by-others (Contract item 7, R2:L7a)."
    options:
      - "strict index + fd-relative leaf hygiene (selected)"
    status: answered
  - category: security
    question: "Decision 4: how is the caller identity established?"
    answer: >-
      From deployment: one skill proxy per ai-soul uid, whose skill child gets that user's
      --private-root; household is shared read-only; everything runs as the same OS uid; isolation
      is by configuration (household threat model = accidents).
    details:
      - "Source: plan section 0, decision 4."
      - "Declared (S-INFO): the runner token IS the boundary -- a same-uid holder of the token file can call run_script directly and bypass --allow-private-scripts (ADR 0032)."
    options:
      - "per-uid proxy, same OS uid (selected)"
      - "dedicated sandbox uid (deferred to roadmap item 1)"
    status: answered
  - category: interface
    question: "Decision 5: how do private and household tiers combine, and may their scripts run?"
    answer: >-
      Private shadows household with a visible [private] mark; household scripts may run; private
      scripts run only with --allow-private-scripts (checked after shadow resolution).
    details:
      - "Source: plan section 0, decision 5; row mcp_skill:J3."
    options:
      - "private shadows household, private scripts opt-in (selected)"
    status: answered
  - category: interface
    question: "Decision 6 (amended 2026-10-10): how is the skill index exposed and bounded?"
    answer: >-
      The index is rendered into skill_call's description at every tools/list, skill names as an
      enum. ai-soul enforces a per-tier budget of 1800 UTF-16 code units at approve time; the
      loader's single ceiling is the whole rendered description <= 4096 UTF-16 code units
      (--max-description, range 512..4096), measured as len(s.encode("utf-16-le")) // 2; over the
      ceiling = refused with both tier sums named in UTF-16 units, never cut; tools/list never fails.
    details:
      - "Source: plan section 0, decision 6 incl. the 2026-10-10 amendment; settled item M8 (UTF-16 unit agreed with ai-soul; ai-soul CHAT_TOOL_DESCRIPTION_MAX_CHARS = 4 * 1024 at /Users/zoltan.ponekker/Code/ai-soul/src/adapters/chat/tool-broker.ts:69)."
      - "Rows mcp_skill:A4, D4, D5, D6 (R2:M4, R2:M5); KD-11."
    options:
      - "UTF-16 units, refuse never cut (selected)"
      - "code points (rejected: ai-soul cuts at JS .length)"
    status: answered
  - category: security
    question: "Decision 7: where is untrusted output sanitized?"
    answer: >-
      The runner returns output RAW; mcp-skill sanitizes (bidi, zero-width, tags, C0/C1 except
      \n\t) with a declared hand copy of _web_clean under its canonical names and frames bodies as
      nonce-delimited quoted reference material.
    details:
      - "Source: plan section 0, decision 7; section 4 sub-decision S1 (WHOLE-source evidence Scripts/amalgamate.py:102-114, tests/test_generated_region.py:638/:892)."
      - "Parity rows mcp_skill:H1 (source text) and H2 (behaviour); KD-10 framing."
    options:
      - "declared hand copy under canonical names (selected, S1)"
      - "two-name generated region (rejected, S2: fails whole-source-regions)"
      - "renamed copy (rejected: invisible to the hand-copy census)"
    status: answered
  - category: architecture
    question: "Decision 8: how does a client see a changed skill description through the proxy?"
    answer: >-
      mcp-proxy gains an opt-in per-child config key "relist": true; that child's tools are re-listed
      on every upstream tools/list (coalesced, min-interval stamped per ATTEMPT, R4:L3); the tool NAME
      set is frozen (a change disables the child); recorded as an ADR 0027 addendum.
    details:
      - "Source: plan section 0, decision 8; FR-17; KD-12; rows mcp_proxy:M1-M11."
    options:
      - "pull-on-tools/list relist (selected)"
      - "polling / honouring list_changed (rejected: no upstream push channel)"
    status: answered
  - category: security
    question: "Decision 9: which sbx flags are added and how does the gate treat them?"
    answer: >-
      sbx gets restricted reads + --read, --exec, clean env + --env, a wall-clock --timeout with group
      kill and --status-fd, and strict --rlimit-*; the PreToolUse gate auto-allows a new flag only
      when it NARROWS; --net and --status-fd always prompt; an rlimit above sbx's current default
      prompts.
    details:
      - "Source: plan section 0, decision 9; FR-1..FR-9; R2:S-L1 (--status-fd prompts)."
    options:
      - "narrowing-only auto-allow (selected)"
    status: answered
  - category: implementation
    question: "Decision 10: how is the macOS read set computed?"
    answer: >-
      Precisely at runner startup by a stdlib Mach-O reader (dylib closure, rpath stack, targeted keg
      image dirs, framework launcher), passed to sbx as --read spellings; a parse failure refuses
      start.
    details:
      - "Source: plan section 0, decision 10; Step 8; R-1, R-1a (C-H2), C-H3."
    options:
      - "stdlib Mach-O closure (selected)"
      - "coarse --read /usr/local (rejected)"
    status: answered
  - category: security
    question: "Decision 11: how is RLIMIT_NPROC set?"
    answer: >-
      NPROC = the real uid's current process count + 64 (--rlimit-nproc +N, counted by sbx right
      before the fork); a fork bomb is bounded by timeout + group kill (declared starvation limit); a
      dedicated sandbox uid is a roadmap item.
    details:
      - "Source: plan section 0, decision 11; R-7."
    options:
      - "count + headroom (selected)"
    status: answered
  - category: security
    question: "Decision 12 (amended 2026-10-10): what are the run limits?"
    answer: >-
      timeout 30 s (max 120 s), CPU = timeout + 1, AS budget 1 GiB (macOS: measured baseline VSZ +
      budget because XNU refuses setrlimit below the current VSZ -- measured python3 ~32.5 GiB, node
      ~33.2 GiB; Linux absolute), FSIZE 16 MiB, NOFILE 256, CORE 0, stdout/stderr 64 KiB each, files
      <= 64 / 4 MiB, outFiles <= 16 / 1 MiB, stdin <= 1 MiB, concurrency 2 (busy immediately), runner
      proxy body cap 8 MiB; a refused requested setrlimit = fail closed.
    details:
      - "Source: plan section 0, decision 12 incl. the 2026-10-10 amendment; KD-3, KD-4; config ranges in plan section 5."
      - "Finding to record in ADR 0031: today's 8 GiB _RLIMIT_AS_BYTES (sbx:1130) is inert on macOS (_lower_to swallows the refusal, sbx:1163-1165)."
    options:
      - "baseline VSZ + budget on macOS (selected)"
      - "/bin/sh ulimit trampoline (rejected; roadmap fallback only)"
    status: answered
  - category: dependencies
    question: "Decision 13: what about the Linux branch?"
    answer: >-
      Built now (target 192.168.2.245 = Ubuntu 22.04 LTS) and verified offline by golden argv; no
