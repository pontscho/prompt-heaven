# requirements.yaml -- llm-router: native `codex` and `openai` Responses-API backend kinds, plus
# the twelfth canonical generated source Scripts/_mcp_oauth.py (OAuth 2.0 / OIDC, sans-IO core
# and a two-block loopback callback wrapper), generated into Scripts/llm-router.py.
#
# Source of truth: docs/feature-implementation-plan.md (validated in 4 rounds: correctness
# APPROVE, security NO_THREAT_SURFACE). It is authoritative; this file only breaks its 18 Steps
# into function-level tasks. Every "Plan Step N" / "KD-n" / "P-n" / "Section n" reference below
# points into that file. Every code anchor below was re-read against HEAD 76fa06a on 2026-10-06.
#
# NOT a roadmap item: no roadmap_item key on purpose.
#
# TASK COUNT IS INTENTIONAL (60 tasks, more than the "13+ tasks, consider splitting" guideline):
# one single-file router touched in seven of its eight units, a new canonical source, a new
# 62-case suite, 141 new llm_router cases (180 -> 321), fleet-gate edits that move together and
# the wiki. Every test group is its own task that PRECEDES the code it proves (red first,
# NFR-7), and no task is larger than L.
#
# RED-FIRST (NFR-7): every `type: test` task is written and RUN RED (FAIL count recorded in
# .claude/tmp/oauth-measurements.md for the ADR 0028 addendum) before the dependent code task.
# I16 is special: its red run uses _rt_scrub_pin WITHOUT the lock (task-037).
#
# USER-GATED tasks (hit Zoltan's real ChatGPT account -- NEVER run without his explicit OK):
#   task-043 (Plan Step 13, live checkpoints A and B); live checkpoints C, D, E inside the
#   test_requirements of task-046, task-048 and task-050. Plan Step 14 depends on Step 13, so
#   task-044 depends on task-043: the chain pauses there until the checkpoint is run.
# Live checkpoints use a TEST config under .claude/tmp, never /Users/zoltan.ponekker/mcp/llm-router.conf.
#
# J10: never run the llm_router suite concurrently with a doc writer (it snapshots the repo tree).

original_request: >-
  Add two native llm-router backend kinds, `codex` (chatgpt.com/backend-api/codex/responses,
  omp-style ChatGPT-subscription OAuth) and `openai` (api.openai.com/v1/responses, official
  Sign-in-with-ChatGPT OAuth or API key), with OAuth as a reusable shared canonical module;
  implement per docs/feature-implementation-plan.md.
goal: >-
  Extend Scripts/llm-router.py with two real backend kinds driven by one ResponsesAdapter and a
  three-row ResponsesProfile table (codex, openai-oauth, openai-apikey): Anthropic Messages in,
  OpenAI Responses API out (always streamed upstream, aggregated for non-stream clients), full
  reasoning round trip through a backend-bound `lrs1.` signature, deterministic tool ids, local
  count_tokens. OAuth (PKCE, authorize URL, code/refresh/device grants, ID-token claim checks,
  loopback callback) lives in a new host-neutral canonical source Scripts/_mcp_oauth.py (twelfth
  CANONICAL_NAMES entry, seventh domain decision) generated into the router by
  Scripts/amalgamate.py. Tokens persist in the config's backends.<n>.oauth through a
  directory-descriptor-relative, flock-serialized, merge-never-clobber atomic rewrite; refresh
  is on demand under a bounded per-backend lock with one forced refresh per 401; a `login`
  subcommand does the browser, paste and device flows. Ships red-first: mcp_oauth 62 cases,
  llm_router 321, generated_region 97, ADR 0028/0014/0025 addenda, component pages, roadmap items.
complete: true

requirements:
  - category: architecture
    question: Which backend kinds are added, and are they native or routed through the omp auth gateway?
    answer: >-
      Two native kinds, `codex` and `openai` (Zoltan: "kettot epitunk"), not the omp gateway via
      the passthrough kind. codex POSTs to https://chatgpt.com/backend-api + /codex/responses;
      openai POSTs to https://api.openai.com + /v1/responses.
    details:
      - "Both become real kinds in _KINDS (Scripts/llm-router.py:390), KIND_CLASSES (:2510-2514) and ADAPTERS (:2539-2542); `anthropic` stays the only reserved kind (A14 unchanged)."
      - "One ResponsesAdapter driven by _RT_RESPONSES_PROFILES (KD-1); CodexAdapter / OpenaiAdapter subclasses set kind and ROUTE_OPTIONS only."
      - "The omp gateway was measured 2026-10-06 and rejected: count_tokens 404, thinking dropped, cache tokens 0, streamed input_tokens 0, call_...|fc_... ids (plan Section 4)."
    options:
      - "Two native kinds codex + openai (chosen)"
      - "omp auth gateway through the passthrough kind (rejected)"
      - "Two independent adapters with their own translators (rejected: ~1000 duplicated lines)"
    status: answered
  - category: architecture
    question: Where does the OAuth code live?
    answer: >-
      In a new canonical source Scripts/_mcp_oauth.py generated into Scripts/llm-router.py by
      Scripts/amalgamate.py (ADR 0025 mechanism): the twelfth CANONICAL_NAMES entry and the
      seventh domain decision (as ADR 0023 counts), recorded in ADR 0014 and ADR 0025 addenda.
    details:
      - "Sans-IO core plus a thin I/O wrapper of two blocks (_oauth_listen, _oauth_sync_accept_callback), taken on ONE marker, dependency first (P17, websocket precedent). NOT a WHOLE source."
      - "Transport and clock are injected (KD-5); the source never sends HTTP and imports exactly base64, hashlib, hmac, json, secrets, select, socket, urllib.parse."
      - "No vendor rows in the source: provider rows (endpoints, client ids, scopes) stay in the router, built with OAuthProvider."
      - "The region sits at the head of unit 6, after the `# Unit 6:` banner (KD-8, J4c)."
    options:
      - "New canonical source, core + thin wrapper (chosen)"
      - "WHOLE source (rejected)"
      - "Source performs its own HTTP (rejected: second putheader site)"
      - "Region before the Unit 1 banner (rejected)"
    status: answered
  - category: data
    question: Where and how are OAuth tokens persisted?
    answer: >-
      In the router config itself, backends.<name>.oauth = {refresh_token, account_id,
      expires_at, client_id, host_id} (client_id/host_id openai-only). The access token and ID
      token are never persisted. The rewrite is atomic and directory-descriptor relative (KD-10,
      KD-20).
    details:
      - "Step 0 directory check FIRST (_rt_config_dir_check: owned by euid, mode & 0o022 == 0, dir_fd support guard fail-closed, no path-based fallback); 0a flock on the <config>.lock sidecar; 0b stale-temp sweep."
      - "Steps 1-8: re-read via _rt_read_config_file(base, dir_fd=dfd), parse with duplicate-key refusal, merge ONLY the oauth sub-object, serialize json.dumps(indent=2, ensure_ascii=False) and verify round trip + outside-equal, temp `.<base>.<16 hex>.tmp` O_CREAT|O_EXCL|O_NOFOLLOW 0600 with dir_fd, write loop + fsync, hash re-check (max 3 attempts), os.rename(src_dir_fd=, dst_dir_fd=) (renameat; os.replace is not in os.supports_dir_fd), fsync(dfd), cleanup in finally."
      - "Merge, never clobber; refuse (ConfigConflict) when anything outside the sub-object would change; a lone surrogate is a ConfigError."
      - "A separate token file was rejected (user decision 3)."
    options:
      - "In the router config, atomic dir_fd-relative merge (chosen)"
      - "Separate token file (rejected)"
      - "Byte-splicing the oauth object (rejected)"
    status: answered
  - category: implementation
    question: How is reasoning mapped between Anthropic and the Responses API?
    answer: >-
      Fully. thinking.budget_tokens -> reasoning.effort bands (route option wins);
      reasoning_summary_text streams out as Anthropic thinking blocks with a signature_delta; a
      reasoning item without summary becomes redacted_thinking. encrypted_content round-trips in
      the signature `lrs1.<backend>.<encrypted_content>`, with NO HMAC (orchestrator decision,
      KD-6).
    details:
      - "Inbound signatures that are foreign, garbled, bound to another backend or over 1 MiB are dropped silently and counted in dropped_thinking; at most 256 reasoning items per request (_RT_RS_REASONING_CAP)."
      - "A valid signature becomes {type: reasoning, encrypted_content, summary: []}; the summary is not replayed."
      - "Effort bands (KD-14): <=4096 low, <=16384 medium, <=32768 high, above xhigh; adaptive -> medium; absent/disabled omits effort but summary auto and include are always sent."
    options:
      - "Plain backend-bound signature (chosen)"
      - "HMAC-sealed signature (rejected: no security gain, third J1 site)"
    status: answered
  - category: interface
    question: How does the `openai` kind authenticate?
    answer: >-
      One kind, two auth modes: exactly one of api_key (pay-as-you-go, profile openai-apikey,
      sends temperature/top_p/max_output_tokens) or oauth (Sign in with ChatGPT, profile
      openai-oauth, never sends sampling fields). `codex` requires oauth and refuses api_key.
    details:
      - "_RT_KIND_AUTH_PROFILES = {codex: {oauth: codex}, openai: {oauth: openai-oauth, api_key: openai-apikey}} resolved once at load into BackendSpec.profile (_rt_cfg_profile)."
      - "openai-apikey forces auth_header authorization (mistral precedent); the OAuth profiles refuse auth_header and use \"none\" internally (credential from the token store)."
    options:
      - "One kind, two modes (chosen)"
      - "Two separate kinds openai-key / openai-siwc (not chosen)"
    status: answered
  - category: security
    question: How is the ID token validated?
    answer: >-
      No signature verification (OIDC Core 3.1.3.7 item 6: TLS server validation of the direct
      token-endpoint response stands in for it), plus claim checks iss, aud (equal or contains
      the issued client_id), exp, nonce at login, and required scope chatgpt.tokens.use.direct
      when the response carries a scope. Declared limit (1).
    details:
      - "Identity claims come ONLY from the direct token-endpoint response (I3): never from callback query parameters."
      - "codex reads only chatgpt_account_id and residency claims from the access token; it sends no nonce."
      - "Every claim reaching a header passes _rt_header_value_ok(v, \"claim\") = [A-Za-z0-9_-]{1,128} (S5)."
    options:
      - "Claim checks only, signature declared out of scope (chosen)"
      - "JWKS signature verification (out of scope)"
    status: answered
  - category: interface
    question: What identity does the codex kind present upstream?
    answer: >-
      It copies omp: originator `omp`, omp's User-Agent (measured in Plan Step 1, M1) and version
      `0.159.0`, as ONE data row _RT_CODEX_IDENTITY, each value overridable per backend via the
      `identity` config key; the codex authorize request's originator reads the same row (KD-2).
    details:
      - "Override keys are exactly the row's keys; values printable ASCII 0x20-0x7E, 1-256 chars, no CR/LF (rule `identity`)."
      - "Until M1 lands, _RT_OMP_USER_AGENT carries a `# M1: unmeasured` marker."
    options:
      - "Copy omp's identity, overridable (chosen, user decision 7)"
      - "Own llm-router identity (not chosen)"
    status: answered
  - category: implementation
    question: Which remaining design assumptions were accepted, and what is out of scope?
    answer: >-
      Accepted: a `login` subcommand with a hardened loopback callback plus stdin paste fallback
      plus the codex device flow; on-demand refresh under a per-backend lock (5-minute skew,
      bounded wait, 10 s negative cache for non-relogin failures) with exactly one forced
      refresh per upstream 401; a dynamic scrubber (add/pin, 64 unpinned cap); always stream
      upstream and aggregate for non-stream requests; deterministic toolu_ ids; local
      count_tokens; config-only /v1/models. Out of scope: WebSocket transport,
      previous_response_id, zstd request compression, hosted tools, runtime OIDC discovery,
      revocation/logout, a background refresh thread, non-POSIX platforms.
    details:
      - "Login: codex binds 127.0.0.1:1455 (mandatory) and [::1]:1455 (best effort) with SO_REUSEADDR on POSIX, never SO_REUSEPORT; openai binds 127.0.0.1:<ephemeral>; closing stdin never aborts the wait (KD-17)."
      - "Refresh lock order: backend lock -> write_lock -> flock (KD-11); a 401 after the forced refresh is 401 authentication_error with a re-login hint for the OAuth profiles (KD-16 deviation from KD-8)."
      - "Non-stream: SSE body aggregated (64 MiB cap) through the same translator with _RtMessageCollector as the sink (KD-4)."
    options:
      - "Accept all listed assumptions (chosen)"
    status: answered

constraints:
  - type: technical
    description: "Pure Python 3.9 and the standard library only (ADR 0024). Scripts/_mcp_oauth.py joins NEW_39_SCOPE; the router gains only `import fcntl` (module level) and a function-local `import webbrowser` inside _rt_login."
    impact: "No third-party module, no typing annotation in the canonical source, no API newer than 3.9; POSIX-only (fcntl, os.geteuid) is declared."
  - type: technical
    description: "Generate, do not import (ADR 0025): Scripts/_mcp_oauth.py blocks are generated into Scripts/llm-router.py between hashed BEGIN/END GENERATED markers by `python3 Scripts/amalgamate.py`; the router never imports the source, and nobody edits inside a region."
    impact: "Every block obeys the block contract (def/class/single-target Assign, free names resolve to host imports or co-listed blocks, tab-safe, one physical line per call); `python3 Scripts/amalgamate.py --check` must exit 0."
  - type: technical
    description: "Red first (NFR-7): every behavioural change has its cases written and run red before the code lands; FAIL counts are recorded for the ADR 0028 addendum."
    impact: "Each test task precedes its implementation task in the dependency graph; I16's red run uses an unlocked _rt_scrub_pin."
  - type: technical
    description: "J10: a test run writes no repo file and the llm_router suite snapshots the repo tree; never run the llm_router suite concurrently with a doc or wiki writer."
    impact: "All config writes go under .claude/tmp/test_llm_router/run-<unique>/; docs tasks (Plan Step 18) run only after the final suite run."
  - type: security
    description: "Live checkpoints A-E use a TEST config under .claude/tmp, never /Users/zoltan.ponekker/mcp/llm-router.conf, and run only with Zoltan's explicit OK."
    impact: "task-043 and the checkpoint halves of task-046, task-048, task-050 are user-gated."
  - type: technical
    description: "Static rules are amended explicitly, never bypassed (NFR-5): J1 exactly two compare_digest sites (_precheck, _oauth_state_matches), J4a exactly two _rt_send sites each pinned to its header builder, J4b and J4c unchanged, each with a planted control."
    impact: "The generated region sits after the `# Unit 6:` banner; unit 2 and unit 5 never reference time/socket/threading; locks and clocks live in units 6-8."
  - type: technical
    description: "The plan's two remaining UNVERIFIED markers (omp User-Agent, M1; SIWC acceptance of top-level function tools, M2) are resolved by Plan Step 1's measurements (and M2 confirmed at live checkpoint E)."
    impact: "_RT_OMP_USER_AGENT keeps `# M1: unmeasured` until task-001 lands; tool_shape stays \"function\" unless checkpoint E refutes it (then one row value plus one translator branch in task-050)."
  - type: technical
    description: "No new constant may match CAP_CONST_RX (tests/test_mcp_footprint.py:462-463, a MAX_ stem); use _LIMIT / _CAP stems."
    impact: "Names like _RT_RS_SIGNATURE_LIMIT, _RT_RS_REASONING_CAP, OAUTH_BODY_LIMIT."

