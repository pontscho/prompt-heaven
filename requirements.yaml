          (c) repeat (a)-(b) over every top-level segment until each is <= 50 levels deep;
          (d) remove each segment bottom-up (os.unlink(n, dir_fd=fd), os.rmdir(n,
              dir_fd=parent_fd) on the way out), then the workdir itself.
