          note: "Adopting spawn: start_new_session + reclaim.adopt(proc) in the same function; run()'s timeout path verbatim."
          pattern_excerpt: &px_inspect_run_child |
            def _run_child(cmd: List[str], timeout: int,
                           stdin_text: Optional[str]) -> subprocess.CompletedProcess:
                reclaim = _REQUEST_RECLAIM.get()
                if reclaim is not None and reclaim.cancelled:
                    raise RequestCancelled(cmd[0])
                stdin = subprocess.DEVNULL if stdin_text is None else subprocess.PIPE
                with subprocess.Popen(
                    cmd,
                    stdin=stdin,
                    stdout=subprocess.PIPE,
                    stderr=subprocess.PIPE,
                    text=True,
                    start_new_session=True,
                ) as proc:
                    if reclaim is not None:
                        reclaim.adopt(proc)
                    try:
                        stdout, stderr = proc.communicate(input=stdin_text, timeout=timeout)
                    except subprocess.TimeoutExpired:
                        proc.kill()
                        proc.wait()
                        raise
                    except BaseException:
                        proc.kill()
                        raise
                    retcode = proc.poll()
                return subprocess.CompletedProcess(proc.args, retcode, stdout, stderr)
