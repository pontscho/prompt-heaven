implementation_notes: |
  Phase 0 of the mcp-purity unification: folded the clangd + cuda semantic
  code-navigation layer into Scripts/mcp-purity.py behind the unchanged purity_call
  entry point (layered backend: sync file layer + async LSP backend + filetype routing).
  All 10 tasks completed; builder smoke test PASS (mcp-purity + full suite, zero
  regression); inspector-implementation COMPLETE (10/10 tasks, 13/13 success criteria);
  security-review code-mode APPROVE (0 verified findings, 11 suppressed, 1 escalated).
  Deviation (correct-by-design): the canonical path param is `relative_path` (purity's
  pre-existing key) rather than clangd's `path`, unifying the path namespace across the
  file and semantic layers (inspector M2 satisfied). Also extended: the global
  task-update.py status script had a 10-line-window bug that silently skipped tasks with
  long block-scalar descriptions; fixed to scan to the next task boundary.
implementation_open_items:
  - "[G1, LOW] Mixed C/C++ + CUDA project: when .cu/.cuh sources exist the backend starts
     in CUDA mode with a .cu-only translated compile DB, reducing plain C/C++ coverage.
     Documented in-code (mcp-purity.py CUDA-mode comment); deferred past the skeleton phase."
  - "[G2, LOW] _ensure_backend has no 'project has clangd-family sources' precondition, so
     name-path/symbol calls spawn clangd even when the tree has no .c/.cpp/.cu (A-class
     handlers degrade to grep fallback, so no crash). Optional Phase-1+ gate."
implementation_security_open_items:
  - owasp: A09
    cwe: CWE-532
    file: Scripts/mcp-purity.py
    line: "2936,2947,3068"
    severity: INFO
    description: "[F12, ESCALATED by security-review] Debug logging (--debug/--log-file)
      persists the first 200 chars of wire/LSP message bodies, which may include absolute
      paths or file-content snippets. Operator-gated and largely pre-existing (the debug
      lines + --log-file predate this change). Policy decision, not a confirmed vuln: ensure
      --log-file targets an operator-protected path, or redact content/path fields before the
      log.debug truncation if the wire is not fully trusted."
  - owasp: A03
    cwe: CWE-1333
    file: Scripts/mcp-purity.py
    line: "search_for_pattern/list_dir/replace_content"
    severity: LOW
    description: "[P2, residual] ReDoS via user-supplied regex (Python re has no timeout).
      Pre-existing; explicitly accepted out-of-scope for Phase 0. Runs in a thread executor
      so at worst pins one worker thread in a local single-user dev tool."

requirements:
  - category: architecture
    question: How is the LSP core unified across clangd and cuda?
    answer: |
      Fold the byte-for-byte-duplicated common LSP core (framing, path/uri
      helpers, SYMBOL_KIND_MAP/DEFINITION_KINDS, extract_*, the full
      ClangdClient body, and the grep fallback) once into mcp-purity.py behind an
      abstract backend interface. CUDA becomes the language-config of the same
      clangd-family backend (one ClangdClient, language as config), selected via
      filetype routing. The backend map is keyed by LSP-backend type ("clangd"
      now; "luals" later) so it is single-entry in Phase 0 but luals-ready.
    details:
      - "Common core is identical in mcp-clangd.py and mcp-cuda.py today (copy-paste)."
      - "CUDA's only functional divergence is the truncated _symbol_to_location."
      - "Backend map: _backends: Dict[str, ClangdClient], not a single _client singleton."
    options: []
    status: answered
  - category: interface
    question: How are the 10 semantic functions exposed and how do legacy names route?
    answer: |
      All 10 canonical semantic names AND every legacy clangd_*/cuda_* name
      (including *_at variants and clangd_init/cuda_init) become DIRECT HANDLERS
      keys mapping to the unified canonical handlers. Decision D1/[inspector C1]:
      the dispatcher uses HANDLERS.get(function) with the RAW name (mcp-purity.py
      line 858, kept unchanged) — FUNCTION_ALIASES does NOT route, it is consulted
      only for param-alias resolution and error hints. This matches the existing
      load-bearing redundancy where glob/grep/search/ls are already direct
      HANDLERS keys.
    details:
      - "10 canonical: find_definition, find_references, find_implementations, type_at, diagnostics, outline, symbol, symbol_context, inlay_hints, symbol_change_impact."
      - "find_definition/find_references accept either symbol or at (path,line,character)."
      - "glob becomes canonical for file-glob search; find_file kept as alias (already both direct HANDLERS keys today)."
      - "clangd_init/cuda_init become no-op/deprecation-notice handlers under lazy init, NOT errors."
    options:
      - "Direct HANDLERS keys (CHOSEN — keeps line 858 unchanged, matches existing redundancy)."
      - "Change line 858 to look up canonical_func and consolidate into FUNCTION_ALIASES (rejected — do not split)."
    status: answered
  - category: implementation
    question: How does symbol/at parameter routing work?
    answer: |
      The canonical find_definition / find_references handlers inspect the
      POST-alias resolved params: if line/character present, take the position
      path (former *_definition_at); else if symbol_name present, take the name
      path (_symbol_to_location). [inspector M2] the merged alias layer renames
      symbol -> symbol_name, so the router MUST check the post-alias key
      symbol_name, not symbol. Keep the two internal handlers; only the dispatch
      entry is unified.
    details:
      - "glob as a FUNCTION name (file-search) is a different namespace from glob as a PARAM alias -> paths_include_glob (mcp-purity.py:86); document the distinction."
      - "Neither symbol nor at -> validation error."
    options: []
    status: answered
  - category: architecture
    question: How is lazy LSP init triggered and coordinated?
    answer: |
      [inspector H2 — NEW logic, not reuse] On the first semantic call for a
      filetype, if _backends[type] is absent, START init (guarded by whether the
      project has sources of that type, _has_cuda_sources-style), then reuse ONLY
      the shielded 90s WAIT: asyncio.wait_for(asyncio.shield(init_task),
      timeout=90). The existing clangd gate (mcp-clangd.py:1584-1591) only WAITS;
      it does not start init (clangd starts eagerly at run(),
      mcp-clangd.py:1940-1948). The file layer never triggers init.
    details:
      - "Once-only init guard per backend type."
      - "Concurrent first-calls coalesce into a single in-flight init task per type (no two clangd processes)."
      - "Init-failure caching / backoff: do not re-spawn a crashing clangd on every call."
      - "Per-backend init state stored in the _backends map."
      - "Site the project-root mismatch warning here (no handle_init anymore) — [inspector M3]."
    options: []
    status: answered
  - category: implementation
    question: How does the dispatch path become async?
    answer: |
      Promote _handle_tool_call / the tools/call path to async. Semantic handlers
      are async and awaited directly. Sync file handlers run via
      loop.run_in_executor(None, lambda: sync_handler(params, project_root,
      strict)). The MCP loop is already async (mcp-purity.py:980) and the executor
      pattern already exists for stdin (mcp-purity.py:985).
    details:
      - "Long file-layer operations (search_for_pattern, os.walk) run in the executor so they never freeze the event loop."
      - "_handle_message must await the now-async _handle_tool_call."
    options:
      - "Executor-wrapped sync file layer (CHOSEN — zero regression surface)."
      - "Full async rewrite of every file handler (rejected — needless regression surface)."
    status: answered
  - category: dependencies
    question: What imports may be added and what must stay out?
    answer: |
      stdlib-only, zero external deps. New allowed imports: pathlib, glob as
      glob_mod (aliased to avoid colliding with the glob FUNCTION name), shutil.
      Do NOT carry over tempfile from mcp-cuda.py:36 (imported but unused —
      [inspector L1]). The # dependencies = [] header (mcp-purity.py:4) must stay
      accurate.
    details:
      - "Current mcp-purity imports (mcp-purity.py:25-33): argparse, asyncio, fnmatch, json, logging, os, re, sys; typing Any/Callable/Dict/List/Optional."
      - "asyncio already imported; subprocess via asyncio.create_subprocess_exec."
    options: []
    status: answered
  - category: implementation
    question: How is the _resolve_aliases precedence and param-alias merge handled (bug #3)?
    answer: |
      Unify mcp-purity's _resolve_aliases (mcp-purity.py:145-177) onto last-wins:
      change the `if canonical not in resolved` guard (line 175, first-wins) to an
      unconditional overwrite (clangd-style, mcp-clangd.py:74). KEEP purity's
      (params, function) signature and its two-tier
      PARAM_ALIASES_BY_FUNC + PARAM_ALIASES. [inspector M1] merge clangd's flat
      PARAM_ALIASES that the semantic handlers depend on (symbol->symbol_name,
      col/column/char->character, max->max_results, depth->call_hierarchy_depth)
      into purity's PARAM_ALIASES (or a semantic PARAM_ALIASES_BY_FUNC block).
      DROP the CUDA-only init param aliases (arch/gpu_arch/cuda_sdk/sdk_path,
      mcp-cuda.py:59-62) — lazy init removes init params [inspector L-new-1].
    details:
      - "purity is first-wins today (mcp-purity.py:175); clangd/cuda are last-wins (mcp-clangd.py:74, mcp-cuda.py:85)."
      - "Without merging clangd's param aliases the semantic handlers' param contract breaks."
    options: []
    status: answered
  - category: security
    question: How are semantic path params confined to the sandbox?
    answer: |
      [security P1, OWASP A01 / CWE-22] Semantic path params (find_definition
      at=, type_at/diagnostics/outline file=) MUST resolve within --project-root,
      reusing the same confinement check the file-IO layer already uses
      (safe_path, mcp-purity.py:46-56). The LSP layer must not be coaxed into
      reading a file outside the sandbox via an absolute or `..` path.
    details:
      - "Apply safe_path before passing any path to the LSP backend's _abs_path/open_document."
      - "This needs its own task — do not bury it in the handler-wiring task."
    options: []
    status: answered

constraints:
  - type: technical
    description: |
      Python 3.9+, standard library ONLY, zero external dependencies (hard
      constraint). The `# dependencies = []` header in mcp-purity.py:4 must stay
      accurate. New imports allowed: pathlib, glob as glob_mod (aliased), shutil.
      Do NOT carry over tempfile (mcp-cuda.py:36 — imported but unused,
      [inspector L1]).
    impact: |
      LSP communication uses only stdlib: asyncio.create_subprocess_exec, json,
      byte-level Content-Length framing — already true of clangd/cuda. Any
      external-dep introduction is a hard failure of the unification.
  - type: technical
    description: |
      Server name "mcp-purity" and entry point "purity_call" are FROZEN. The
      tools/list must keep advertising exactly one tool (purity_call). The server
      only grows inward.
    impact: |
      The project-wide purity_call convention (global CLAUDE.md, skills, minion
      tool-lists) depends on these names — changing them breaks every caller.
  - type: technical
    description: |
      The file-IO / search functions (read_file, create_text_file,
      replace_content, replace_lines, insert_at_line, delete_lines,
      search_for_pattern, list_dir, glob/find_file) must NOT regress — identical
      output to today.
    impact: |
      The file layer is battle-tested; the only change is the one-line
      executor-wrap of the sync handlers in the now-async dispatch path.
  - type: technical
    description: |
      The unified server stays a SINGLE file (Scripts/mcp-purity.py, ~3000
      lines), matching the project's one-file-per-server convention and the
      single-script MCP registration. No new file, no new registration entry.
    impact: |
      Keep clear section banners (FILE LAYER / LSP CORE / CUDA CONFIG / DISPATCH)
      to stay navigable.
  - type: security
    description: |
      [security P1, OWASP A01 / CWE-22] Semantic path params must resolve within
      --project-root, reusing the file-IO confinement check (safe_path,
      mcp-purity.py:46-56).
    impact: |
      Without this, the LSP layer could be coaxed into reading a file outside the
      sandbox via an absolute or `..` path.
  - type: security
    description: |
      [security P2, OWASP A03 / CWE-1333 — ReDoS, LOW] search_for_pattern
      compiles a user-supplied regex; a pathological pattern can cause
      catastrophic backtracking. Pre-existing, NOT introduced by this change.
    impact: |
      The async flip (step 10) runs it in the executor so it no longer freezes the
      event loop, but it still ties up one worker thread. Full mitigation is OUT
      of scope for Phase 0; documented for awareness.
  - type: business
    description: |
      OUT of scope for Phase 0: luals backend (Phase 1); retiring
      clangd_call/cuda_call tools; rewriting p:mcp-clangd / p:mcp-cuda /
      p:mcp-purity skills or minion tool-lists; any change to the global
      purity_call convention in CLAUDE.md (Phase 2).
    impact: |
      clangd_call / cuda_call standalone tools keep running in PARALLEL during
      Phase 0; their retirement is Phase 2. Do not create tasks for deferred work.

success_criteria:
  - "purity_call accepts the 10 new semantic functions: find_definition, find_references, find_implementations, type_at, diagnostics, outline, symbol, symbol_context, inlay_hints, symbol_change_impact."
  - "find_definition / find_references accept either symbol or at (path,line,character) and route to the correct internal handler by post-alias parameter shape."
  - "All legacy names resolve: clangd_find_definition, clangd_find_definition_at, cuda_find_definition, ... all reach the unified canonical handler as DIRECT HANDLERS keys (do not return 'unknown function')."
  - "File-IO and search functions behave identically to today (zero regression)."
  - "glob is canonical for file-glob search; find_file remains an alias."
  - "CUDA symbol-by-name lookup finds static / __device__ symbols via the filesystem-grep fallback (the truncation bug is gone)."
  - "C/C++ and CUDA share one ClangdClient implementation (no byte-for-byte duplication)."
  - "The server is stdlib-only (Python 3.9+, zero external deps) — verified by inspecting the final import block; tempfile is NOT carried over."
  - "The file layer answers immediately with no LSP init; the LSP backend lazily spins up only on a semantic call for a filetype with sources in the project."
  - "A clangd subprocess crash no longer leaves request futures hanging until timeout — pending futures are failed promptly on reader EOF."
  - "tools/list still advertises exactly one tool (purity_call); the rewritten description documents the semantic functions and steers symbol intent, WITHOUT declaring clangd_call/cuda_call retired."
  - "Semantic path params (find_definition at=, type_at/diagnostics/outline file=) are confined to --project-root."
  - "_resolve_aliases is unified onto last-wins, observable via JSON-RPC dispatch."

context_summary:
  error_handling: |
    purity dispatcher (mcp-purity.py:863-878) returns {"error": str(exc)} for
    ValueError/FileNotFoundError/OSError, and {"error": "Internal error in
    '<fn>': <Type>: <msg>"} for anything else; success returns
    {"__raw_text__": "..."}. Semantic B-class functions (type_at, diagnostics,
    outline, find_implementations) return an honest error when the LSP yields
    nothing / has no index — NOT a grep fallback. A-class functions
    (find_definition, find_references, symbol, symbol_context) fall back to the
    grep net on empty/error/no-index.
  memory_management: |
    Not applicable (Python, GC-managed). Subprocess lifecycle: clangd is spawned
    via asyncio.create_subprocess_exec; pending request futures live in
    ClangdClient._pending and must be drained (set_exception) on reader EOF to
    avoid leaking awaiters (bug #2).
  logging_pattern: |
    Python logging module to stderr (logging.getLogger("mcp-purity"); clangd's
    own stderr is passed through to sys.stderr). Log backend lazy-init (start,
    index-ready, prime), fallback tier transitions (workspace_symbol ->
    document_symbol -> grep) at debug level, and clangd-crash detection.
  naming_conventions: |
    snake_case for functions and variables; leading-underscore for module-private
    helpers (e.g. _resolve_aliases, _symbol_to_location, _find_files_with_word,
    _require_backend). Canonical handler functions are handle_<name>; the
    HANDLERS dict maps function-name strings to handler callables.
  key_patterns:
    - "Dict-table dispatch: HANDLERS = {name: handler} looked up by RAW function name (HANDLERS.get(function), line 858) — NOT an if/elif chain; FUNCTION_ALIASES does not route."
    - "Two-tier param aliasing: PARAM_ALIASES_BY_FUNC (per-function) takes precedence over PARAM_ALIASES (global), resolved by _resolve_aliases(params, function)."
    - "Async MCP loop with executor-wrapped blocking stdin (loop.run_in_executor(None, sys.stdin.readline)); tools/call path to be promoted async with executor-wrapped sync file handlers."
    - "LSP request/response correlation: integer id + loop.create_future() stored in _pending, awaited via asyncio.wait_for(fut, timeout) (mcp-clangd.py:455-466)."
    - "3-tier _symbol_to_location cascade: workspace_symbol (with retries) -> document_symbol on preferred file -> grep tree + document_symbol on candidates (mcp-clangd.py:808-901)."
    - "Sandbox confinement via safe_path(project_root, rel, strict) (mcp-purity.py:46-56)."
    - "Subprocess JSON-RPC smoke test harness (_mcp_smoke_test.py): Server(Popen) wrapper, check(name, cond, detail), run_server(cfg) conversation driver, SERVERS list; invariants protocolVersion '2024-11-05', serverInfo.version '1.0.0', error codes -32601/-32603."

