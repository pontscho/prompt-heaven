      size_rationale: ~130 lines of validation with one-line refusals for every rule.
      implementation_details: |
        (plan:768-781, plan:516-520)
        class ChildSpec(NamedTuple): name: str; argv: Tuple[str, ...]; env: Dict[str, str];
            call_timeout: float; startup_timeout: float
        class ProxyConfig(NamedTuple): root: str; children: Tuple[ChildSpec, ...]; max_frame: int

        def load_config(path: Optional[str], inline: Optional[str], cli_root: Optional[str]) -> ProxyConfig:
          - Exactly one of path / inline, else ConfigError.
          - path: os.stat; refuse st_mode & (stat.S_IWGRP | stat.S_IWOTH) and
            st_uid != os.geteuid() (ConfigError naming the rule).
          - json.loads; a JSONDecodeError -> ConfigError with line and column (exc.lineno, exc.colno).
          - top level must be a dict; keys within {"root", "children", "frame_limit"}.
          - Root: cli_root and config root both present with differing os.path.realpath ->
            ConfigError (ADR 0015); neither -> ConfigError; the resolved root must be an existing
            directory.
          - children: non-empty list; each a dict with keys within {"name", "command", "args",
            "env", "wrapper", "call_timeout", "startup_timeout"}.
          - name: str matching _CHILD_NAME_RE; unique.
          - command: non-empty str; absolute, or a bare name resolved with shutil.which (store the
            resolved path); a relative path containing "/" refused as ambiguous.
          - args, wrapper: List[str]. A non-empty wrapper's wrapper[0] gets the same check as
            command (L4 round 3). env: Dict[str, str]; an env key == _TOKEN_ENV refused (FR-11).
          - call_timeout / startup_timeout: int or float, NOT bool, 0 < x <= _MAX_CALL_TIMEOUT_S;
            defaults _DEFAULT_CALL_TIMEOUT_S / _DEFAULT_STARTUP_TIMEOUT_S.
          - Each args element exactly "{root}" replaced by the resolved root (no substring).
          - frame_limit: int (not bool) within _FRAME_RANGE inclusive, default _MAX_FRAME; stored as
            ProxyConfig.max_frame. Read it with a literal key "frame_limit" (never a max_*_bytes
            literal: CAP_PARAM_RX, R-24).
          - argv built with build_child_argv.
        def build_child_argv(wrapper: List[str], command: str, args: List[str]) -> Tuple[str, ...]:
