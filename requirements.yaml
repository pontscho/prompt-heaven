requirements:
  - category: architecture
    question: "D1: How much TLS does the client implement, and is certificate verification in scope?"
    answer: >-
      Full TLS 1.3 including X25519MLKEM768. Certificate chain and CertificateVerify are NOT
      verified in round one; this is declared loudly in the module docstring, the webfetch tool
      description, the webfetch status line, the response flag cert_verified=False and ADR 0026.
      Source: user (binding decision D1, plan:152). Since D15 the unverified Chrome path is no
      longer the default transport (see the D15 requirement below).
    details:
      - "Implemented in Steps 5-6 (engine), 9 (cert_verified flag), 13 (tool description, status line, cache entry), 15 (ADR 0026) -- plan:152."
      - "A MITM on the Chrome path receives page content, the session cookie jar and every POST body (plan:785, plan:870)."
    options: ["full TLS 1.3 without cert verification (chosen)", "full TLS 1.3 with cert verification"]
    status: answered
  - category: dependencies
    question: "D2: Which third-party HTTP backends survive, and how many browser profiles are kept?"
    answer: >-
      Drop primp AND curl_cffi everywhere. ALLOWLIST becomes {yaml, tomli}; webfetch EXCEPTIONS
      becomes {bs4, markdownify}; one profile, Chrome 153 macOS; ADR 0004's impersonation branch
      is superseded by an addendum. Source: user (D2, plan:153).
    details:
      - "Removal per consumer in Steps 11, 12, 13; EXCEPTIONS shrink in Step 13; ALLOWLIST shrink in Step 14 (plan:153)."
    options: ["drop both (chosen)", "keep curl_cffi as fallback"]
    status: answered
  - category: dependencies
    question: "D3: How are brotli and zstd bodies decoded without third-party packages?"
    answer: >-
      Through ctypes against the system shared libraries (libbrotlidec, libzstd), in two new
      canonical sources _mcp_brotli.py and _mcp_zstd.py, with Linux and macOS search paths; on
      Linux find_library is never called (FLAG-1). Source: user (D3, plan:154).
    details:
      - "Lazy load on the first br/zstd body; absent library -> one-line message, body reported undecodable (plan:34-39)."
    options: ["ctypes to system libs (chosen)", "pure-Python brotli/zstd decoders", "advertise gzip/deflate only"]
    status: answered
  - category: interface
    question: "D4: Which HTTP methods and request profiles are supported, and where do the profiles come from?"
    answer: >-
      GET (navigate and cors profiles), HEAD and form-encoded POST (cors). The cors/POST/HEAD
      profiles are MEASURED from real Chrome on loopback first (Step 2); the scratch dump server
      is extended first (multi-stream, DATA capture). Source: user (D4, plan:155).
    details: ["Step 1 extension, Step 2 measurement, Step 7 profiles, Step 9 API (plan:155)."]
    options: ["measure first (chosen)", "guess from Chromium source"]
    status: answered
  - category: architecture
    question: "D5: Are the new sources imported by hosts or generated into them, and how does the client reach the decoders?"
    answer: >-
      Generate, never import (ADR 0025). Three canonical sources, one domain each (ADR 0014).
      Decoders are injected by the HOST (decoders={"br": _brotli_decompress, "zstd": _zstd_decompress});
      _mcp_chrome never names a brotli/zstd block. Source: user (D5, plan:156).
    details: ["A region's names resolve only against its own source, so direct calls would be refused at END (plan:689-690)."]
    options: ["three sources + injection (chosen)", "one merged source", "a fourth _mcp_ctypes.py shelf"]
    status: answered
  - category: implementation
    question: "D6: What happens to the scratch capture harness?"
    answer: >-
      Promoted to the maintained tool Scripts/chrome_capture.py (stdlib, loopback only); the
      refresh procedure is documented end to end in the wiki; ADR 0004 gets an addendum for the
      deliberate pin. Source: user (D6, plan:157).
    details: ["Step 1 (tool), Step 15 (refresh page + addendum)."]
    options: ["promote to Scripts/ (chosen)", "keep in .claude/tmp"]
    status: answered
  - category: data
    question: "D7: Which test fixtures are committed and how are optional tools handled?"
    answer: >-
      Committed test-only fixtures tests/files/tls/ (test-only CA + leaf it signs, FLAG-4) and
      tests/files/enc/; openssl rows are INFO when absent; lib-path tests run under a stubbed
      platform. Source: user (D7, plan:158).
    details: ["The CA private key is NOT committed (plan:988)."]
    options: ["commit fixtures (chosen)", "generate at test time"]
    status: answered
  - category: architecture
    question: "D8: Scope of consumers, ALPS, response object, SSRF and body limits?"
    answer: >-
      search_github.py is the third consumer; client ALPS EE implemented from Chromium/BoringSSL
      and validated live on ONE Google host with user OK; a requests-like Response; a
      connect-address policy closes the SSRF TOCTOU and re-vets every redirect; max_bytes aborts
      early; webfetch keeps its uv launch (bs4, markdownify, lxml); a roadmap item continues R-0017.
      Source: user (D8, plan:159).
    details: ["Steps 6, 9, 10, 11, 13, 15 (plan:159)."]
    options: ["as stated (chosen)"]
    status: answered
  - category: interface
    question: "D9: Is HTTP/1.1 in scope?"
    answer: >-
      Yes: over TLS when the server selects ALPN http/1.1, and cleartext for http:// URLs.
      Source: user (D9, plan:160).
    details: ["Step 2 sets 5-6, Step 8."]
    options: ["h1 in scope (chosen)", "h2 only"]
    status: answered
  - category: security
    question: "D10: How are TLS 1.2-only servers handled?"
    answer: >-
      The Chrome client stays TLS 1.3 and raises ChromeTls12Error. An opt-in fallback
      (tls12_fallback=True) re-issues the hop via http.client.HTTPSConnection +
      ssl.create_default_context() (certificates VERIFIED), connecting only to the vetted
      addresses; response impersonated=False, cert_verified=True. On for webfetch, off for both
      search scripts. urllib is never used (it honours *_PROXY). Source: user (D10, plan:161).
    details:
      - "Step 6 (ChromeTls12Error), Step 9 (fallback), Steps 11-13 (per-host switch)."
      - "[D15] The fallback can fire only on a session opened with transport=\"chrome\" (webfetch's profile=\"chrome\"); on the verified default transport tls12_fallback is inert, because ssl negotiates TLS 1.2 itself (plan:59, plan:764)."
    options: ["opt-in verified fallback (chosen)", "no TLS 1.2 support", "impersonated TLS 1.2"]
    status: answered
  - category: security
    question: "D11: Is HelloRetryRequest implemented in round one?"
    answer: >-
      Yes: pure-Python P-256 ECDH plus a Chrome-faithful second ClientHello whose shape is
      measured on loopback first (Step 2 set 9); message_hash transcript per RFC 8446 4.4.1.
      Source: user (D11, plan:162).
    details: ["Step 1 --hrr-group responder, Step 2 set 9, Step 5 P-256, Step 6 HRR state machine."]
    options: ["implement HRR (chosen)", "fail clearly on HRR"]
    status: answered
  - category: security
    question: "D12: Proxy support?"
    answer: "None. The client ignores every *_PROXY environment variable and never reads os.environ for networking. Source: user (D12, plan:163)."
    details:
      - "Step 9 test + docstring, Step 13 tool description, Step 15 ADR 0026."
      - "[D16, S4] Declared, not gated: ssl.create_default_context() (the verified transport and the TLS 1.2 fallback) loads OpenSSL's default trust store, which honours SSL_CERT_FILE / SSL_CERT_DIR, and CPython honours SSLKEYLOGFILE (3.8+, unless -E) (plan:87, plan:1703)."
    options: ["no proxy (chosen)", "honour HTTPS_PROXY"]
    status: answered
  - category: implementation
    question: "D13: Which decision records are written?"
    answer: "A new ADR 0026 for the client; ADR 0004 and ADR 0024 get short addenda pointing to it. Source: user (D13, plan:164)."
    details: ["Step 15; addenda only through ClaudeCode/skills/wiki/scripts/addendum.py."]
    options: ["ADR 0026 + two addenda (chosen)"]
    status: answered
  - category: implementation
    question: "D14 / FLAG-3: Which stale docs/spec-ddg.md references are fixed, and when?"
    answer: >-
      All six (Scripts/search_duckduckgo.py:44, :72; Scripts/search_github.py:41, :73;
      Scripts/mcp-webfetch.py:97, :153) become docs/concepts/spec-ddg.md in Step 0, before and
      independent of the consumer commits. Source: user (D14, widened by FLAG-3, S035; plan:165, plan:200).
    details: ["Comment text only; verified live: exactly six hits of docs/spec-ddg.md under Scripts/."]
    options: ["fix all six in Step 0 (chosen)", "fix only :44"]
    status: answered
  - category: security
    question: "FLAG-1 / G-j: What is the per-platform shared-library load order?"
    answer: >-
      Linux (linux*): bare soname, then explicit Linux absolute paths; ctypes.util.find_library
      is NEVER called on Linux (it spawns gcc/cc, objdump, ld with inherited stdin -- the
      mcp-webfetch JSON-RPC pipe). macOS (darwin): bare soname, then find_library (dyld_find,
      spawns nothing), then explicit macOS paths. Any other platform: bare soname only. Lazy,
      race-free publication. Source: user (FLAG-1, S035; plan:34-37, plan:188, plan:198).
      [SUPERSEDED 2026-10-01 by F36 (user, S040): darwin tries absolute paths only -- no bare
      soname, a find_library answer only if absolute; Linux unchanged; see ADR 0026 Deviations]
    details:
      - "R16 is ELIMINATED on Linux, not mitigated (plan:797)."
      - "A stubbed-platform test proves ZERO find_library calls in every Linux scenario (plan:1029)."
    options: ["no find_library on Linux (chosen)", "find_library as mitigated step 2"]
    status: answered
  - category: security
    question: "FLAG-2: Which HRR groups are accepted?"
    answer: >-
      P-256 (0x0017) only. An HRR selecting P-384 (0x0018) fails with
      "tls: HelloRetryRequest selected secp384r1 (not implemented)"; declared, and a roadmap
      follow-up is opened. Source: user (FLAG-2, S035; plan:199).
    details: ["A group already shared or not in supported_groups (0x0019, GREASE) is illegal_parameter (plan:1129)."]
    options: ["P-256 only (chosen)", "P-256 and P-384"]
    status: answered
  - category: data
    question: "FLAG-4: How do tests anchor certificate trust without VERIFY_X509_PARTIAL_CHAIN (3.10+)?"
    answer: >-
      By construction: a committed test-only CA (critical CA:TRUE, keyCertSign/cRLSign, SKID) and
      a leaf it signs (CA:FALSE, serverAuth, SAN localhost/*.localhost/127.0.0.1, AKID); every
      verifying test trusts the CA only via an injected ssl_context_factory. CA private key not
      committed. Source: user (FLAG-4, S035; plan:201, plan:984-990).
    details: ["The fallback's default context never loads tests/files/tls/ (AST row, plan:1334)."]
    options: ["test CA + leaf (chosen)", "self-signed leaf as anchor"]
    status: answered
  - category: security
    question: "M5: What happens when a caller overrides a fingerprint-bearing header?"
    answer: >-
      It RAISES a one-line ChromeClientError("headers: <name> is fixed by the Chrome profile") for
      user-agent, accept-encoding, priority, sec-ch-ua*, sec-fetch-*, and pseudo-headers. Source:
      orchestrator decision, round 1 (plan:166).
    details: ["Step 7 _ch_check_caller_headers; Step 13 webfetch pre-check before the cache read; _CACHE_IRRELEVANT_REQUEST_HEADERS -> {referer}."]
    options: ["refuse (chosen)", "silently drop", "let override"]
    status: answered
  - category: security
    question: "R2-M4 (+R2-N1, M-1): In what order are caller headers validated, and what may a refusal message contain?"
    answer: >-
      Per (name, value), first failure wins: (1) CR/LF/NUL in name or value ->
      "headers: <repr(name)[:40]> contains CR, LF or NUL"; (2) name starting with ':' ->
      "headers: <repr(name)[:40]> is fixed by the Chrome profile"; (3) not a non-empty RFC 9110
      token -> "headers: invalid header name <repr[:40]>"; (4) fingerprint-bearing -> "headers:
      <name> is fixed by the Chrome profile"; (5) framing/connection (host, content-length,
      transfer-encoding, connection, te, upgrade, keep-alive, proxy-*) -> "headers: <name> is
      connection framing, owned by the Chrome profile". Then a value that does not encode
      latin-1 -> "headers: <name> value is not latin-1". Every message is one line and never
      echoes a raw name or any value. A caller Cookie is allowed: jar cookies first, then the
      caller's crumbs, dropped cross-origin. Source: orchestrator, S035 (plan:61-73, plan:168, plan:1178-1187).
    details: ["Closes CWE-113 / CWE-444, which primp/curl_cffi used to own (plan:72)."]
    options: ["five-rule order + latin-1 (chosen)"]
    status: answered
  - category: security
    question: "Non-latin-1 header values?"
    answer: "Refused with the one-line \"headers: <name> value is not latin-1\" after the five rules pass. Source: orchestrator, S035 (R2-M4; plan:68, plan:1185)."
    details: ["Values are encoded latin-1 for h1 and HPACK."]
    options: ["refuse (chosen)", "encode utf-8"]
    status: answered
  - category: security
    question: "R2-M2: How are IPv4-mapped, NAT64 and 6to4 addresses classified by the SSRF policy?"
    answer: >-
      IPv4-mapped (::ffff:0:0/96): classify ONLY the embedded IPv4 (::ffff:8.8.8.8 allowed,
      ::ffff:10.0.0.1 refused, on every 3.9 patch release). NAT64 64:ff9b::/96, local-use NAT64
      64:ff9b:1::/48 and 6to4 2002::/16: the WHOLE prefix is refused, fail-closed. Otherwise
      refused when loopback, link-local, private, reserved, multicast, unspecified or not
      is_global (catches 100.64.0.0/10). Source: orchestrator, S035 (plan:167, plan:574-579).
    details: ["An unparseable address or an empty resolver answer is refused (fail closed)."]
    options: ["embedded-IPv4 + whole-prefix refusal (chosen)"]
    status: answered
  - category: interface
    question: "R2-M5: Which transport label does webfetch show for cached and revalidated answers?"
    answer: >-
      The cache entry records transport and cert_verified; a revalidated answer shows the WEAKER
      of the stored entry's and the 304's transport (unknown < chrome = cleartext < tls12-fallback
      = verified, a tie keeping the entry's label [D15]) and writes it back; the label sits on the
      status line, (cached)/(revalidated) stays on the title line; raw mode shows no label and the
      tool description says so. Source: orchestrator, S035 (plan:169, plan:1617-1621).
    details:
      - "An entry written before the change shows 'via unknown transport'."
      - "[D15, D16 S3] Cache admission: a request WITHOUT profile admits an entry only if cert_verified is True, or transport is cleartext AND the requested URL is http://; every other entry is dropped (not served, not revalidated) and overwritten by the fresh verified answer (plan:1583, plan:1619)."
    options: ["weaker-of-two, written back (chosen)"]
    status: answered
  - category: interface
    question: "R2-M6: How are body-size limits reported, and does the non-textual refusal still come first?"
    answer: >-
      ChromeBodyTooLarge(ChromeClientError) carries .limit; str() is "body: exceeds <limit> bytes".
      webfetch maps it to "body exceeds max_bytes=%d" (N = exc.limit). The non-textual refusal is
      decided from the response HEADERS first, via an on_headers callback, before any body byte
      or size decision. max_bytes=0 means CH_MAX_BODY_BYTES (wire) / CH_DEFAULT_DECODE_CAP
      (decoded), never unbounded; the tool description says so. Source: orchestrator, S035 (plan:170, plan:587, plan:591-592).
    details: ["Nothing is truncated silently."]
    options: ["typed exception + on_headers (chosen)"]
    status: answered
  - category: interface
    question: "Decoder contract when output would exceed the cap (part of R2-M6)?"
    answer: >-
      decoder(data, max_output) raises OverflowError when output would exceed max_output,
      ValueError on a corrupt/truncated stream or inconsistent decoder state, LookupError when the
      library is absent. The session maps OverflowError to ChromeBodyTooLarge(limit) and
      ValueError/LookupError to Response.decode_error. Source: orchestrator, S035 (plan:591, plan:1020).
    details: ["zstd raises OverflowError(\"zstd: output exceeds %d bytes\") the same way (plan:1020)."]
    options: ["OverflowError (chosen)", "ValueError for everything"]
    status: answered
  - category: security
    question: "R2-N3: What permits an https->http redirect hop?"
    answer: >-
      Only the named session flag allow_downgrade=True (webfetch sets it; the search scripts do
      not). The SSRF connect_policy never grants a downgrade; the hop is still re-vetted by the
      policy. Without the flag: "redirect: https to http downgrade refused". Source:
      orchestrator, S035 (plan:79, plan:171, plan:588).
    details: ["A caller-supplied http:// first URL is not a downgrade and needs no flag."]
    options: ["named session flag (chosen)", "policy decides"]
    status: answered
  - category: security
    question: "Cookie jar behaviour at its caps (R2-M3)?"
    answer: >-
      Over CH_MAX_COOKIES_PER_DOMAIN (180), CH_MAX_COOKIES (3000) or CH_MAX_COOKIE_BYTES (4096,
      len(name)+len(value)) the NEW cookie is refused and every stored cookie is kept; replacing
      an existing (name, domain, path) never counts as new. The jar never evicts, a deliberate
      deviation from Chromium's LRU GC, declared in ADR 0026. Source: plan round-2 finding R2-M3,
      applied (plan:672, plan:1271-1272).
    details: ["Exact boundary rows N passes / N+1 refused (plan:1306)."]
    options: ["refuse new (chosen)", "evict LRU"]
    status: answered
  - category: implementation
    question: "M4: How are generated block names kept from colliding in host namespaces?"
    answer: >-
      Every block name starts with a prefix from its source's DECLARED set: _mcp_chrome.py
      _ch_/_Ch/CH_/_CH_; _mcp_brotli.py _br_/BR_/_BR_; _mcp_zstd.py _zstd_/_Zstd/ZSTD_/_ZSTD_.
      Named exceptions, and only these: CHROME_PROFILE, _chrome_profile, _brotli_decompress,
      ChromeClientError, ChromeTls12Error, ChromeBodyTooLarge (_zstd_decompress is covered by
      its prefix). Group K of each source suite tests exactly this set. Source: plan round-1
      finding M4 + R2-L9, applied (plan:253-259).
    details: ["A declared exception that no longer exists also FAILs."]
    options: ["declared prefix sets (chosen)"]
    status: answered
  - category: implementation
    question: "Are Python assert statements allowed for defensive checks in production code?"
    answer: >-
      No. python3 -O strips asserts, so every defensive check in _mcp_chrome.py, _mcp_brotli.py,
      _mcp_zstd.py and the host glue is `if <bad>: raise <module error>`. Group K of the source
      suites finds no ast.Assert node, with a synthetic one-assert negative control. Source:
      orchestrator note, round 3 (plan:1046, plan:1095, plan:1245).
    details: ["The h1 CR/LF/NUL second-line guard is the named case (plan:1245)."]
    options: ["no assert (chosen)"]
    status: answered
  - category: implementation
    question: "Which frames are exempt from the h2 control-frame flood budget?"
    answer: >-
      Exactly two one-shot exemptions: the server's connection-preface SETTINGS and the ONE
      SETTINGS ACK answering our preface SETTINGS. Every other SETTINGS, every PING, RST_STREAM
      and unknown-type frame counts toward CH_MAX_H2_CONTROL_FRAMES. Source: orchestrator, S035
      (plan:485, plan:1196).
    details: ["Unknown frame types are ignored per RFC 9113 4.1 but counted (plan:1199)."]
    options: ["two one-shot exemptions (chosen)"]
    status: answered
  - category: security
    question: "D15: Which transport is the default, and when is the unverified Chrome path used?"
    answer: >-
      The VERIFIED stdlib transport (_ChFallbackConnection: ssl_context_factory().wrap_socket,
      CERT_REQUIRED + check_hostname, the profile's headers in h1 spelling) is the default
      everywhere: _ch_session_new(..., transport="verified"). The Chrome path (_ChTls; certificate
      chain and CertificateVerify NOT verified) is an explicit opt-in: webfetch profile="chrome"
      (alias impersonate), no automatic escalation (a hint line instead); in the two search
      scripts it is a fallback taken only after an observed bot block (one Chrome re-issue, then
      a per-process, per-host sticky switch, never persisted). The "cert NOT verified" label stays
      wherever the Chrome path answers, fresh or cached. Follow-up roadmap item: implement
      certificate verification in _ChTls so fingerprint and authenticity stop being a trade-off.
      Source: user, 2026-09-30, answering peer-review finding 2 (plan:14, plan:172).
    details:
      - "Response.transport is \"verified\" | \"chrome\" | \"tls12-fallback\" | \"cleartext\" (plan:27, plan:80-85)."
      - "Implemented in Step 9a (task-057), Step 10 (task-038 verified rows), Steps 11-13 (task-041..task-050), Step 15 (task-052, task-055, task-056) (plan:172)."
      - "Rejected alternatives: Chrome path as default, a separate verified class or a rename, a per-query probe, a persisted switch, a webfetch transport= argument, automatic escalation, an honest UA (plan:701-720)."
    options: ["verified default, Chrome opt-in / block fallback (chosen)", "Chrome path default (rounds 0-2)"]
    status: answered
  - category: security
    question: "D16: How are the round-3 validator findings on D15 resolved (block rules, labels, test call sites, refusal prefix, declared limits)?"
    answer: >-
      (C1) every test session that means the Chrome path says transport="chrome": with_session and
      with_policy default to it, and every direct _ch_session_new( call passes transport= or is a
      declared default-transport row (enforced by a group P AST row with a negative control);
      (H1) task-057 includes those call-site edits and group P, and task-037's remaining Linux G5
      run follows task-057; (H2) D15 code anchors are symbols; (M1) a refusal's prefix is the hop's
      transport label (verified: / tls12-fallback:; "timeout: verified timed out"); (M2 + S-Q1b) a
      transport-level failure on the verified path is never a block: no Chrome session, no sticky
      switch; (M3) 429 and 5xx are never a block, 403 is, on grep.app and Bing; Bing's 200 that
      parses to [] stays deferred (R25); (M4) _run_bing(queries) owns its session; (L1) the DDG
      runner's Bing leg rotates with _transport_for("bing"); (L2) "No results found." carries no
      label; (S1) DDG's block is zero results AND a structural challenge marker, never a body
      substring; (S2) a block is judged only on the endpoint's own host; (S3) the label is the
      redirect chain's weakest hop, and a default webfetch request is served a cache entry only
      if cert_verified=True or it is cleartext for an http:// URL; (S4) the environment sentence
      (SSL_CERT_FILE / SSL_CERT_DIR / SSLKEYLOGFILE) is declared; (S5) the decoded-size cap is
      proven on the verified transport, whose head limits are http.client's.
      Source: orchestrator, 2026-09-30, resolving the round-3 validator reports (plan:16, plan:173).
    details:
      - "Block rules: plan:86, plan:1482-1486 (grep.app), plan:1532-1543 (DDG, Bing)."
      - "Chain label and refusal prefix: plan:766-767; cache admission: plan:1619."
      - "Declared limits recorded in ADR 0026 (task-052): S4, M2 (a WAF that resets the Python TLS fingerprint gets no Chrome fallback), M3 (Bing 200 challenge), S1 fallback predicate, S5 (plan:1697-1704)."
    options: ["as resolved by the orchestrator (chosen; not re-opened)"]
    status: answered

constraints:
  - type: technical
    description: "Python 3.9 + stdlib only (ADR 0024); no 3.10+ API (int.bit_count, zip/map strict=, to_bytes/from_bytes without byteorder at index 1 or keyword, match, PEP 604 at runtime, itertools.pairwise, bisect key=, create_connection all_errors=, hashlib.file_digest, ssl.VERIFY_X509_PARTIAL_CHAIN)."
    impact: "Enforced by a NEW py_deps AST rule over NEW_39_SCOPE (task-011) and by running mcp_chrome/mcp_decoders/chrome_capture under a real Python 3.9 at G3 and G5 (plan:90)."
  - type: technical
    description: "Every block of the three new sources must be tab-safe (no newline inside open brackets, whole 4-space indents, no backslash continuation) and a generator block shape (top-level def/class/single-target Assign); no duplicate top-level names; no typing annotations."
    impact: "The PoC must be rewritten, not copied: _HUFF_DEC for-loop, _SBOX double assignment, multi-line calls and backslash continuations (plan:250-252). The tab-unsafe set over all registered text must stay exactly [\"_rows_note\"] (plan:91)."
  - type: technical
    description: "Sources stay UNREGISTERED in CANONICAL_NAMES until the first host (Step 11), because every-source-in-use fails a registered source no host uses."
    impact: "Steps 4-9 test the sources by direct load (load_module_from_path); their own group K gates tab safety and block shape (plan:261)."
  - type: technical
    description: "Block closure: a block reads only builtins, its args, the stdlib names the host imports, and blocks co-listed on the SAME marker, dependency first; host_provides counts only module-level imports."
    impact: "_mcp_chrome blocks spell urllib.parse.urlsplit(...) (never a bare urlsplit); each host takes ALL names of each new source in source order on one marker (G-c) (plan:239-241, plan:251)."
  - type: technical
    description: "SUITES case counts are written only in tests/run.py SUITES, from the `ran M` of a GREEN run, never typed ahead; drift is a hard FAIL."
    impact: "Every task that adds cases updates its suite's count after a green run; counts never appear in docstrings (plan:651)."
  - type: technical
    description: "py_deps EXCEPTIONS liveness and control fixtures: an EXCEPTIONS entry exempting a name the file no longer imports FAILs; the negative-control fixtures name primp/curl_cffi."
    impact: "webfetch's EXCEPTIONS shrink ships in the Step 13 commit; the ALLOWLIST shrink and control retarget ship together in the Step 14 commit (plan:263-264)."
  - type: business
    description: "Risk-first rollout: no consumer loses its primp/curl_cffi backend until the stdlib client passes the loopback gates AND the user-authorized live gate G6; one consumer per commit (search_github, then search_duckduckgo, then webfetch)."
    impact: "Each consumer commit can be reverted alone (plan:722-723, plan:796)."
  - type: business
    description: "User-gated work: Step 2 drives the user's Chrome via gdc; the G2/G5 Linux runs need a Linux host (task-037's remaining G5 run is on host t42, user-approved); every live request (Step 10 and the Steps 11-13 samples) needs explicit user OK with the request count stated up front."
    impact: "task-005, task-012, task-037, task-038 and the live samples of task-042/044/050 must stop and ask (plan:1414, plan:1505, plan:1562, plan:1665)."
  - type: security
    description: "Certificates are NOT verified on the Chrome path; this must be declared in the module docstring, the webfetch tool description/status line/report header, the response flag, the search scripts' per-result label and ADR 0026 (plan:57)."
    impact: "webfetch cache entries record transport and cert_verified so cached answers stay honest, and a default request is never served a Chrome-path (or downgrade-produced cleartext) entry [D15, D16 S3] (plan:785)."
  - type: security
    description: "[D15] The verified stdlib transport is the DEFAULT; no production host opens a Chrome-path session except webfetch under profile=\"chrome\" and the search scripts after an observed block on the endpoint's own host [D16 S2]. A transport-level failure on the verified path is never a block (no Chrome session, no sticky switch) [D16 M2]; 429 and 5xx are never a block [D16 M3]; DDG's block is structural, never a body substring [D16 S1]."
    impact: "Otherwise an active MITM or attacker-reflected text could force the downgrade to the unverified transport; gated by group M rows (task-042, task-044) and the host AST rows that confine create_session(\"chrome\") to block branches (plan:86, plan:136-140, plan:788-790)."
  - type: security
    description: "Logging is structure-only (ADR 0011): frame types, lengths, group/cipher ids; never header values, cookies, bodies, query strings, or at INFO the SNI. Refusal messages are return values, never logged above DEBUG, and the DEBUG line carries the phase, not the text."
    impact: "The client takes an injected log callable (plan:104, plan:864)."
  - type: security
    description: "Per-hop SSRF policy: one normaliser (_ch_split_url), ordered vetted address list, any-refused, fail closed, scheme check and downgrade flag OUTSIDE the policy, every path/hop/retry through the policy (the verified transport included: it opens its socket through _ch_open_socket), and every production host has a policy."
    impact: "Closes the resolve/connect TOCTOU and the redirect-to-metadata hole (plan:753-763)."
  - type: security
    description: "Neither the client nor the decoders spawn anything; chrome_capture.py's one subprocess (openssl req) passes explicit stdin=subprocess.DEVNULL."
    impact: "spawn_stdin suite must stay green (plan:105)."
  - type: technical
    description: "Temporary files only under .claude/tmp/; docs/roadmap/ and docs/INDEX.md are never hand-edited (roadmap.py and /p:wiki reindex only); ADR addenda only through addendum.py with staged JSON."
    impact: "Step 15 stages under .claude/tmp/ (plan:475)."

success_criteria:
  - "G1 (profile): committed Chrome 153 captures under tests/files/chrome/153/ cover navigate GET, cors GET, cors POST (form), cors HEAD, a same-connection navigate-then-fetch pair (stream 1 then 3), h1-over-TLS and plaintext http:// navigations, an IP-literal navigation, a navigation with a cookie, and a post-HRR second ClientHello; the client reproduces each captured HEADERS block and CH2's structure byte-identically modulo GREASE/random values in the diff report's varying set (plan:109-115)."
  - "G2 (decoders): .br/.zst fixtures decode byte-exact on macOS AND one real Linux host; bomb and over-window zstd fixtures refused; missing library -> INFO rows and a one-line message; Linux makes ZERO find_library calls in every scenario and macOS none after a bare-soname hit [SUPERSEDED 2026-10-01 by F36: darwin tries absolute paths only, so there is no bare-soname hit; see ADR 0026 Deviations]; two threads racing the first load both decode correctly (plan:116)."
  - "G3 (crypto/perf): KATs pass for X25519 (RFC 7748 5.2, 6.1), P-256 ECDH, AES-GCM, ChaCha20-Poly1305 (RFC 8439 2.8.2), HKDF (RFC 5869) and the RFC 8448 section 3 key schedule; ML-KEM cross-checked both directions with openssl >= 3.5 when present; AES-256-GCM decrypt >= 0.5 MiB/s on the dev Mac; mcp_chrome, mcp_decoders and chrome_capture also pass under a real Python 3.9 (INFO when unavailable) (plan:117-125, plan:1098)."
  - "G4 (TLS): handshakes complete against an in-memory ssl.MemoryBIO server, a loopback Python ssl server and a scripted TLS 1.3 peer; every refusal (TLS 1.2 ServerHello, record 16641 refused / 16640 accepted, bad Finished, bad GCM tag, alert, second HRR, HRR to unoffered group, HRR to P-384, cipher mismatch after HRR, wrong-length key share, unknown post-handshake message) produces the specified error; HRR->P-256 and client ALPS EE accepted by the scripted peer (plan:126)."
  - "G5 (E2E loopback): the request API works over h2, h1-over-TLS and cleartext h1 including redirects, cookies, gzip/br/zstd, max_bytes early abort, ordered address fallback, per-hop policy refusal (one row per bypass form), cross-origin header dropping and Referer, resource-ceiling refusals, GOAWAY/RST, timeouts, verified TLS 1.2 fallback and *_PROXY ignored; groups A-J also pass under a real Python 3.9; [D16 H1] the Linux G5 run (task-037, on t42) runs after task-057 and includes group P (plan:127, plan:1339, plan:1395, plan:1807)."
  - "G6 (live, user-authorized): DDG POST returns results or a CAPTCHA page; Bing GET 200 with parsed results; grep.app cors GET 200 JSON; one webfetch-style GET of an ordinary site succeeds; one Google host with ALPS negotiated completes; on loopback the client's JA4 equals t13d1517h2_8daaf6152771_cb7bf5808d99 as computed by the independent chrome_capture parser (plan:128-134)."
  - "G6 verified transport [D15]: the webfetch-style GET of an ordinary site succeeds with transport=\"verified\", cert_verified=True; the DDG, Bing and grep.app requests are repeated over it and each answer is RECORDED (a block is a result, not a failure) with its block shape, final-URL host and, for DDG, the structural location of the challenge marker (plan:135, plan:1414, plan:1417)."
  - "SC-8 [D15, D16]: _ch_session_new()'s default is transport=\"verified\"; no production host opens a Chrome-path session except webfetch under profile=\"chrome\" and the search scripts after an observed block; every Chrome-path answer a consumer returns carries the \"cert NOT verified\" label, fresh or cached (plan:136)."
  - "SC-8 [D16]: no verified-path transport failure and no response from a host other than the endpoint's own ever opens a Chrome session or sets the sticky switch; no attacker-reflected text (query, snippet) makes DDG's block predicate true (group M rows) (plan:137-138)."
  - "SC-8 [D16]: a redirect chain with any Chrome hop is labelled chrome with cert_verified=False; a default webfetch https request is never served a cache entry that is not cert_verified=True; every verified-transport refusal begins verified: (or timeout: verified); the decoded-size cap applies on the verified transport exactly as on the Chrome path (groups P and O) (plan:139-140)."
  - "SC-7: no primp/curl_cffi string remains outside docs history and .claude/ (plus the new unlisted_primp.py control)."
