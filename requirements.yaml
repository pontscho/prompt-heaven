      description: "Step 4: kill-before-reap primitives _wait_exit_unreaped (kqueue NOTE_EXIT / waitid WNOWAIT), _sweep and _write_status"
      file_path: /Users/zoltan.ponekker/Code/prompt-heaven/ClaudeCode/skills/sandbox-run/scripts/sbx
      function_name: _wait_exit_unreaped / _sweep / _write_status
      type: create
