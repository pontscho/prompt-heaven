context_summary:
  error_handling: >-
    One error family: ChromeClientError(ConnectionError), with ChromeTls12Error(ChromeClientError)
    (server chose TLS 1.2; the session may fall back) and ChromeBodyTooLarge(ChromeClientError)
    carrying .limit. Pattern P2 = Scripts/_mcp_websocket.py:91-96 (WebSocketError(ConnectionError)).
    Every message is ONE line "<phase>: <what>" (tls:, h2:, h1:, headers:, redirect:, policy:,
    connect:, body:, timeout:, url:, transport:, verified:, tls12-fallback:), e.g. "tls: server
    chose TLS 1.2", "h2: frame of 70000 bytes exceeds 16384", "connect: all 2 addresses failed:
    <last error>". [D16 M1] On _ChFallbackConnection the prefix is the hop's transport label:
    "verified: certificate verify failed: ..." on the default transport, "tls12-fallback: ..." on
    the fallback; a timeout keeps the timeout: phase first ("timeout: verified timed out").
    socket.timeout -> ChromeClientError("timeout: ..."). Decoders raise OverflowError (budget),
    ValueError (corrupt), LookupError (library absent). Messages are return values that may carry
    an IP or host; they are never logged above DEBUG (plan:806-832). Consumers: search scripts keep
    their catch-all print and return [] (never the block value None, so an exception on the
    verified path can never trigger the Chrome re-issue [D16 M2], plan:827); webfetch keeps
    {"error": "fetch failed: <Type>: <msg>"} and maps ChromeBodyTooLarge and the non-textual
    refusal before the generic handler.
  memory_management: >-
    Every peer-driven length and count has a named, argued ceiling (P3, Scripts/_mcp_websocket.py:99-103)
    with a refusal test row: CH_MAX_RECORD_BYTES 16384+256, CH_MAX_HANDSHAKE_BYTES 256 KiB,
    CH_MAX_FRAME_BYTES 16384, CH_MAX_HEADER_BLOCK_BYTES, CH_MAX_HEADER_LIST_BYTES 262144,
    CH_HPACK_TABLE_BYTES 65536, CH_MAX_H2_CONTROL_FRAMES 1000/connection, CH_MAX_H2_EMPTY_FRAMES
    100/stream, CH_MAX_H1_HEAD_BYTES 64 KiB, CH_MAX_H1_HEADERS 256, CH_MAX_H1_CHUNK_LINE_BYTES 4096,
    CH_MAX_BODY_BYTES 64 MiB, CH_DEFAULT_DECODE_CAP 64 MiB (cumulative across layers),
    CH_MAX_CONTENT_CODINGS 2, CH_MAX_REDIRECTS 20, jar 180/3000/4096 (plan:516-539). [D16 S5] On the
    verified transport the response HEAD is parsed by http.client (_MAXLINE 65536, _MAXHEADERS 100),
    not by the CH_* h1 ceilings; the body limits are the session's own on both transports (R29,
    plan:791). ctypes: we own the output buffer (create_string_buffer), reset avail_out/out.size
    before each call, validate `produced` and monotonic counters, copy buf.raw[:produced] only,
    hold the input bytes in a local, free decoder state in finally (plan:635-640).
  logging_pattern: >-
    Structure-only (ADR 0011): the client takes an injected `log` callable; DEBUG per connection
    `group=0x11ec cipher=0x1302 alpn=h2 alps=0 hrr=0 ch_len=... t_hs=...ms`, per stream
    `status=... body=...B enc=br decoded=...B`. Never header values, cookies, bodies, query strings,
    or (at INFO) the SNI (plan:104, plan:864). webfetch passes a structure-only log.debug wrapper.
    [D15] _ChSession._fallback logs "session: %s transport" % label (structure-only).
  naming_conventions: >-
    Per-source prefix sets (plan:253-259): _mcp_chrome.py `_ch_` functions, `_Ch` classes, `CH_`
    public limits, `_CH_` private tables; _mcp_brotli.py `_br_`, `BR_`, `_BR_`; _mcp_zstd.py `_zstd_`,
    `_Zstd` (ctypes Structures), `ZSTD_`, `_ZSTD_`. Only exceptions: CHROME_PROFILE, _chrome_profile,
    _brotli_decompress, ChromeClientError, ChromeTls12Error, ChromeBodyTooLarge. The prefixes also keep
    constants out of CAP_CONST_RX (tests/test_mcp_footprint.py:462-463). Consumer hosts indent with
    TABS; canonical sources use 4-space indents that the generator converts.
  key_patterns:
    - "Generated regions, not imports (ADR 0025): no host imports a canonical source; `# Refresh: python3 Scripts/amalgamate.py -- do not edit inside the region.` then ONE-line `# BEGIN GENERATED: <source> :: <names...>` marker (P4, Scripts/search_duckduckgo.py:542-550). Run `python3 Scripts/amalgamate.py` then `--check`."
    - "Block shapes: only top-level def/async def/class/single-target Assign is a block; anything else is SILENTLY skipped and a duplicate name collapses to the last binding (Scripts/amalgamate.py:266-277). Tab safety per Scripts/amalgamate.py:389-410: one physical line per call and literal, long byte strings built by += inside functions, no backslash continuation, whole 4-space indents."
    - "Canonical source header/docstring contract P1 (Scripts/_mcp_websocket.py:1-6, :68-82): domain, hosts, core vs wrappers, what the core refuses, out of scope, tab safety, block contract, no server imports this module."
    - "Sans-IO state classes (_ChTls, _ChH2Connection, _ChHpackEncoder/_ChHpackDecoder) with injected rand/log; _ChSession owns sockets; every collaborator injected (G-b): rand, connect_policy, decoders, ssl_context_factory. _ch_open_socket is always called by its global name at call time (late binding) so tests can wrap it."
    - "Suite counts only in tests/run.py SUITES (tests/run.py:412-422), from the `ran M` of a green run; CASE COUNT DRIFT is a hard FAIL (tests/run.py:541-571)."
    - "SKIP = INFO, never PASS: `suite.record(group, cid, (), status=H.INFO, detail=[\"SKIPPED: ...\"])` (tests/test_purity_lsp.py:636-640) for absent openssl >= 3.5, absent libbrotlidec/libzstd, no real Python 3.9, no uv, non-Linux host."
    - "Oracles come from specs (RFCs, FIPS/NIST vectors, committed Chrome captures, the independent chrome_capture parser), NEVER from the module under test (tests/test_mcp_websocket.py:12-17)."
    - "Every suite has a negative-control group, a hygiene group (no .pyc; writes only under mkdtemp or .claude/tmp/<suite>/), AST-based scanning, and reads published numbers (CH_MAX_*) off the module instead of typing them."
    - "forge_call targets: mcp_chrome, mcp_decoders, chrome_capture (new, in the mcp_websocket shape, project-forge.yaml:203-209); generated_region, amalgamate_check, py_deps, mcp_websocket, spawn_stdin, smoke, mcp_footprint, read_loop, cancel, wire_log, handler_crash, name_existence, wiki_addendum, wiki_index, all. Never run make/pytest via Bash."
    - "Real Python 3.9 runs: `uv run --python 3.9 tests/run.py <suite>` or `/usr/local/bin/python3.9 tests/run.py <suite>` on the dev Mac; unavailable -> INFO line in the gate record (plan:650)."
    - "[D15] Transport selector: _ch_session_new(..., transport=\"verified\") (default) routes every https hop through _ChFallbackConnection (the verified stdlib transport, never pooled); transport=\"chrome\" is today's _ChTls path. A response's transport and cert_verified are the redirect chain's WEAKEST hop, impersonated is the final hop's [D16 S3] (plan:765-767). Tests that mean the Chrome path say transport=\"chrome\" (with_session / with_policy setdefault) [D16 C1]."
    - "[D15] Search-script bot-block fallback: start verified; on a block (judged on the endpoint's own host only) re-issue ONCE over create_session(\"chrome\"), add the host key to _CHROME_AFTER_BLOCK (per process, never persisted), open every later session with _transport_for(<host>); label every Chrome-path result `**Transport**: chrome (certificate NOT verified)` (plan:1460-1486, plan:1531-1543)."

