      - "Source: .claude/tmp/m0/results.md 'STOP rules: none fired', 'PC-1: met'; plan header M0 note."
    options:
      - "proceed (selected)"
    status: answered
  - category: implementation
    question: "M0 item 1 (M0:1): how does sbx pick the darwin wait path, and how does it behave?"
    answer: >-
      By sys.platform == "darwin" (hasattr(select, "kqueue") asserted), NEVER by the absence of
      os.waitid -- hasattr(os, "waitid") is True on python3 3.14.0 darwin and False on 3.9.21.
      NOTE_EXIT arrives in ~0.30 s without reaping (child stays Z); killpg(SIGKILL) kills the setsid
      grandchild; killpg on a zombie-only group answers EPERM (treated as ESRCH); waitpid reaps.
      Registration with nevents == 0 raises OSError(ESRCH) for an exited child -- the one shape caught.
    details:
      - "Source: results.md item 1, decision 1; plan KD-2, R-5, Step 4 item 7; tasks 023, 024."
    options:
      - "kqueue selected by platform (selected)"
      - "select by hasattr(os, 'waitid') (rejected: wrong on Python >= 3.13)"
    status: answered
  - category: security
    question: "M0 items 3a-3j (M0:2-M0:7): what must the restricted Seatbelt profile and the darwin plans carry?"
    answer: >-
