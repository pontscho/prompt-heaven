requirements:
  - category: architecture
    question: "Q1 — How should the second backend be structured relative to the committed ClangdClient?"
    answer: >-
      [D17] Option 2: extract a shared concrete base class BaseLspClient(LspBackend)
      holding the byte-identical LSP machinery currently in ClangdClient; both
      ClangdClient and LuaLsClient inherit from it. This is the only structure
      consistent with the de-dup mission. The cost — re-basing the committed
      ClangdClient — is mitigated by the Phase 0 live clangd test + smoke.
    details:
      - "Class hierarchy: LspBackend (abstract, unchanged @1259) -> BaseLspClient (NEW, shared machinery + divergence hooks) -> {ClangdClient (start + CUDA + RETAINS call-hierarchy), LuaLsClient (start + lua _language_id + reader hooks + luals divergence hooks; NO call-hierarchy)}."
      - "Rejected Option 1 (separate LuaLsClient(LspBackend), no base): duplicates ~90% byte-identical machinery, contradicts the mission."
      - "Rejected Option 3 (central capability registry): more machinery; returns errors where standalone luals returns degraded-but-useful results."
    options:
      - "Option 1: separate LuaLsClient(LspBackend), no shared base"
      - "Option 2: extract shared BaseLspClient(LspBackend) — CHOSEN"
      - "Option 3: central capability registry + explicit not-supported errors"
    status: answered

  - category: architecture
    question: "Q2 — How should per-language capability gaps (call-hierarchy, hover type inference, grep supplement, fallback extensions) be expressed?"
    answer: >-
      [D18] A SMALL set of polymorphic hooks/attributes ON THE BACKEND, consulted
      by the EXISTING module-level semantic helpers. NOT a central capability
      registry, NOT overriding a references() method. The 10 handlers delegate to
      module-level helpers that already take a `client` argument, so divergence
      flows through hooks those helpers consult — keeping handlers/helpers
      backend-agnostic (the Phase 0 invariant).
    details:
      - "Hooks on BaseLspClient: supports_call_hierarchy: bool = True; fallback_extensions: tuple = _FALLBACK_EXTS (12-ext); prime_extensions: tuple = clangd's 8-ext prime set; _language_id(path) -> str; infer_type(text) -> str; async supplemental_references(symbol_name, seen, remaining, preferred_path=None) -> list (no-op [] default)."
      - "LuaLsClient overrides: supports_call_hierarchy=False, fallback_extensions=(\".lua\",), prime_extensions=(\".lua\",), _language_id->\"lua\", infer_type->raw text.strip(), supplemental_references->folded _lua_text_references."
      - "supports_call_hierarchy is consulted at the HANDLER (handle_symbol_change_impact @2583), not inside the backend."
    options:
      - "Hooks/attributes on the backend consulted by module-level helpers — CHOSEN"
      - "Central capability registry"
      - "Override a references() method per backend"
    status: answered

  - category: dependencies
    question: "Q3 — How should the luals backend discover its Lua config (.luarc.json)?"
    answer: >-
      [D19] Option 1: clean cwd auto-discovery only — no upward .luarc.json walk.
      LuaLsClient.start(project_root) defaults config_path=None and spawns
      lua-language-server with cwd=project_root, letting luals auto-discover
      relative to its cwd. This matches the standalone luals server exactly, so
      there is no behavior regression for Lua users. An optional --configpath is
      supported by start() but not passed by default.
    details:
      - "No --configpath passed by default; the binary's own cwd discovery is relied upon."
      - "An upward .luarc.json discovery walk is explicitly OUT OF SCOPE."
    options:
      - "Option 1: cwd auto-discovery only — CHOSEN"
      - "Option 2: upward .luarc.json walk from the queried path"
    status: answered

  - category: implementation
    question: "Q4 — What is the committed test scope, given the smoke harness drives the server as a subprocess and cannot import it?"
    answer: >-
      [D20] Option 3 (Phase 0 mirror): hermetic JSON-RPC dispatch-smoke assertions
      in _mcp_smoke_test.py (committed, observable-only — the harness drives the
      server as a subprocess and does NOT import the module) PLUS a SEPARATE live
      luals verification via p:minion-runner during /p:implement (NOT committed).
      Introspection asserts (_detect_language, _route_filetype, class flags) belong
      to the live runner step because the smoke harness cannot import the module.
    details:
      - "Committed smoke asserts ONLY: inventory lists luals_* names; luals_find_definition + a representative subset dispatch (NOT \"unknown function\"); luals_bogus -> \"unknown function\"."
      - "Live (NOT committed): in-process import asserts (_detect_language(\".lua\")==\"lua\", _route_filetype(\"lua\")==\"luals\", LuaLsClient.supports_call_hierarchy is False, ClangdClient.supports_call_hierarchy is True, LuaLsClient.fallback_extensions==(\".lua\",)) + a real lua-language-server run on a fixture .lua workspace + a Phase 0 clangd regression re-run."
    options:
      - "Option 1: in-process import-based unit file"
      - "Option 2: live-only verification, no committed smoke"
      - "Option 3: hermetic JSON-RPC smoke (committed) + separate live runner (uncommitted) — CHOSEN"
    status: answered

  - category: interface
    question: "Q5 — How do path-less luals_* calls and the handle_symbol \"cpp\" hardcode route to the luals backend without changing handler signatures?"
    answer: >-
      [D21] Option 1: a dispatch-level reserved params[\"_backend\"] hint derived
      from the luals_ function-name prefix, plus a _select_filetype(params, abs_path)
      helper. Path-based calls auto-detect via _detect_language; path-less calls use
      the hint; path-less calls with neither keep the \"cpp\" default. This single,
      signature-preserving mechanism generically fixes the handle_symbol \"cpp\"
      hardcode (@2487) too. The reserved _backend key is dispatcher-internal and is
      stripped from unknown-params reporting.
    details:
      - "_PREFIX_BACKEND={\"luals_\":\"lua\"}; _backend_hint(function) returns the mapped filetype or None; _select_filetype(params, abs_path) returns params.get(\"_backend\") or (_detect_language(abs_path) if abs_path else \"cpp\")."
      - "In handle_purity_call, after _resolve_aliases and before the handler call: hint=_backend_hint(function); if hint: params[\"_backend\"]=hint."
      - "Path-less-capable handlers (handle_symbol, the name-branches of find_definition/find_references/symbol_context/symbol_change_impact) acquire the backend via _ensure_backend(_select_filetype(params, abs_path), project_root); handle_symbol passes abs_path=\"\"."
      - "Unknown-params validation (@2803-2811) excludes _backend: set(params.keys()) - accepted - {\"_backend\"}."
    options:
      - "Option 1: reserved params[\"_backend\"] dispatch hint + _select_filetype — CHOSEN"
      - "Option 2: new explicit backend argument on every handler signature"
    status: answered

  - category: data
    question: "D3 — What is the canonical path key for purity_call params?"
    answer: >-
      [D3] The canonical path key is `relative_path` (NOT clangd's `path`). The
      purity_call {function, params} envelope and the relative_path key MUST NOT
      change in this phase.
    details:
      - "Handlers read params.get(\"relative_path\", \"\"); _resolve_aliases canonicalizes path->relative_path (last-wins)."
    options: []
    status: answered

  - category: implementation
    question: "D5 — Should RuntimeError stay in the dispatcher clean-catch tuple?"
    answer: >-
      [D5] Yes. RuntimeError stays in the dispatcher clean-catch tuple
      (ValueError, FileNotFoundError, OSError, RuntimeError) @2802 — honest errors.
      luals initialize failure raises RuntimeError, surfaced through the 90s shield.
    details:
      - "A missing lua-language-server binary is guarded by shutil.which in the luals init branch for an honest error + 30s backoff, not a hang."
    options: []
    status: answered

constraints:
  - type: technical
    description: "stdlib-only, single-file-per-server fleet convention — no new third-party dependencies."
    impact: "No imports beyond the stdlib; lua-language-server is an existing external runtime spawned the same way as the standalone server. Smoke stays hermetic."
  - type: technical
    description: "The purity_call {function, params} envelope and the canonical relative_path path key ([D3]) must not change."
    impact: "All routing/backend selection must happen inside the dispatcher and helpers, not via new wire fields. The reserved _backend params key is dispatcher-internal and stripped from unknown-params reporting."
  - type: technical
    description: "RuntimeError stays in the dispatcher clean-catch tuple ([D5])."
    impact: "luals init/handshake failures surface as clean {\"error\": ...} responses, not internal -32603 crashes."
  - type: technical
    description: "Folded luals core is COPIED, not imported; mcp-lua-lsp.py is NOT modified."
    impact: "The standalone mcp-lua-lsp.py must remain byte-for-byte unchanged and still launch (luals_call registered). Each backend owns its own child process; clangd and luals never share a process."
  - type: technical
    description: "No build system; verification is python3 -m py_compile + python3 Scripts/_mcp_smoke_test.py Scripts/mcp-purity.py + a one-shot live p:minion-runner run (live run in /p:implement, NOT committed)."
    impact: "No forge/pytest target exists. The committed test surface is the JSON-RPC smoke harness only; introspection asserts move to the uncommitted live runner."
  - type: security
    description: "No new external input surface beyond Phase 0; path params confined under --project-root via safe_path; luals child spawned without a shell, cwd=project_root."
    impact: "The reserved _backend key is dispatcher-internal and never trusted for paths. _route_filetype returning None still raises ValueError."

success_criteria:
