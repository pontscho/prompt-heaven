        Stdlib-only, run as __main__, newline-delimited JSON-RPC 2.0 MCP server (plan:718-754).
        Loop modeled on P1 but SYNCHRONOUS handling, except tf_sleep which runs on a
        threading.Thread(daemon=True) so the stub keeps reading stdin and can record cancels.
        Every stdout write goes under one threading.Lock (json.dumps(obj) + "\n", flush).
        On stdin EOF exit 0 (smoke harness and I1 rely on it). Every symbol starts with tf
