original_request: "Continue the mcp-purity consolidation: implement Phase 1 — fold luals (lua-language-server) into Scripts/mcp-purity.py as a second LspBackend behind the shared abstract interface."

goal: >-
  Eliminate duplicated LSP-core code by extracting a shared concrete base
  BaseLspClient(LspBackend) in Scripts/mcp-purity.py, re-basing the existing
  ClangdClient onto it, and adding a LuaLsClient(BaseLspClient) that folds the
  reusable lua-language-server core from Scripts/mcp-lua-lsp.py. Per-language
  divergence is expressed as a small set of polymorphic hooks/attributes on the
  backend, consulted by the existing module-level semantic helpers — keeping the
  10 canonical handlers backend-agnostic. After this phase a purity_call that
  targets a .lua file (or uses a luals_* function name) is served in-process by a
  lua-language-server backend, while the standalone mcp-lua-lsp.py stays
  registered and byte-unchanged. C/C++/CUDA behavior must be regression-free.

complete: true

implementation_complete: true
implementation_date: "2026-06-19"
inspector_verdict: COMPLETE
inspector_iterations: 1
security_verdict: APPROVE
