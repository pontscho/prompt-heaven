  - "SC-2: a queued /v1/unload answers 200 only after the child process group is gone (pid check in the test)."
  - "SC-3: ?force=1 aborts a running request within the kill-ladder time; the request gets a 503 unload_forced OpenAI error."
  - "SC-4: a crash mid-request with retries=1 gives one transparent re-send, with retries=0 a 502; five crashes in 600 s give DISABLED (503) until unload."
  - "SC-5: suite sd_router green with the exact typed count (about 201 planned); generated_region, amalgamate --check, py_deps and mcp_proxy green after registration; llm_router green after the credential phase."
  - "SC-6: an llm-router sdcpp route with api_key sends Authorization: Bearer <key> to sd-router; the key never appears in logs, bodies or the child's env/argv."
  - "SC-7 (manual, not gated, not a task): live smoke against a real sd-server; confirm sd-server host/port flag names and the real readiness status of GET /."
  - "Docs: component page, ADR 0034, ADR 0028 addendum, R-0112 updated via roadmap.py, INDEX regenerated; the wiki gates are clean."

context_summary:
  error_handling: >-
    Router refusals are OpenAI-shaped {"error":{"message","type","code"}} from ONE function
    _sd_error(code, message) over a CLOSED code table pinned by a test (unauthorized, route_not_found,
    method_not_allowed, length_required, body_too_large, unsupported_media_type, invalid_request,
    model_required, model_unknown, model_crashed, model_start_failed, model_start_timeout,
    model_disabled, unload_forced, unload_failed, upstream_timeout, queue_full, upstream_failed,
    shutting_down, queue_closed); messages name a rule, never a value; the child's own non-2xx answers
    are relayed verbatim. Config errors: ConfigError, one stderr line naming the key, exit 2 through an
    ArgumentParser subclass. A handler bug is a 500-class error body, never a dropped connection.
  memory_management: >-
    Bounded: --body-limit, queue bounded by --max-connections through ONE atomic try_admit()/release()
    counter (running ticket counts), response_limit 64 MiB, control bodies 4 KiB; a cancelled queued
    ticket drops its body at once; image bytes <= max_connections x (body_limit + response_limit).
    Child process groups are tracked in a spawn registry and swept on shutdown.
  logging_pattern: >-
    Structure-only through the generated _log_value / _configure_logging regions: model, state
    transition, pid, exit code or signal, durations, status, queue depth, attempts. Never bodies,
    tokens, prompts or env values; no log call under the scheduler lock.
  naming_conventions: >-
    Module prefix _sd_ for functions, _SD_ for constants; classes ConfigError, ModelSpec, Settings,
    Supervisor, Budget, Ticket, TicketView, Decision, _SdHttpServer, _SdHandler, _SdArgumentParser;
    numbered unit comment headers `# ---- unit N ----`; test groups named by letter (A, L, R, D, S,
    Q-sched, Q-http, T, P, U, G, E2E); rows written <suite>:<row>.
  key_patterns:
    - "Declared adapted copies (not imports): mcp-proxy _signal_group/spawn/ladder and sbx _wait_exit_unreaped; llm-router _rt_read_config_file, setup(), _rt_client_gone, /v1/models entry builder."
    - "Generated regions between hashed markers from Scripts/_mcp_httpfront.py and Scripts/_mcp_logging.py (same block names llm-router uses); hand-written class members each need an HTTPFRONT_ADAPTATIONS row."
    - "Kill before reap: signal the group while the leader is an unreaped zombie; platform branch on sys.platform, never hasattr(os, 'waitid')."
    - "Everything the scheduler needs from outside (clock, sleep, Popen, os.killpg, ports) is a module-level name tests monkeypatch; timing cases use an in-process fixture loading the hyphenated file through importlib.util.spec_from_file_location."
    - "Tests: stub child with state file and SHA recording (tests/files/mcp_proxy/tf_stub_child.py precedent), ScriptedPeer, reap_stubs, tick-bounded Event waits with ceilings, fixtures under .claude/tmp/test_sd_router/run-<unique>/."
    - "Red first: each test group is run and observed failing before the code it gates; the typed count moves in tests/run.py in the same task."

