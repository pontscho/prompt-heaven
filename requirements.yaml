      size: m
      size_rationale: "The only platform branch (two wait mechanisms) plus the status writer (~60 lines)."
      implementation_details: |
        Plan KD-2 / Step 4 item 7 and _write_status.
        - _wait_exit_unreaped(pid, deadline, kq=None, flag=...) -> bool: the platform path is
          SELECTED BY `sys.platform == "darwin"` (with hasattr(select, "kqueue") asserted), NEVER by
          the absence of os.waitid (M0:1, item-1.md: hasattr(os, "waitid") is True on python3
          3.14.0 darwin and False on 3.9.21 -- Python >= 3.13 exposes waitid on darwin). Linux polls
          os.waitid(os.P_PID, pid, os.WEXITED | os.WNOWAIT | os.WNOHANG) every 20 ms; darwin uses a
          select.kqueue() with one select.kevent(pid, filter=select.KQ_FILTER_PROC,
          flags=select.KQ_EV_ADD | select.KQ_EV_ONESHOT, fflags=select.KQ_NOTE_EXIT) registered
          IMMEDIATELY after fork with kq.control([ev], 0, 0) -- nevents == 0, so an already-exited
          child (a zombie also answers ESRCH) raises OSError(ESRCH) / ProcessLookupError, the ONE
          shape caught (= exited, still unreaped); never register with nevents >= 1, which would
          instead return an EV_ERROR event with data == ESRCH (measured, M0:1) -- then
          kq.control(None, 1, min(remaining, 0.1)) in a loop so the trapped-signal flag is checked
          at least every 100 ms. Neither path reaps (measured: NOTE_EXIT after ~0.30 s, child still
          Z). The kqueue is closed in a finally.
        - _sweep(pid): os.killpg(pid, SIGKILL) with ESRCH AND EPERM ignored (macOS answers EPERM for
          a zombie-only group -- measured on 3.14 and 3.9, M0:1), then os.waitpid(pid, 0) -> status.
        - _write_status(fd, obj): json.dumps(obj, separators=(",", ":")) + "\n", <= 512 bytes,
          os.write loop, EPIPE ignored. Events: {"sbx": 1, "event": "spawned", "pid": P, "pgid": P};
          {"sbx": 1, "event": "exit", "outcome": exited|signaled|timeout|refused, "code", "signal",
          "durationMs"[, "reason"]} (plan section 5 "sbx exit/status contract").
