          pattern_excerpt: &px_inspect_reclaim |
            class _Reclaim:
                def __init__(self) -> None:
                    self._lock = threading.Lock()
                    self._procs: List[subprocess.Popen] = []
                    self.cancelled = False

                def adopt(self, proc: subprocess.Popen) -> None:
                    with self._lock:
                        if not self.cancelled:
                            self._procs.append(proc)
                            return
                    # Already cancelled: nobody wants this child's output.
                    _signal_group(proc, signal.SIGKILL)

                def cancel(self, loop: asyncio.AbstractEventLoop) -> None:
                    with self._lock:
                        self.cancelled = True
                        procs = list(self._procs)
                    for proc in procs:
                        _signal_group(proc, signal.SIGTERM)
                    if procs:
                        loop.call_later(CANCEL_KILL_GRACE, self._escalate, procs)

                @staticmethod
                def _escalate(procs: List[subprocess.Popen]) -> None:
                    for proc in procs:
                        _signal_group(proc, signal.SIGKILL)


            def _signal_group(proc: subprocess.Popen, sig: int) -> None:
                if proc.returncode is not None:
                    return
                try:
                    os.killpg(proc.pid, sig)
                except OSError:
                    pass
        - file: /Users/zoltan.ponekker/Code/prompt-heaven/Scripts/mcp-inspect.py
