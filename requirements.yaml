      implementation_details: |
        1. Run `python3 Scripts/amalgamate.py --check` on the clean tree (through p:minion-builder / forge target amalgamate_check); expected exit 0 = baseline.
        2. In a scratch copy under .claude/tmp/sd_router_probe/ (the ONLY place; never the real Scripts/), build a host file holding the empty pair
