          pattern_excerpt: |
            def _purity_call(srv, call_id, function, params=None):
                """Send a purity_call tools/call and return (text, raw_response)."""
                srv.send({"jsonrpc": "2.0", "id": call_id, "method": "tools/call",
                          "params": {"name": "purity_call",
