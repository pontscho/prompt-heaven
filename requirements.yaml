          pattern_excerpt: &px_scripted_peer |
            class ScriptedPeer:
                """A loopback upstream that records each request and runs a script (adapted
                from RawPeer, tests/test_mcp_chrome.py).

                Each accepted connection gets its own daemon thread, which reads ONE request:
                the head up to the blank line, then exactly Content-Length body bytes when there
                is exactly one Content-Length header. It appends {"line", "headers", "body"} to
                `self.requests` -- headers as a list of (name, value) pairs in arrival order,
                case preserved, so a repeated name stays visible -- and then runs the script.

                *script* is a sequence of steps, each a tuple `(verb, *args)`:
                  ("respond_json", status, obj[, headers])
                  ("stall", seconds)                  send nothing for *seconds*
                  ("close_after", n_bytes)            arm a budget, then TCP is dropped
                  ("respond_raw", data)               *data* (bytes) sent verbatim
                A normal end of the script closes the connection. Every exception is recorded
                in `self.errors`, never raised into the test thread.
      api_references:
