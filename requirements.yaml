  - "A canonical handler called on a .lua path (find_definition, find_references, outline, diagnostics, ...) routes to the luals backend via _detect_language -> _route_filetype -> \"luals\"."
  - "Path-less luals calls (luals_workspace_symbols; name-based luals_find_definition/find_references/symbol_context/symbol_change_impact) reach the luals backend via the dispatcher backend-hint, not the \"cpp\" default."
  - "Name-based find_references on Lua includes the dynamic-dispatch text-grep supplement, deduped against LSP hits on uri:line and capped (parity with the standalone luals server). Positional (_at) Lua references are LSP-only (parity)."
  - "symbol on Lua uses a .lua documentSymbol fallback (parity with standalone luals)."
  - "symbol_change_impact on Lua returns definition + references WITHOUT a call_hierarchy (partial: true) and does NOT error."
  - "type_at on Lua returns hover-derived text (degraded, no C++-style clean type string) and does NOT error."
  - "The standalone mcp-lua-lsp.py server is byte-for-byte unchanged and still launches (luals_call remains registered and working)."
  - "C/C++/CUDA behavior is regression-free: the Phase 0 live clangd test (find_definition/find_references/outline/type_at) still passes 4/4."
  - "python3 Scripts/_mcp_smoke_test.py Scripts/mcp-purity.py passes, including the new luals dispatch assertions."
  - "python3 -m py_compile Scripts/mcp-purity.py Scripts/_mcp_smoke_test.py is clean."

context_summary:
  error_handling: >-
    Semantic handlers return {"error": "..."} on validation/lookup failure.
    _ensure_backend (@2115) raises ValueError for an unroutable filetype
    (_route_filetype -> None) and records init failures into _backend_init_failed
    with a 30s backoff (_INIT_FAILURE_BACKOFF), plus a 90s asyncio.shield+wait_for
    init shield. The dispatcher clean-catch tuple is
    (ValueError, FileNotFoundError, OSError, RuntimeError) @2802 -> {"error": str(exc)};
    any other exception becomes an internal -32603. luals start() raises RuntimeError
    on an initialize error; add a shutil.which("lua-language-server") guard in the
    luals init branch for an honest missing-binary error + backoff (not a hang).
  memory_management: >-
    Each backend owns its child process + background reader task; created lazily on
    first semantic call, stored in _backends[backend_type] (keyed "clangd"/"luals"),
    and stopped via the inherited stop(). luals and clangd never share a process;
    cost is one extra LSP child when a .lua file is first touched. The folded luals
    core is COPIED into mcp-purity.py, never imported from mcp-lua-lsp.py.
  logging_pattern: >-
    log.debug("Backend '%s' init: %s", backend_type, msg) in _init_backend (@2111);
    luals start() logs init/indexing milestones via log.debug(f"..."). Use %-style
    lazy formatting for the backend-init line (matching the existing call) and f-strings
    where the existing folded luals code already uses them.
  naming_conventions: >-
    snake_case module-level helper functions that take a `client` argument
    (_infer_type, _def_by_name, _refs_by_name, _fallback_workspace_symbols,
    _symbol_to_location, _collect_call_hierarchy, _find_files_with_word);
    leading-underscore _FOO for private module functions/attributes; UPPER_CASE for
    module constants (_FALLBACK_EXTS, _CLANGD_FILETYPES, _LUALS_FILETYPES,
    _PREFIX_BACKEND, _INIT_FAILURE_BACKOFF). Backend classes are CapWords.
  key_patterns:
    - "Semantic logic is MODULE-LEVEL helpers taking `client`, NOT polymorphic methods. Per-language divergence therefore flows through a small set of hooks/attributes the helpers consult — NOT a references() override or a capability registry."
    - "prime_extensions (clangd's 8-ext prime set: .c .cpp .cc .cxx .h .hpp .cu .cuh) is DISTINCT from fallback_extensions (the 12-ext grep set _FALLBACK_EXTS incl. .m/.mm/.hh/.hxx). Reusing the grep set for priming would silently make clangd prime ObjC/extra headers — keep them separate."
    - "THREE distinct skip-dir sets exist and must not be conflated: _FALLBACK_SKIP_DIRS (@1794, grep walk), the clangd prime skip-check {build,out,dist,.git}, and the standalone luals skip set {build,out,dist,.git,node_modules,vendor}. Minor walk drift is accepted for Phase 1 (inspector M-D)."
    - "luals init silent-hang traps: the reader loop MUST answer the workspace/configuration server->client REQUEST with [None]*len(items), AND start() MUST send BOTH the initializationOptions.Lua push and the single workspace/didChangeConfiguration re-push. Drop any and luals stalls until the 90s timeout."
    - "The smoke harness drives the server as a subprocess over JSON-RPC and does NOT import the module — committed asserts are observable-only (dispatch-resolves / unknown-function). Introspection asserts move to the uncommitted live p:minion-runner step."
    - "The dispatcher looks up the RAW function name via HANDLERS.get(function) (@2792), so luals_* legacy names are DIRECT HANDLERS keys (like clangd_*/cuda_*). The unknown-params check in the except branch is keyed on canonical_func and MUST exclude the reserved _backend key."
    - "_refs_by_name's per-ref dedup is keyed uri:line:character (@2244); the cross-source grep supplement must dedup on a 2-part uri:line line_seen and respect remaining = max_results - len(all_refs) (uncapped when max_results <= 0), matching the standalone (mcp-lua-lsp.py:1087,1131-1133)."

