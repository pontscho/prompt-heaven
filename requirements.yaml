                        if event is not None or data:
                            out["events"].append((event or "message", "\n".join(data)))
                        event, data = None, []
                    elif line.startswith(":"):
                        out["comments"].append(line)
                    elif line.startswith("id:"):
                        out["ids"].append(line)
                    elif line.startswith("event:"):
