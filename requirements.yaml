          function: _find_files_with_word
          note: "Verified mcp-clangd.py:726-748 — the DRY grep core feeding the A-class fallback (whole-identifier byte regex, skip-dirs)."
          pattern_excerpt: |
            def _find_files_with_word(root: str, word: str, exts=_FALLBACK_EXTS,
                                      limit: int = 20) -> List[str]:
                rx = re.compile(rb"\b" + re.escape(word.encode("utf-8", "ignore")) + rb"\b")
                hits: List[str] = []
                for dirpath, dirnames, filenames in os.walk(root):
                    dirnames[:] = [d for d in dirnames if d not in _FALLBACK_SKIP_DIRS and not d.startswith(".")]
                    for fn in filenames:
                        if not fn.endswith(exts):
                            continue
                        full = os.path.join(dirpath, fn)
                        try:
                            with open(full, "rb") as f:
                                if rx.search(f.read()):
                                    hits.append(full)
                                    if len(hits) >= limit:
                                        return hits
                        except (OSError, IOError):
                            continue
                return hits
