goal: >-
  Add Scripts/mcp-proxy.py, a single-file, stdlib-only (Python 3.9) MCP server that spawns the
  configured child MCP servers for one project root, aggregates their tools under their own
  unprefixed names (a duplicate refuses startup), and relays tools/call (with id remapping,
  cancel forwarding, progress-token remapping, restart-with-backoff, per-child timeouts and an
  orphan-free shutdown) to the right child. Phase 1 serves the upstream over stdio; Phase 2 adds
  a Streamable HTTP endpoint (legacy handshake model as the ai-soul SDK 1.25.3 speaks it) with a
  required bearer token, loopback default, Origin/Host checks and every tools/call answered as
  SSE. The proxy joins every fleet gate and gets its own suite (57 cases Phase 1, 90 Phase 2).
