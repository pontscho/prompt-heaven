          async def _amain(cfg: ProxyConfig, args, settings: Optional["HttpSettings"]) -> int:
            loop = asyncio.get_running_loop(); server = McpServer(cfg)
            signalled: List[int] = []; phase: List[asyncio.Task] = []
            def _on_signal() -> None:
                if signalled: log.warning("signal received again; shutdown already in progress"); return
                signalled.append(1)
                if phase: phase[-1].cancel()
