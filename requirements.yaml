      code_references:
        - file: /Users/zoltan.ponekker/Code/prompt-heaven/Scripts/_mcp_websearch.py
          function: _web_clean
          note: "The sanitizer the ADR declares as a hand copy."
          pattern_excerpt: |
            def _web_clean(text, keep):
                out = []
                for ch in text:
                    code = ord(ch)
                    if 0x20 <= code < 0x7f or ch in keep:
                        out.append(ch)
                    elif ch in _WEB_LINE_SEPARATORS:
                        out.append("\n")
                    elif 0xfe00 <= code <= 0xfe0f or 0xe0000 <= code <= 0xe01ef:
                        continue
                    elif unicodedata.category(ch) in ("Cc", "Cf", "Cs"):
                        continue
                    else:
                        out.append(ch)
                return "".join(out)
