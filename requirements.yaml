context_summary:
  error_handling: >-
    MCP layer (ADR 0010): a refusal is a tool RESULT with isError, never a JSON-RPC error. Both new
    dispatchers return `_tool_refusal(code, message, **extra)` = {"error": {"code": code, "message":
    message, **extra}}; the McpServer._handle_tool_call predicate is the top-level "error" key
    (`is_error = "error" in result`, Scripts/mcp-inspect.py:2884). Codes: busy (carries
    retryAfterMs: 1000), sandbox_unavailable, invalid_params (incl. unknown function/param with the
    _did_you_mean pointer, ADR 0030), internal (message = exception TYPE only). A non-object JSON-RPC
    params on tools/call stays protocol-level -32602 before any handler (mcp-search precedent
    Scripts/mcp-search.py:9055-9059; smoke forced_exc_code -32602). An omitted/empty function is an
    UNFLAGGED status reply {"__raw_text__": _status_text()} (R4:M1). Layer D: one `except Exception`
    -> log.exception("<literal>") + _tool_refusal("internal", type(exc).__name__) (handler_crash
    W_HANDLE + D_PRESENT). A failing script is a NORMAL result. sbx layer: exit 2 usage
    (_usage_error, one stderr line), 3 fail-closed (engine missing, builder ValueError, strict
    setrlimit refused, uid count failed, exec failed), 124 timeout, 128+N signaled. Config refusals
    name the KEY never the value (ConfigError(f"{where}: ..."), P8). mcp-proxy refusals keep its
    ConfigError / ChildStartError / ChildUnavailable shapes.
  memory_management: >-
    Not applicable (Python), but bounded-memory rules are load-bearing: output is capped WHILE
    reading and discarded after the cap (drain-and-discard, KD-7; runner RSS delta < 32 MiB on
    10 GiB stdout, E11); status buffer <= 4096 bytes; the runner waits for sbx's exit then drains
    pipes <= 500 ms (KD-8); every filesystem op fd-relative with O_NOFOLLOW + fstat on the opened fd
    (KD-9); every fd closed in finally; the work-root lock fd is CLOEXEC and held for the process
    lifetime; the runner HTTP client caps application/json at 32 MiB and reads SSE with bounded
    readline.
  logging_pattern: >-
    Generated _mcp_logging.py block (_configure_logging(debug, log_file), _log_value) in each host;
    log = logging.getLogger("mcp-sandbox"/"mcp-skill"); default WARNING. Wire debug logging is
    STRUCTURE ONLY (ADR 0011): method, id, tool name and argument KEYS through _log_value, never a
    payload (wire_log rows declared (OUT, FULL)). The runner logs one log.info per run with metadata
    only (interpreter, exit, duration, sizes); content only when config log_content is true.
    mcp-skill logs function, skill, tier, interpreter, exit, duration -- never token, bodies, args,
    stdin or output. Handler catch-alls use log.exception with a LITERAL format string. errno values
    are logged by NAME (errno.errorcode), never a path.
  naming_conventions: >-
    snake_case functions; leading underscore for module-private helpers (_spawn_sbx, _read_leaf);
    UPPER_CASE module constants with an _S suffix for seconds (_KILL_GRACE_S, _REFRESH_DEADLINE_S)
    and descriptive caps (_RM_MAX_OPS, _QUARANTINE_MAX, _KEG_SCAN_MAX_FILES); NamedTuple types in
    CamelCase (InterpreterSpec, InterpreterPlan, PlanState, Limits, SandboxConfig, RunRequest, MachO,
    IndexEntry, Skill, TierIndex); tool names <server>_call; test groups GRP_<X> / G<X> constants;
    rows named "<id> <kebab-description>" (e.g. "G13 cancel-during-refresh-keeps-plan-state"); suites
    sbx_restrict / mcp_sandbox / mcp_skill; 4-space Python indentation in every touched file except
    addendum.py (tabs, not touched).
  key_patterns:
    - "Fleet-table pattern (P22): read_loop, cancel, wire_log, handler_crash and protocol_version DISCOVER Scripts/mcp-*.py by glob, so the FLEET/WIRE row, the DECLARED_* total and the tests/run.py typed count + ledger comment for a server land in the commit that CREATES its file (Step 7 mcp-sandbox, Step 16 mcp-skill), never later (R3:M1)."
    - "Red-first (SC-4): write the group, run it, record RED (each row fails for its stated reason, never ImportError), then implement; a row needing a later step's code is written RED in its own step and verified GREEN where that code lands (R4:M3)."
    - "Strict JSON (P24): every parse through _strict_loads (finite numbers, bounded int literals); frames through _strict_dumps (allow_nan=False); duplicate-key refusal by one host-local _refuse_duplicate_keys_parse(text) = json.loads(text, object_pairs_hook=_no_duplicate_keys) over text _strict_loads already accepted, declared in STRICT_JSON_EXCEPTIONS; mcp-skill's runner body serialized as json.dumps(obj, separators=(',', ':'), ensure_ascii=False, allow_nan=False) in ONE spelling."
    - "KD-17 timing constants (one block in mcp-sandbox, Step 7): _KILL_GRACE_S = 2.0, _REFRESH_DEADLINE_S = 30.0, _CLEANUP_DEADLINE_S = 10.0, _DEGRADED_RETRY_S = 2.0, _HARD_DEADLINE_SLACK_S = 10.0, _DRAIN_S = 0.5, _RUN_DEADLINE_S = 175.0, _STARTUP_SWEEP_DEADLINE_S = 20.0, _STARTUP_PLANS_DEADLINE_S = 75.0; run bound 2 + 30 + 120 + 10 + 2 + 0.5 + 10 = 174.5 s; one per-run plan_deadline (R4:M2) passed to PlanCache.get, never re-armed."
    - "Fleet server shape (P13, Scripts/MCP_SKELETON.md): header, generated logging, RPC helpers, top-level error envelope, dispatch, pool run loop (section 5a: a single-thread reader executor + a worker pool of max_concurrent + 2, one task per request, ADR 0008), main; PROTOCOL_VERSION first member of class McpServer; os._exit(0) after asyncio.run."
    - "KILL reclaim (P15/P19): every child Popen bound to a name, start_new_session=True, passed to reclaim.adopt(proc) in the SAME function; _serve carries `except asyncio.CancelledError: reclaim.cancel(loop); raise`; no subprocess.run/call/check_* anywhere in mcp-sandbox; no KILL_EXEMPT row."
    - "Parameter hygiene (R3:M3): explicit isinstance checks, never coercion -- ints `isinstance(v, int) and not isinstance(v, bool)`, bools `type(v) is bool`; unknown members via _unknown_params_refusal; params accepted as a JSON-encoded object string through _ensure_dict (R3:M2)."
    - "Nested-sandbox INFO path (P23): every live Seatbelt group first runs one control sbx invocation; no result + 'sandbox_apply' in stderr = record every row of the group INFO with the stderr's first 200 chars (counted, never omitted)."
    - "sbx pure-builder / single-I/O-site (P1): builders are pure functions of Scope; every filesystem read happens in a resolver called from main(); every path into SBPL/bwrap passes the _INJECT_CHARS floor (P2)."
    - "Seatbelt is last-match-wins: restricted mode keeps every DENY after every ALLOW; bwrap mounts apply in argv order (later wins)."
    - "Test harness: suites are `tests/test_<name>.py` with NAME, GRP_* labels, `run(opts)` -> H.Suite(..., mode='grouped'), suite.record(group, name, problems, status=H.INFO, detail=[...]); registered in tests/run.py SUITES as (name, run_<name>, description, typed_count) with a `# TYPED:` ledger comment; a matching forge target with requires: [syntax]."

