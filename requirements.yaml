          --tool NAME (repeatable, default tf_stub_call): each name is one tool, same dispatcher.
          --state-dir DIR: append one JSON line per received message to DIR/<tool0>.events.jsonl
            = {"pid","method","id","cancel_id","progress_token","args_keys"} (open with O_APPEND);
            append its pid to DIR/<tool0>.pids.
          --page-size N: paginate tools/list with nextCursor.
          --cursor-loop: always return the same nextCursor.
          --crash-on-init: exit 3 before answering initialize.
          --toolset-file F: if F exists at startup read tool names from it (one per line).
          --crash-after-init-count N (L5 ordering): at process start, FIRST count lines already
            in DIR/<tool0>.pids (c; 0 if absent), THEN append its own pid, remember c. On
            initialize, if c >= N: os._exit(3) without answering. The count-then-append step
            runs whenever --state-dir is given (c is also used by --init-delay).
          --init-delay S: on initialize, if c >= 1, sleep S seconds on the main thread before
            answering (first incarnation answers at once).
        Tool functions (arguments = {"function": ..., "params": {...}}):
          tf_echo -> text json.dumps(arguments, sort_keys=True)
          tf_sleep {seconds} -> daemon thread; records any notifications/cancelled it receives
            (the cancel record carries cancel_id = params.requestId and the reason)
          tf_progress {n, after_result} -> n notifications/progress with the received token,
            then the result; with after_result one more progress after it
          tf_crash {code} -> os._exit(code) mid-call, no reply
          tf_big {bytes} -> a text result of that size
          tf_oversize {bytes} -> one non-JSON line of that many bytes
