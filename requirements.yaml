    details:
      - "Source: plan section 0, decision 13; NFR-7; R-9; PC-3."
    options:
      - "offline golden + liveVerified false (selected)"
    status: answered
  - category: security
    question: "How is a workdir handled that the remover cannot delete (chmod 000, uchg, deny ACL, huge trees)?"
    answer: >-
      Quarantine: the iterative fd-relative remover (KD-18 steps 1-5) gives up within its bounds ->
      the whole workdir is os.rename'd into <work_root>/quarantine/ (or kept in-place in the
      in-memory set when the rename fails) and the runner keeps serving; it goes degraded ("quarantine
      full", runs refuse sandbox_unavailable) only when more than _QUARANTINE_MAX = 16 are quarantined;
      bounded retries at startup (shared 20 s), before each run while degraded (2 s) and after a
      run's cleanup (once per 60 s). APPROVED by Zoltan 2026-10-11.
    details:
      - "Source: plan KD-18 step 6 (R2:S-H1a), KD-17, R3:M4; rows mcp_sandbox:H15-H18; user approval 2026-10-11 (passed by the orchestrator)."
      - "M0 item 3l STOP rule (R3:S-M1) did NOT fire (results.md): file-write-acl is adoptable and stops both ACL vectors; the owner strip falls back to chmodx_np(_FILESEC_REMOVE_ACL) / acl_set_file under an inode re-check (M0:8)."
      - "M0:9 / M0:14: the remover is the KD-18 FLATTEN remover (cut at <= 50 levels, fd-relative lift, fd window <= 50, per-op deadline); a rename-chained tree too deep for one 10 s cleanup spills into quarantine over several retries (declared, R-13)."
    options:
      - "quarantine with a 16-entry cap (selected, approved)"
      - "global degraded on the first unremovable workdir (rejected: permanent DoS)"
    status: answered
  - category: security
    question: "What text-cleanliness contract holds between ai-soul's approve time and mcp-skill's load time (R4:CONTRACT)?"
