          pattern_excerpt: |
            def _accept_loop(self):
                while not self._closed.is_set():
                    try:
                        conn, _ = self.sock.accept()
                    except socket.timeout:
                        continue
                    except OSError:
                        return
                    threading.Thread(target=self._hold, args=(conn,), daemon=True).start()

            def _hold(self, conn):
                try:
                    conn.settimeout(10.0)
                    data = b""
                    while b"\r\n\r\n" not in data:
                        chunk = conn.recv(4096)
                        if not chunk:
                            return
                        data += chunk
                    with self._cond:
                        self.arrived += 1
                        self._cond.notify_all()
                    self._release.wait(timeout=30.0)
                    conn.sendall(b"HTTP/1.1 200 OK\r\nContent-Type: application/json\r\n"
                                 b"Content-Length: %d\r\nConnection: close\r\n\r\n"
                                 % len(self.BODY) + self.BODY)
        - file: /Users/zoltan.ponekker/Code/prompt-heaven/Scripts/mcp-proxy.py
          function: _http_token_file
          note: "P3: the O_NOFOLLOW + fstat + owner + 0o077 read the --mistral/--sweep modes must use for the config (Scripts/mcp-proxy.py:593-628)."
          pattern_excerpt: |
            try:
                fd = os.open(path, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
            except OSError as exc:
                raise ConfigError(f"--token-file: cannot open the token file ({type(exc).__name__})") from None
            try:
                st = os.fstat(fd)
                if not stat.S_ISREG(st.st_mode):
                    raise ConfigError("--token-file: not a regular file")
                if st.st_uid != os.geteuid():
                    raise ConfigError("--token-file: refusing a token file not owned by the current user")
                if st.st_mode & 0o077:
                    raise ConfigError("--token-file: refusing a token file readable or writable by group/others "
                                      "(chmod 600)")
                chunks: List[bytes] = []
                while True:
                    chunk = os.read(fd, 65536)
                    if not chunk:
                        break
                    chunks.append(chunk)
            except OSError as exc:
                raise ConfigError(f"--token-file: cannot read the token file ({type(exc).__name__})") from None
            finally:
                os.close(fd)
