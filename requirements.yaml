# version of 2026-09-30, after refinement rounds 3 [D15] and 4 [D16]). On 2026-10-01 the user
# moved the plan out of the wiki to .claude/tmp/feature-implementation-plan.md (not committed);
# the plan:<line> anchors refer to that file. Code anchors into
# Scripts/_mcp_chrome.py and tests/test_mcp_chrome.py are SYMBOLS with the line they sat on
# when verified (the symbol is authoritative, the line is a hint) [D16, H2].
#
# Anchors inside the COMPLETED tasks task-001..task-036 are frozen as written and still refer
# to the 1607-line version. To read one against the current plan, add: +4 (old 13-75, FR-1..FR-16),
# +12 (old 76-122, NFR/SC-1..SC-6), +18 (old 123-153, SC-7 and decisions D1..R2-N3),
