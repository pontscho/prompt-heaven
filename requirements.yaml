# requirements.yaml -- sd-router (R-0112): a supervisor and reverse proxy for stable-diffusion.cpp `sd-server`.
#
# Source of truth: docs/feature-implementation-plan.md (validated plan, 9 steps, about 201 typed tests,
# decisions D-1..D-17 in its Section 5, FR-1..FR-12, NFR-1..NFR-10, SC-1..SC-7). It is authoritative;
# this file only breaks its 9 Steps into function-level tasks in the plan's order, keeping every
# red-first test-group task BEFORE (and as a dependency of) the code task it gates. "Step N" = Section 6
# of the plan; "H<n>", "M<n>", "S-L<n>" are its review-finding ids.
#
# CONVENTIONS OF THIS FILE
# - Line numbers in code_references were re-read on 2026-10-28 but move as soon as a step edits a host:
#   locate by SYMBOL first, line second. tests/run.py is edited by content, never by line number.
# - Shared pattern excerpts are YAML anchors (&px_*) defined at first use and re-used as aliases (*px_*).
# - Test sizing (every task states it): during development ONLY forge target `sd_router` (created in
#   task-034, initial timeout 300) or `python3 tests/run.py sd_router` before it exists; the registration
#   phase adds generated_region + mcp_proxy + py_deps + amalgamate_check; llm_router runs in full ONLY in
#   the credential phase (task-038). NEVER a full repository suite.
# - Docs-phase tasks (task-041..task-046) are executed by p:minion-librarian. ADR 0028 is append-only
#   (addendum.py only). Roadmap edits go only through ClaudeCode/skills/roadmap/scripts/roadmap.py.
# - NOT tasks (done by the orchestrator/user): every git commit and push, the live smoke SC-7 against a
#   real sd-server, and staging. Never stage the four unrelated dirty files: .claude/settings.json,
#   ClaudeCode/CLAUDE.md, ClaudeCode/hooks/post-edit-lint.sh, Scripts/claude-loop.sh.
# - Python 3.9 and the stdlib only (ADR 0024): no match, no `X | Y` annotations, no str.removeprefix.
# - TASK COUNT IS INTENTIONAL (46 tasks, above the "13+, consider splitting" guideline): the plan is one
#   validated unit whose red-first ordering cannot be split into separate plans without a red suite
#   between them. total_effort follows the validator aggregation (largest task L + 2 levels = xxl); no
#   single task is XXL.

original_request: >-
  Write the task YAML (requirements.yaml) for the sd-router feature (roadmap item R-0112) from the
  validated plan docs/feature-implementation-plan.md: a new stdlib-only Scripts/sd-router.py, a
  supervisor and authenticated reverse proxy for stable-diffusion.cpp sd-server (per-model spawn from
  config data, path-prefix and body model selection, strict FIFO with one request in flight, swap,
  crash retry and restart budget, queued and forced /v1/unload with verified process-group exit),
  registered as a declared host of the generated _mcp_httpfront.py and _mcp_logging.py regions, plus the
  llm-router sdcpp api_key/bearer credential phase and the docs phase (component page, ADR 0034, ADR
  0028 addendum, R-0112 via roadmap.py, INDEX regeneration).
goal: >-
  Let llm-router (and curl) drive several sd-server models on one GPU through one authenticated
  endpoint: cold start and swap block and wait, requests are strictly serialised, a crash is retried
  or budgeted into DISABLED, an unload answers 200 only after the child process group is verified gone
  (kill before reap, no orphan GPU process), bodies are forwarded byte-exact, and nothing secret (token,
  prompt, body, env value) reaches a log, error body or repr. Every test group is observed RED before
  its implementation, every fleet gate stays green per commit, and the decisions are recorded in ADR
  0034 plus an append-only ADR 0028 addendum.
