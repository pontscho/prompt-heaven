          function: decode_body
          note: "SCRATCH PoC. D16: unbounded zlib.decompress per layer, any number of codings, br/zstd left encoded."
          pattern_excerpt: |2
            def decode_body(headers, body):
                """Undo content-encoding.  gzip/deflate via zlib; br/zstd have no stdlib
                decoder -> raw bytes kept.  Returns (bytes, note_or_None, fully_decoded)."""
                import zlib
                ce = [v for n, v in headers if n == "content-encoding"]
                codings = [c.strip().lower() for c in ",".join(ce).split(",") if c.strip()]
                data = body
                for c in reversed(codings):  # applied in listed order -> undo in reverse
                    if c == "identity":
                        continue
                    if c in ("gzip", "x-gzip"):
                        data = zlib.decompress(data, 16 + zlib.MAX_WBITS)
                    elif c == "deflate":
                        try:
                            data = zlib.decompress(data, zlib.MAX_WBITS)
                        except zlib.error:
                            data = zlib.decompress(data, -zlib.MAX_WBITS)  # raw deflate (non-conformant servers)
                    else:
                        return data, "body is %s-encoded, not decoded" % c, False
                note = ("decoded %s: %d -> %d bytes" % ("+".join(codings), len(body), len(data))) if codings else None
                return data, note, True
