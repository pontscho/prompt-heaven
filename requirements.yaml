      - "Tasks 018 (profile), 020 (T1 ENV_ADDITIONS), 029 (L rows), 062 (plan_interpreter), 069 (E16, E21, E22)."
      - "Not measured: whether a concurrent run's separate sandbox-exec counts as same-sandbox -- row mcp_sandbox:E22 asserts EPERM on a sibling run's pid."
    options:
      - "apply all measured rules (selected)"
    status: answered
  - category: security
    question: "M0 items 3k and 3l (M0:8, M0:10): setuid exec and ACL/flag writes inside the profile?"
    answer: >-
      A setuid/setgid exec is refused by Seatbelt itself (kernel op forbidden-exec-sugid; via /bin/sh
      sh exits 126 with "Operation not permitted"; as argv0 exit 71), under the exec filter, unfiltered
      process-exec and (allow default) -- row mcp_sandbox:E34 asserts the REFUSAL. Restricted mode
      denies file-write-acl ONLY in the write scope: it stops chmod +a and acl_set_file and passes
      every self-test; file-write-flags is NOT denied (it breaks shutil.copy2/copytree via copystat's
      chflags; the owner clears uchg with lchflags(0)). The KD-18 spelled-path ACL fallback is
      chmodx_np(_FILESEC_REMOVE_ACL), then acl_set_file, under an inode re-check (acl_set_link_np is
      defeated by a readattr/readsecurity deny ACE).
    details:
      - "Source: results.md items 3k, 3l, decisions 8, 10; plan KD-6, KD-18 step 5, deferred item 12 (pulled into v1)."
      - "Tasks 017/018 (E10), 029 (L11 reworded), 054 (strip fallback), 069 (E34, E17)."
    options:
      - "file-write-acl only (selected)"
      - "file-write-acl + file-write-flags (rejected: breaks shutil.copy2/copytree)"
    status: answered
  - category: implementation
    question: "M0 item 4, 4b and item-depth (M0:9, M0:14): how is hostile directory depth bounded and cleaned up?"
    answer: >-
      Zoltan's decision 2026-10-11: restricted Seatbelt denies file-write-create beyond 100 levels
      under every write scope with the "[^/]+/" group written out LITERALLY 100 times ({n}, {n,},
      {m,n} compile and silently never match); level 101 gets EPERM (row sbx_restrict:L12).
      Rename-chaining still builds deeper trees (2079 levels in 237 ms sandboxed), so the remover is
      the FLATTEN strategy: walk <= 50 levels, lift every subdir at relative depth 50 to a top-level
      .sbx-flat-%07d name with one fd-relative rename (lchflags(0) first on EPERM), remove segments
      bottom-up; fd window <= 50; fchmod only when (st_mode & 0o700) != 0o700; deadline checked
      before EVERY mutating op. Measured: 2079 levels in 0.29 s, 4059 in 0.56 s, linear ~0.14
      ms/level, vs 7.84 s bottom-up (row mcp_sandbox:H19).
    details:
      - "Source: results.md items 4, 4b, item-depth, decision 9; plan KD-17(b), KD-18, R-13, Step 3 depth cap, Step 10."
      - "Not measured: the conditional fchmod never fired, no cut met a uchg/ACL'd directory, nothing deeper than 4059 levels (declared, R-13 constraint)."
    options:
      - "literal 100x cap + flatten remover (selected)"
      - "{100} quantifier (rejected: silently never matches)"
      - "deny directory unlink in WD (rejected: breaks every rmdir in the workdir)"
      - "background reaper (rejected: trigger is deliberate hostility of an approved skill only)"
    status: answered
  - category: implementation
    question: "M0 items 2, 5, 6 (M0:11): VSZ budget, keg scan cap and startup time?"
    answer: >-
      effectiveBudgetBytes ~1.27 GiB for every interpreter (python3 1.279, node 1.250, bash
      1.267/1.268 GiB) -- far below 8 GiB, R-3 not triggered, the sh ulimit trampoline stays a
      deferred roadmap item. _KEG_SCAN_MAX_FILES = 512 (largest targeted image dir python3
      lib-dynload 76 files x 4 = 304, rounded to a power of two). Planning spawns: bash median 78.6
      ms (cold 118.0), three-interpreter set median 465.6 ms, worst 592.6 ms -- well under 6 s, no
      per-entry read_timeout (subject to the Step 12 re-measurement, task-066).
    details:
      - "Source: results.md items 2, 5, 6, decision 11; plan R-3, R-12, C-H3; tasks 046, 048, 066, 070."
    options:
      - "apply measured values (selected)"
    status: answered
  - category: interface
    question: "M0:12, M0:13: Contract item 4 and the mcp_sandbox config template contract?"
    answer: >-
      Contract item 4 (leaf grammar, <= 64 files / 4 MiB per run) is CONFIRMED by ai-soul
      (2026-10-11). The config template tests/files/mcp_sandbox/config.json.tmpl carries {sbx},
      {work_root}, {interpreters} UNQUOTED in value position and is rendered only with str.replace +
      json.dumps, never str.format; the rendered file lives under .claude/tmp/test_mcp_sandbox/ at
      mode 0600.
    details:
      - "Source: plan Contract item 4, Step 7 'Config template contract'; tasks 030 (as built), 031."
    options:
      - "str.replace + json.dumps (selected)"
      - "str.format (rejected: the template's JSON braces would be read as fields)"
    status: answered

