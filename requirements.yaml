        a quarantined workdir resumes where the last attempt stopped).
        Per directory: (1) os.open(name, O_RDONLY | O_DIRECTORY | O_NOFOLLOW, dir_fd=parent_fd);
        (2) on EACCES/EPERM: os.chmod(name, 0o700, dir_fd=parent_fd, follow_symlinks=False)
