implementation_notes: |
  Faithful mechanical build of the LOCKED plan (commit e242624). All 12 code/test
  tasks completed; forge test all green (10 suites, 0 fail, no count drift; the
  sbx_gate suite grew 71 -> 73 cases across the two live-validation fixes below;
  mcp_first_guard 335 with no regression).
  Live containment PROVEN on BOTH target platforms:
    - macOS Seatbelt (this host): selftest_probe a=ok b=blocked c=blocked d=blocked
      e_secret_write=blocked -- the M2 secret-READ boundary (~/.ssh/id_rsa under
      --write .) holds; SBPL last-match-wins confirmed LIVE (was UNVERIFIED in-repo).
    - Linux bwrap (host `para`, bubblewrap 0.6.1): sbx functional; b/c/e blocked,
      ~/.ssh masked to an empty tmpfs (host's real authorized_keys inaccessible in
      the sandbox), .git/config read denied (planted secret not exposed), R20
      fail-closed (exit 3, target never ran), happy-path runs.
  The LIVE Linux validation caught TWO real Linux-only defects that the offline
  string assertions AND the macOS live test both missed -- each fixed and re-validated:
    1. bwrap `--tmpfs` over the `.git/config` regular FILE would ENOTDIR-abort
       (dead-on-arrival in any git repo). Fix: mask regular-FILE secrets with
       `--ro-bind /dev/null <file>` (read-empty + write-denied), keep `--tmpfs` for
       directory secrets. Seatbelt unaffected (subpath deny works on a file path).
    2. secret_paths returned nonexistent home secrets (e.g. absent ~/.aws)
       unconditionally; bwrap cannot create a mountpoint for a nonexistent path under
       a read-only root -> "Read-only file system" abort. Fix: existence-filter
       secret_paths (a nonexistent secret has nothing to protect; macOS deny of a
       nonexistent path is a no-op, so filtering is cross-platform-safe). Offline
       regression guards added (absent secret NOT masked; configless .git NOT in set).
  Completeness lane (inspector-implementation) = COMPLETE, every load-bearing
  invariant verified in code line-by-line. Security lane triage = source-verified
  (one MEDIUM Linux-correctness issue found + fixed; no CRITICAL/HIGH). The full
  static Skill(p:security-review) deep-review was consciously WAIVED by the user
  after live containment proof on both platforms -- its marginal value was low, as
  the real defects were runtime bwrap behaviors that static review would not catch.
