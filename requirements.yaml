      implementation_details: |
        Plan Step 14 "Encoder" and "Collector".
        - thinking(delta): close an open text block, open {"type":"thinking","thinking":"",
          "signature":""} when none open, emit a thinking_delta.
        - thinking_end(signature): signature_delta when non-empty, then content_block_stop,
          advance index; nothing when no thinking block is open.
        - redacted_thinking(data): close any open block, emit a whole
          {"type":"redacted_thinking","data":data} block (start then stop).
