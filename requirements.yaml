# requirements.yaml -- R-0072: lift the stdlib HTTP front shared by Scripts/mcp-proxy.py and
# Scripts/llm-router.py into a new canonical source, Scripts/_mcp_httpfront.py.
#
# Source of truth: docs/feature-implementation-plan.md (validated in 3 rounds: correctness APPROVE,
# security APPROVE). It is authoritative; this file only breaks its five Steps into function-level
# tasks, in the plan's order, keeping every red-first gate BEFORE (and as a dependency of) the code
# it gates. "Step N.k" = item k of Step N in Section 6 of that plan; "P-x", "PD-n", "KD-n", "Rn",
# "L1-L6" point into that plan too. NOTE: Step 5 / task-033 moves that plan to
# .claude/tmp/feature-implementation-plan.md; read it there from task-033 on.
#
# Every code anchor below was re-read in the working tree over HEAD ea70244 on 2026-10-07. Line
# numbers move as soon as Step 1 edits a host: always locate by SYMBOL first, line second.
#
# TASK COUNT IS INTENTIONAL (47 tasks, more than the "13+ tasks, consider splitting" guideline):
# the plan is one roadmap item whose atomic Step 4 (source + registry + markers) cannot be split
# into separate plans without failing router J13 in between (KD-2). total_effort follows the
# validator's aggregation rule (largest task L + 2 levels = xxl); no single task is larger than L.
#
# NOT tasks (done by the orchestrator): every git commit, and the `roadmap.py close R-0072` step.

original_request: "R-0072: Lift the stdlib HTTP front (mcp-proxy, llm-router) into a canonical source -- full path overnight: feature-plan -> task-plan -> implement -> ADR (user decision 1, 2026-10-07)."
goal: >-
  Move the byte-identical stdlib HTTP/1.1 server-front mechanism that Scripts/mcp-proxy.py and
  Scripts/llm-router.py each carry by hand (connection admission, the total header deadline
  reader, request-line hardening, the bearer-token value check, the ready file and the stdlib
  refusal header pair) into one new canonical source, Scripts/_mcp_httpfront.py, generated into
  both hosts by Scripts/amalgamate.py, with every host policy injected (argument, self.timeout,
  self.front_log) rather than read as a host global; converge the router's stdlib refusals on
  nosniff + no-store (D3); pin every hand-kept stdlib override as a declared adaptation that a
  new generated_region group I reads; prove the move byte-identical with a git-index diff; and
  record the decision in ADR 0029 plus dated addenda to ADR 0012/0014/0025/0027/0028.
complete: true
roadmap_item: R-0072

requirements:
  - category: architecture
    question: "D1: what shape does the shared front take -- a mechanism-only canonical source of generated blocks, or a parameterised base class?"
    answer: >-
      Agent decision (overnight, for user review): mechanism-only lift into
      Scripts/_mcp_httpfront.py, domain "the stdlib HTTP/1.1 server front". NOT a parameterised
      base class: inherited methods would leave _ProxyHttpHandler's direct class body, which is
      all that mcp-proxy J25/J26 walk (tests/test_mcp_proxy.py:3466-3519), and bound_names in the
      hand-copy census would stop seeing hand overrides too.
    details:
      - "Blocks: _HTTP_STDLIB_REFUSAL_HEADERS, _http_token_value, _http_write_ready_file, _http_remove_ready_file, _HeaderDeadlineReader (module level); server_bind, process_request, handle_error (in the server class); parse_request, handle_expect_100, _single_header (in the handler class)."
      - "Precedent for in-class generation: Scripts/mcp-proxy.py:2038-2047 (_mcp_json.py :: _result, _error)."
      - "A base class would also change the MRO under the router's in-process FastRouter rig."
    options:
      - "Mechanism-only canonical source, in-class markers for methods (selected)"
      - "Parameterised base class _FrontServer/_FrontHandler, imported or generated as a class (rejected)"
      - "Leave the front hand-copied (status quo, rejected: ADR 0028 :1148/:1206 say no gate holds them equal)"
    status: answered
  - category: architecture
    question: "D2: how are blocks placed and named, and how does host policy reach them?"
    answer: >-
      Agent decision (overnight, for user review): in-class markers for methods, module-level
      regions for the rest; names keep mcp-proxy's names (ADR 0028 :136-138, "a move without
      renames"). Policy (logger, error class, timeouts, minimum token length) is passed as an
      argument or read through self. / self.server. -- a block never reads a host global. ADR 0025
      addendum wording: "Generation copies code, not policy".
    details:
      - "The free-name audit (Scripts/amalgamate.py:633-640) refuses any region whose block reads a host global."
      - "A constant on an in-class marker would be a class attribute, invisible to a bare-name read in a method (NameError at run time)."
      - "Router-only module names keep the _rt_ prefix; the renamed ready-file pair takes mcp-proxy's _http_ names."
    options:
      - "Inject policy via arguments / self seams (selected)"
      - "Lift the timeout constants and _TOKEN_MIN_LEN into the source (rejected: host policy)"
      - "Policy as new class attributes (rejected: PD-7)"
    status: answered
  - category: interface
    question: "D3: should the router's stdlib refusals (send_error 400/414/431/501/505) carry nosniff + no-store like the proxy's?"
    answer: >-
      Agent decision (overnight, for user review): yes, converge send_error. The router passes
      extra_headers=_HTTP_STDLIB_REFUSAL_HEADERS to its _refuse; B21 asserts both headers and is
      observed red before the change.
    details:
      - "Proxy precedent: Scripts/mcp-proxy.py:2295-2304 passes _HTTP_STDLIB_REFUSAL_HEADERS."
      - "The router's _refuse already accepts extra_headers (Scripts/llm-router.py:7196-7197, :7217-7218)."
      - "This is one of the two intended behaviour changes (the other is KD-6)."
    options:
      - "Converge via the canonical constant block (selected, PD-5)"
      - "Router spells its own _RT_STDLIB_REFUSAL_HEADERS (rejected: two hand copies)"
      - "Leave the router without the headers (rejected)"
    status: answered
  - category: implementation
    question: "D4: which gates must hold, and how is every changed test proven?"
    answer: >-
      Agent decision (overnight, for user review): router J1/J13, proxy J25/J26, generated_region
      and amalgamate_check stay green; the new source is registered in
      tests/test_generated_region.py; every changed or new test is run red first (or, for a
      characterisation case, red by a reverted scratch mutation).
    details:
      - "Red-first: B21 (Step 1), J40 + K5 (Step 2), J40(f) + K5(f) (Step 3), group H strict rows (Steps 3 and 4), GA/GE httpfront, GI1, sources-registered, every-source-in-use, census-sources-is-the-registry (Step 4)."
      - "Characterisation (red by scratch mutation): J47 (Step 3), GI2 (Step 4)."
      - "py_deps' new NEW_39_SCOPE row is a scope addition, not red-first."
    options:
      - "Red-first on every new/changed case (selected)"
    status: answered
  - category: implementation
    question: "PD-1: what per-recv cap does _HeaderDeadlineReader use?"
    answer: "A constructor argument `cap`. Each host keeps its current cap: the proxy passes _HTTP_HEADER_TIMEOUT_S, the router _HTTP_SOCKET_TIMEOUT_S. Nothing is harmonised, so nothing changes."
    details:
      - "Proxy: the deadline is only ever monotonic() + _HTTP_HEADER_TIMEOUT_S, so left <= 10 s and the cap never binds."
      - "Router: _post sets a 60 s body deadline (_HTTP_BODY_TIMEOUT_S), where its 30 s cap does bind."
    options:
      - "Constructor argument cap (selected)"
      - "One shared 30 s cap (rejected: a semantic change nobody asked for)"
    status: answered
  - category: implementation
    question: "PD-2: what does the generated parse_request reset the socket timeout to?"
    answer: "self.timeout, the handler's class attribute, already = _HTTP_HEADER_TIMEOUT_S in both hosts (proxy :2198, router :7133). The FastRouter rig patches that attribute together with the module constant (tests/test_llm_router.py:518-525)."
    details:
      - "A new attribute (e.g. header_timeout_s) would not be patched, and B14 would silently run against a 10 s bound."
    options:
      - "self.timeout (selected)"
      - "A new class attribute header_timeout_s (rejected)"
    status: answered
  - category: implementation
    question: "PD-3: which logger do the generated server methods use?"
    answer: "A class attribute `front_log = log` on each server class; the blocks log through self.front_log. The logger object (and its record name mcp-proxy / llm-router) is unchanged; the rig mutates that object and never rebinds mod.log, so this class attribute is allowed under PD-7."
    details:
      - "FastRouter._log_to attaches its handler to mod.log (tests/test_llm_router.py:546, :560)."
      - "The wire-log gate judges any <x>.<level>(...) call, so self.front_log.warning(...) is judged like log.warning(...)."
    options:
      - "front_log = log class attribute (selected)"
      - "Pass the logger as an argument to each server method (impossible: stdlib signatures)"
    status: answered
  - category: implementation
    question: "PD-4: does _http_remove_ready_file take the logger, and is it optional?"
    answer: "Required argument `logger`. The proxy passes log and keeps its two DEBUG lines; the router passes log too, so its removal (silent today) gains the same two type-only DEBUG lines. Declared behaviour change KD-6, recorded in ADR 0029."
    details:
      - "The new lines: logger.debug(\"ready file left: not this pid\") and logger.debug(\"ready file left: %s\", type(exc).__name__)."
    options:
      - "Required logger argument (selected)"
      - "logger=None default with the router passing nothing (rejected: a second behaviour switch inside one block)"
    status: answered
  - category: implementation
    question: "PD-5: how is the stdlib refusal header pair held equal across hosts?"
    answer: "_HTTP_STDLIB_REFUSAL_HEADERS becomes a canonical constant block, so generation holds D3's convergence equal instead of two hand copies agreeing."
    details:
      - "In the proxy the two prose comment lines stay ABOVE the Refresh line and the BEGIN marker."
    options:
      - "Canonical constant block (selected)"
      - "Two hand copies (rejected)"
    status: answered
  - category: architecture
    question: "PD-6: are setup, handle_one_request and process_request_thread canonical names?"
    answer: "No. A canonical name a host keeps by hand becomes an UNDECLARED hand-copy row, which router J13 turns into a FAIL (tests/test_llm_router.py:18213-18220). They stay hand-written and are declared in HTTPFRONT_ADAPTATIONS."
    details:
      - "The router's setup adds self._rt_authed = False; its handle_one_request has a pre-auth bound; its process_request_thread counts active for the drain."
    options:
      - "Keep them hand-written, declared (selected)"
      - "Lift them behind _front_* hook methods (rejected: policy in code, widens scope)"
    status: answered
  - category: security
    question: "PD-7: how may a policy reach a generated method without snapshotting a rig-patched constant?"
    answer: "Only through (1) self.timeout, the one rig-patched class attribute, (2) a constructor or function argument evaluated at call time, or (3) a hand-written _front_* hook method reading the host constant at call time. This lift needs no hook method. Router J40 clause (e) gates the rule."
    details:
      - "The rig patches module constants with setattr; B14 patches _HTTP_PREAUTH_TIMEOUT_S and _HTTP_HEADER_TIMEOUT_S (tests/test_llm_router.py:3065)."
      - "The hook rule is written into the source docstring for a future lift."
    options:
      - "Three allowed channels (selected)"
    status: answered

constraints:
  - type: technical
    description: "Python 3.9 + the standard library only (ADR 0024); no 3.10+ API (no `X | None`, keep socket.timeout)."
    impact: "Scripts/_mcp_httpfront.py joins NEW_39_SCOPE (tests/test_py_deps.py:162-165); py_deps goes 60 -> 61."
  - type: technical
    description: "Generator rule: one source per marker. A region's names resolve only against the source its own marker names; another region's names are NOT provided."
    impact: "No block names another block (KD-3): no *_CORE tuple, no WHOLE_SOURCES entry; each region refreshes independently."
  - type: technical
    description: "Generator rule: a block may read only builtins, the host's module-level imports and its own arguments (free-name audit, Scripts/amalgamate.py:633-640)."
    impact: "Every policy is injected (cap, min_len, error, logger arguments; self.timeout; self.front_log). Both hosts and the tab_host fixture must import io, json, os, socket, socketserver, sys, time and typing.Optional."
  - type: technical
    description: "Generator rule: an in-class marker renders methods into the class body; a constant on an in-class marker becomes a class attribute, so a bare-name read of it in a method is a NameError."
    impact: "Constants and _HeaderDeadlineReader are module-level regions; only methods go in-class. Each class's generated members sit contiguously (KD-5), so process_request_thread and _single_header are moved by hand first."
  - type: technical
    description: "Generator refusals are SystemExit (unknown source, undefined block name, free-name audit, load_blocks on a non-file)."
    impact: "Every mod.* generator call in the new GA/GE/GI cases sits in try/except (Exception, SystemExit) and records a FAIL instead of ending the suite."
  - type: technical
    description: "Tab safety: tab-safety-real-blocks demands an unsafe set of exactly [\"_rows_note\"]; no new block may contain an implicit line join."
    impact: "process_request's 503 sendall is joined onto ONE physical line in the Step 2 twins."
  - type: technical
    description: "generated_region stays in-memory only (tests/test_generated_region.py:69-71): no new case touches the filesystem or a socket."
    impact: "GE cases drive the blocks against fakes; the ready-file pair is covered end to end by proxy J45 and router B15/V24 instead of a group E case."
  - type: business
    description: "ADRs are append-only: an accepted ADR is changed only through ClaudeCode/skills/wiki/scripts/addendum.py with a staged {\"title\", \"body\"} JSON item file under .claude/tmp/ (no level-1/2 heading in the body)."
    impact: "ADR 0012/0014/0025/0027/0028 get dated addenda; no existing ADR byte is edited."
  - type: business
    description: "Red-first for every new or changed test: observe it FAIL before the code it gates lands; a characterisation case is observed red by a reverted scratch mutation."
    impact: "Each gate task precedes and is a dependency of its code task; the red runs are recorded (they are quoted in ADR 0029)."
  - type: business
    description: "Never stage the foreign working-tree files: .claude/settings.json, ClaudeCode/CLAUDE.md, ClaudeCode/hooks/post-edit-lint.sh, ClaudeCode/skills/bitbucket/*, tests/test_bitbucket_cli.py."
    impact: "The only git staging any task performs is `git add Scripts/mcp-proxy.py Scripts/llm-router.py` (the R16 baseline, task-019). Commits are the orchestrator's."
  - type: business
    description: "docs/feature-implementation-plan.md is never committed, and is moved to .claude/tmp/feature-implementation-plan.md before any wiki reindex, ingest or measure."
    impact: "task-033 runs first in Step 5; wiki_index never sees an untyped page under docs/."
  - type: business
    description: "Roadmap candidates are staged for user approval, never added; docs/roadmap/ is never edited by hand."
    impact: "task-047 writes .claude/tmp/roadmap-candidates-r0072.md only; no `roadmap.py add` runs. The R-0072 close is the orchestrator's."
  - type: technical
    description: "The generator rewrite (python3 -B Scripts/amalgamate.py, no flag) is not a forge target; run it directly, never with --force."
    impact: "task-029 runs it by hand, then proves with `git diff -U0` against the staged index that only marker lines were added (R16)."
  - type: security
    description: "The token floor must not weaken once min_len/error are arguments (A07, CWE-521)."
    impact: "J40(f)/K5(f) require every _http_token_value call to pass the Names _TOKEN_MIN_LEN and ConfigError; proxy J47 and router A13 refuse a short token end to end."

