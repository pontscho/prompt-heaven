# requirements.yaml -- llm-router: an Anthropic Messages router for Claude Code
# (Scripts/llm-router.py), backends passthrough -> llamacpp -> mistral (D7).
#
# Source of truth: docs/feature-implementation-plan.md (anchors are `plan:<line>`, measured on
# the 2323-line round-3 version of 2026-10-05, HEAD 69c01f0). Every code anchor below was
# re-read against the live tree on 2026-10-05. Case counts are EXPECTED values (169 for the
# new suite); the run is authoritative (tests/run.py:711-719: a moved count is the alarm).
#
# NOT a roadmap item: no roadmap_item key on purpose.
#
# TASK COUNT IS INTENTIONAL (61 tasks, more than the "13+ tasks, consider splitting" guideline):
# this is ONE single-file router of eight units plus a 169-case suite, three fleet-gate edits
# that must move together (py_deps 58 -> 59, DECLARED_HOSTS + its mirror, generated region)
# and the wiki. The plan is a linear 15-step chain (plan:2208) with red-first runs inside it;
# the granularity exists so that every test group is its own task that precedes the code it
# proves, and so that no task is larger than L.
#
# RED-FIRST (SC-3, plan:146-152, plan:2147-2149): every test-group task comes BEFORE the code
# task(s) it proves and is observed FAILING first; the FAIL count goes into
# .claude/tmp/llm-router-capture/measurements.md and then into ADR 0028. Exemptions (no red
# run): C7, C11, J20, J9-J11. J1-J4 and J13 take their red from controls J15-J19, J5 from J22.
#
# The suite is NOT registered in tests/run.py before task-053 (plan:1088-1091): until then it
# is run directly with `python3 -B tests/test_llm_router.py` (through p:minion-builder).
#
# Commit boundaries (PROPOSED by the task writer -- the plan defines none; each one leaves
# every registered fleet gate green, because the new suite is unregistered until commit E):
#   commit A = task-005..task-012 (skeleton + the gate edits that must land together:
#              DECLARED_HOSTS and its mirror, NEW_39_SCOPE and py_deps 59, forge text, docs
#              prose; plus any tests/files/llm_router/tf_* fixtures task-003/004 produced)
#   commit B = task-013..task-032 (suite scaffold, config loader, front, outbound transport,
#              HAND_COPY_REASONS together with the hand copies they declare)
#   commit C = task-033..task-043 (hub, passthrough, llamacpp)
#   commit D = task-044..task-052 (mistral, cross-kind hardening; suite at 169)
#   commit E = task-053..task-060 (registration, forge target, ADR 0028, component page,
#              scripts/tests docs, roadmap item, plan file moved out of docs/, reindex)
#   task-061 (acceptance) appends ADR 0028 "Acceptance" in a follow-up commit.
#
# USER-GATED tasks (real Claude Code / credentials / live services -- NEVER run without the
# user's explicit OK):
#   task-002 (Step 1 M1-M3: capture a real Claude Code session; gates G-M1, G-M1b, G-M2, G-M3)
#   task-003 (Step 1 M4: the user's llama-server; gate G-M45 half)
#   task-004 (Step 1 M5: the user's Mistral key; gates G-M45 half, G-M5; exact-value key sweep)
#   task-061 (Step 15: manual acceptance against all three real backends)
# No other task depends on a user-gated task: every task that consumes a gate states the
# plan's default to use while the gate has not run (Content-Length framing with 411, 32 MiB
# body limit, query set {"", "beta=true"}, 1 MiB line / 2 MiB event, route keys
# claude-sonnet-4-5 / claude-haiku-4-5, every Mistral rule implemented).
# Step 14's ADR 0028 and component page are NOT user-gated: the plan does not gate them.
#
# Explicitly OUT of every task (plan:194-224): the `anthropic` kind's behaviour (extension
# points only), exact Tekken counting, /v1/models, retries/fail-over, inbound HTTPS, and ANY
# edit of Scripts/mcp-proxy.py (D5: read-only source of the copied front).

original_request: >-
  Build llm-router: an HTTP server that speaks the Anthropic Messages API to Claude Code
  (ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN) and routes each request by its model name to a
  configured backend -- passthrough (inferNO, native Anthropic), llama.cpp's llama-server
  /v1/messages behind a quirk normalizer, and Mistral (api.mistral.ai, OpenAI-style chat
  completions, fully translated both ways including the SSE stream) -- with the anthropic
  backend kind reserved for a later, ToS-gated plan.
goal: >-
  Add Scripts/llm-router.py, a single-file, stdlib-only (Python 3.9, ADR 0024) HTTP/1.1 server
  of eight units that authenticates Claude Code with a bearer token from a 0600 JSON config,
  routes POST /v1/messages and /v1/messages/count_tokens by exact model name to a passthrough,
  llamacpp or mistral backend (anthropic reserved), relays or translates JSON and SSE answers
  with complete events only, never forwards client credentials, refuses SSRF targets, keeps
  logs structure-only, and ships with a 169-case red-first suite tests/test_llm_router.py, the
  fleet-gate registrations, ADR 0028, a component page and one roadmap item to lift the copied
  HTTP front into a canonical source.
complete: true
implementation_complete: true
implementation_date: 2026-10-06
inspector_verdict: COMPLETE
security_verdict: APPROVE
validation_fan_out_rounds: 2
implementation_open_items:
  - "task-002/003/004 (M1-M5 real captures) and task-061 (manual acceptance): user-gated, not run; defaults applied per ADR 0028."
  - "Round-1 fix pass (.claude/tmp/llm-router-fixpass-r1.md) moved the suite from 169 to 174 cases; the 169 counts in the task specs above are the frozen pre-fix-pass record."
implementation_security_open_items:
  - "V11: 192.0.0.0/24 not refused under the public policy -- fix in canonical Scripts/_mcp_chrome.py then resync the hand copy (roadmap R-0074)."
  - "V22: --log-file follows a symlink -- canonical Scripts/_mcp_logging.py, fleet-wide (roadmap R-0063)."
  - "mcp-proxy counterparts of V24 (ready file not removed on shutdown) and V37 (100 Continue before auth) (roadmap R-0075, R-0076)."
  - "Declared, not fixed: V3 pre-auth bound is a mitigation; V9 abandoned resolver threads; V13 worst-case memory; V24 TOCTOU / no removal on SIGKILL; V26 WARNING log volume (ADR 0028 Declared limits)."

requirements:
  - category: architecture
    question: How is a request routed to a backend (D1)?
    answer: >-
      By the request body's `model`, matched EXACTLY against the config's `routes` keys. A route
      is {backend, model (the upstream id), options}. An optional top-level `default` route
      catches every other model (its RouteSpec.name is "(default)", logs only). A duplicate
      key, or two route keys equal after casefold(), refuses startup (ADR 0015); a routes key
      whose casefold() is "default" refuses startup. An unknown model with no default is 404
      not_found_error naming the model through _log_value.
    details:
      - "plan:51-57 (FR-3)"
      - "plan:820-822 (KD-2)"
      - "plan:1316-1319 (Step 4 route-name ambiguity)"
    options: []
    status: answered
  - category: security
    question: Where do the backend API keys and the router token live, and how are they protected (D2)?
    answer: >-
      Both live in the JSON config (`auth_token`, `backends.<n>.api_key`). Startup is refused
      unless the config opened with O_NOFOLLOW is a regular file owned by the effective uid
      with st_mode & 0o077 == 0. No --config-json (argv is visible in ps). Values never appear
      in logs, errors, stderr or a response body; every refusal names the field, never the
      value; BackendSpec/RouterConfig __repr__ are redacted. The router token is >= 32
      printable ASCII and differs from every api_key.
    details:
      - "plan:86-90 (FR-10)"
      - "plan:189-191 (A-9)"
      - "plan:814-819 (KD-1)"
      - "plan:626-632 (__repr__ redaction)"
    options: []
    status: answered
  - category: security
    question: How is the inbound side authenticated and what client headers reach the upstream (D3)?
    answer: >-
      Only `Authorization: Bearer <router token>`, compared with hmac.compare_digest;
      x-api-key is ignored for auth and never forwarded. Client credentials are never
      forwarded: a per-kind ALLOW-list (FORWARDABLE / DEFAULT_FORWARD, checked at import
      against _NEVER_FORWARD) picks client headers; the upstream credential comes only from the
      config and is added last, only in _rt_upstream_headers. Host is checked on a loopback
      bind; Origin may be absent, else must be on --allowed-origin; no CORS at all (no
      Access-Control-* header, OPTIONS 405). A second appearance of the router token (URL,
      decoded URL, any other header) is 400. The body is read only after every header check.
    details:
      - "plan:75-85 (FR-9)"
      - "plan:823-848 (KD-3 header table)"
      - "plan:1374-1389 (_precheck order 0-4b)"
    options: []
    status: answered
  - category: interface
    question: How is count_tokens answered (D4)?
    answer: >-
      Forwarded to the backend's /v1/messages/count_tokens for passthrough and llamacpp
      (llamacpp after its request quirks). For mistral, answered locally as
      {"input_tokens": max(1, len(json.dumps(translated, separators=(",",":"),
      ensure_ascii=False).encode("utf-8", "surrogatepass")) // options.count_divisor)} with
      count_divisor an int 1-16, default 4. Documented as an estimate (exact Tekken counting is
      out of scope).
    details:
      - "plan:70-74 (FR-8)"
      - "plan:1747-1749 (Step 10)"
    options: []
    status: answered
  - category: architecture
    question: How is shared code obtained (D5)?
    answer: >-
      _configure_logging is GENERATED from Scripts/_mcp_logging.py with llm-router.py added to
      amalgamate.py DECLARED_HOSTS (ADR 0025). The HTTP front is an ADAPTED COPY of
      mcp-proxy's front (mcp-proxy.py itself is not modified); verbatim copies keep their
      mcp-proxy names (_http_token_value, _log_value, _HeaderDeadlineReader). The address
      classifier is a hand copy from the WHOLE source _mcp_chrome.py, declared in
      HAND_COPY_REASONS. ADR 0028 records the copy; a roadmap item tracks lifting the front into
      a canonical source.
    details:
      - "plan:99-102 (FR-12)"
      - "plan:929-937 (KD-11)"
      - "plan:1882-1901 (Step 14)"
    options: []
    status: answered
  - category: architecture
    question: What is in scope for the anthropic backend kind (D6)?
    answer: >-
      Reserved extension points only: "anthropic" is in _KINDS and RESERVED_KINDS, load_config
      refuses it with `backends.<name>.kind: "anthropic" is reserved and not implemented`
      (case A14), the KD-3 header table has its row, and route options are validated per
      adapter class. Its full design (ToS gate, OAuth, beta union, fingerprint) is a separate
      future plan.
    details:
      - "plan:67-69 (FR-7)"
      - "plan:196-212 (Out of Scope)"
      - "plan:998-1007 (Extension points)"
    options: []
    status: answered
  - category: implementation
    question: In what order are the backends built (D7)?
    answer: >-
      passthrough -> llamacpp -> mistral for backend code. Evidence for Mistral and llama.cpp
      is gathered in Step 1 (user-gated), and the shared SSE encoder and upstream pump are
      built in the hub (Step 7) before any backend.
    details:
      - "plan:11-14"
      - "plan:2208-2210 (linear sequencing)"
    options: []
    status: answered
  - category: architecture
    question: What is the concurrency model?
    answer: >-
      One ThreadingHTTPServer, a daemon thread per connection capped by a BoundedSemaphore
      (--max-connections, default 32). A streaming request adds ONE daemon pump thread
      (rt-pump) that is the only reader of the upstream response, feeding a byte-bounded queue;
      the handler thread is the only writer to the client, pings after 15 s since its last
      client write (never before message_start), polls for client EOF while nothing is
      written, unblocks the pump with socket.socket.shutdown(raw_sock, SHUT_RDWR) (never
      close()), and joins the pump before returning so the slot covers it. No asyncio, no
      executor pool.
    details:
      - "plan:106-117 (NFR-1, NFR-2, NFR-2b)"
      - "plan:849-880 (KD-4)"
      - "plan:763-770 (rejected heartbeat writer)"
    options: []
    status: answered
  - category: interface
    question: What is the command line?
    answer: >-
      --config PATH (required), --bind (IPv4 literal, default 127.0.0.1; non-loopback needs
      --allow-remote), --port (default 0), --allow-remote, --allowed-origin (repeatable),
      --ready-file (0600, atomic), --body-limit (default 32 MiB, range [1 MiB, 256 MiB]),
      --max-connections (default 32, range 1-1024), --debug, --log-file. A refusal prints one
      line `llm-router: <reason>` on stderr and exits 2. Network on the command line, routing
      and secrets in the config (KD-17).
    details:
      - "plan:91-98 (FR-11)"
      - "plan:976-980 (KD-17)"
    options: []
    status: answered
  - category: security
    question: How is the outbound side protected (SSRF, TLS)?
    answer: >-
      Resolve once per connect, vet every address, connect only to the vetted list. Every kind
      is public-only by default; allow_private admits private/ULA/CGNAT/site-local only
      (link-local/metadata, multicast, unspecified, reserved and translation prefixes stay
      refused); loopback needs allow_loopback (valid only with allow_private); plain http needs
      allow_private. TLS: create_default_context() or cadata=ca_pem when ca_file is set (vetted,
      read once), CERT_REQUIRED + check_hostname asserted, minimum TLS 1.2, suppress_ragged_eofs
      False. No redirects (3xx is 502), no *_PROXY, no urllib.request, no retries.
    details:
      - "plan:126-132 (NFR-5, NFR-6)"
      - "plan:165-173 (A-3)"
      - "plan:981-996 (KD-18)"
      - "plan:1435-1480 (Step 6)"
    options: []
    status: answered
  - category: data
    question: What is the config schema?
    answer: >-
      Top keys auth_token, backends, routes, default (anything else refused by name). Backend
      keys kind, base_url, allow_private, allow_loopback, ca_file, api_key, auth_header,
      forward_headers, connect_timeout, idle_timeout. Backend names match
      ^[a-z0-9][a-z0-9_-]{0,31}$. Route keys are the exact model strings Claude Code sends
      (M3); route options are validated by the kind's ROUTE_OPTIONS (mistral: count_divisor,
      temperature, top_p, max_tokens_cap; llamacpp: thinking_budget, temperature, top_p, top_k,
      quirks_off; passthrough: none). Duplicate JSON keys refused at every depth
      (object_pairs_hook).
    details:
      - "plan:634-659 (schema and example)"
      - "plan:1267-1321 (Step 4)"
    options: []
    status: answered
  - category: implementation
    question: How are failures reported to Claude Code?
    answer: >-
      Always as an Anthropic envelope {"type":"error","error":{"type","message"}}; status ->
      type via _STATUS_TO_TYPE, upstream status via _UPSTREAM_STATUS (KD-14); upstream 401/403
      becomes 502 api_error (KD-8). The response head is sent only after the upstream status is
      known (KD-15): a non-2xx upstream on a stream request is a JSON envelope, never a 200
      SSE. After SSE headers, a failure is one `event: error` and the stream closes, never a
      fake message_stop (KD-7). Upstream error text is scrubbed of every secret form (KD-9)
      and cut to 300 chars.
    details:
      - "plan:907-913 (KD-7, KD-8)"
      - "plan:914-925 (KD-9)"
      - "plan:950-969 (KD-14, KD-15)"
      - "plan:1927-1963 (error table)"
    options: []
    status: answered

constraints:
  - type: technical
    description: Python 3.9 floor, stdlib only, single file, no sibling import (ADR 0024, ADR 0025).
    impact: >-
      No asyncio, no urllib.request, no 3.10+ API (NEW_39_SCOPE gates it), shared code only via
      a generated region or a declared hand copy.
  - type: technical
    description: >-
      _mcp_chrome.py is a WHOLE source (Scripts/amalgamate.py:106-107); a host may not take only
      some of its blocks, and no other canonical block name (_result, _error, _bool_param,
      _int_param, _ensure_dict, MAX_INFLIGHT_REQUESTS ...) may be bound by hand.
    impact: >-
      The address classifier (_CH_TRANSLATION_PREFIXES, _ch_embedded_ipv4, _ch_address_refused)
      is a verbatim hand copy declared in HAND_COPY_REASONS; every new helper is _rt_*.
  - type: technical
    description: >-
      No MAX_*_BYTES constant and no max_*_bytes config key (tests/test_mcp_footprint.py:452,
      :462-463).
    impact: The body limit is _ROUTER_BODY_LIMIT; every limit constant avoids a MAX_ stem.
  - type: technical
    description: >-
      Never write a case count in the test module docstring (docs/subsystems/tests.md:359);
      every scanner suite carries a negative control (:362); tests write only under
      .claude/tmp/test_llm_router/run-<unique>/.
    impact: The count is typed once in tests/run.py; J15-J19 and J22 are planted controls; WRITES discipline.
  - type: technical
    description: Scripts/mcp-proxy.py is read-only for this change (D5).
    impact: The front is copied and adapted; drift is mitigated by ADR 0028's unit list, J1 and the roadmap lift item.
  - type: security
    description: Structure-only logging (ADR 0011, NFR-3).
    impact: >-
      Method, path without query, status, kind, route name, byte counts, durations; exception
      type names only; never a body, header value, key or token; no traceback printed.
  - type: security
    description: Units 2-5 are pure (NFR-8).
    impact: >-
      No socket/ssl/http/select/time/threading reference between the `# Unit 2:` and
      `# Unit 6:` banners (J4c); the scrubber reaches units 4-5 only as InboundRequest.scrub.
  - type: business
    description: >-
      Measurements and acceptance against real Claude Code, Mistral and llama.cpp need the
      user's credentials and services.
    impact: Steps 1 and 15 (task-002/003/004/061) are user-gated; downstream tasks use the plan's defaults until they run.

success_criteria:
  - "SC-1: a real Claude Code session completes a multi-turn conversation with tool use (Read, Bash, Edit) against each of the three backend kinds, including a resumed mistral turn with tool history (Step 15, user-gated task-061)."
  - "SC-2: `python3 tests/run.py llm_router` passes with 169 typed once in SUITES; py_deps (59), generated_region (re-measured) and syntax still pass with no CASE COUNT DRIFT."
  - "SC-3: every risk R1-R18 has a named test case, each observed red before its mitigation landed (exemptions C7, C11, J20, J9-J11; J1-J5/J13 via controls J15-J19, J22)."
  - "SC-4: group I shows no sentinel key and no router token in stderr, the --log-file, any response body, or any request recorded by the wrong peer."
  - "SC-5: `python3 Scripts/amalgamate.py --check` exits 0 with llm-router.py walked as a declared host, and the hand-copy census shows no [UNDECLARED] row for it."

context_summary:
  error_handling: >-
    Three exception classes in unit 1: ConfigError (config/CLI refusal; message names the field
    and the rule, never the value; main prints `llm-router: <msg>` on stderr and exits 2),
    ApiError(status, err_type, message) (an Anthropic-shaped refusal, no secret) and
    UpstreamError(status 502|504, err_type, message) (one line, built by _rt_upstream_refusal
    in the _ChFallbackConnection._refusal shape: certificate verify failed / timed out / tls /
    malformed response / transport). Every HTTP answer that is an error is the envelope
    {"type":"error","error":{"type":..., "message":...}} from _rt_error_body; status -> type via
    _STATUS_TO_TYPE, upstream status -> router status via _UPSTREAM_STATUS (KD-14), upstream
    401/403 -> 502 (KD-8). Pre-body refusals go through _refuse (Connection: close, Anthropic
    body); stdlib-level refusals (400/414/431/501/505) through the overridden send_error with
    fixed texts and the HTTP/0.9 -> HTTP/1.1 guard. After SSE headers: one `event: error`, then
    close, never message_stop (KD-7). Any other Exception: 500 api_error "internal error",
    type name logged, no traceback (handle_error logs type only). JSON parse refusals catch
    (UnicodeDecodeError, ValueError, RecursionError).
  memory_management: >-
    Python, GC-managed; the load-bearing rules are BOUNDS and OWNERSHIP. Every per-stream buffer
    is bounded (NFR-2b): one SSE line <= _SSE_LINE_LIMIT (1 MiB), one event <= _SSE_EVENT_LIMIT
    (2 MiB), the pump queue <= _RT_QUEUE_BYTES (16 MiB by byte count), Mistral buffered tool
    args <= _RT_BUFFERED_TOOL_LIMIT (8 MiB), non-stream upstream body <= _UPSTREAM_BODY_LIMIT
    (64 MiB), ca_file <= 1 MiB, inbound body <= --body-limit. Each overrun is an error, never a
    partial event. Socket ownership: the pump is the only reader of resp and performs the final
    resp.close() + conn.close() itself; the handler unblocks it only with
    socket.socket.shutdown(conn.raw_sock, SHUT_RDWR) and joins it before releasing its slot.
    File descriptors: config and ca_file are read from one O_NOFOLLOW descriptor closed in a
    finally; an unclosed makefile keeps a socket fd alive (P24), so the stock rfile is closed in
    setup().
  logging_pattern: >-
    log = logging.getLogger("llm-router"), configured only by the GENERATED _configure_logging
    (DEBUG with --debug or --log-file, else WARNING; log file 0600; never stdout). Structure only
    (ADR 0011): every wire-derived value goes through the verbatim _log_value (control-escaped,
    width-bounded, "..." on every cut). One DEBUG summary line per request: `req
    endpoint=messages route=<name> kind=<kind> stream=1 status=200 up_status=200 in=N out=N
    ms=N up_ms=N end=message_stop|error|disconnected|shutdown|json` (mistral adds
    dropped_thinking=<n>). WARNING classes: 401/403 refusals (status + peer only), connection
    cap, upstream policy refusal (backend + reason class), upstream credential rejected
    (backend name only), unserialisable answer (type name). log_message logs method and path
    without query only. Exceptions as type(exc).__name__ only.
  naming_conventions: >-
    4-space indentation (llm-router.py is a SPACE host for the generator). New module-level
    helpers use the `_rt_` prefix (`_rt_ll_*` llama.cpp quirks, `_rt_ms_*` Mistral
    translation); never `_lr_`. Verbatim hand copies KEEP their source names
    (_CH_TRANSLATION_PREFIXES, _ch_embedded_ipv4, _ch_address_refused from _mcp_chrome.py;
    _http_token_value, _log_value, _HeaderDeadlineReader from mcp-proxy.py). Adapted copies are
    renamed (_rt_resolve, _rt_open_socket, _RouterHttpServer, _RouterHandler). Constants are
    _UPPER with an _S suffix for seconds and a _LIMIT/_RANGE/_CAP stem instead of MAX_. Public
    classes: ConfigError, ApiError, UpstreamError, BackendSpec, RouteSpec, RouterConfig,
    RouterSettings, InboundRequest, AnthropicSseEncoder, Adapter, PassthroughAdapter,
    LlamacppAdapter, MistralAdapter, EventRelay, LlamacppRelay, MistralStreamTranslator; tables
    KIND_CLASSES, ADAPTERS, RESERVED_KINDS, LLAMACPP_REQUEST_QUIRKS, LLAMACPP_EVENT_QUIRKS.
    Test fixtures and sentinels start with tf / TF_ (tests/files/README.md:16-22).
  key_patterns:
    - "P1 script header: shebang + PEP 723 block with requires-python >=3.9 and dependencies = [] (Scripts/mcp-proxy.py:1-5)."
    - "P2 generated logging region: paste `# BEGIN GENERATED: _mcp_logging.py :: _configure_logging` + END line, run python3 Scripts/amalgamate.py, never hand-edit inside (Scripts/mcp-proxy.py:246-265)."
    - "P3 config read on the opened O_NOFOLLOW descriptor: fstat, S_ISREG, st_uid == geteuid, st_mode & 0o077 == 0 (Scripts/mcp-proxy.py:593-628 is the stricter model, :412-433 the weaker one)."
    - "P4 JSON parse refusal without echoing content, plus object_pairs_hook=_rt_no_duplicate_keys (Scripts/mcp-proxy.py:524-536)."
    - "P5 _http_token_value verbatim (Scripts/mcp-proxy.py:631-637); P6 IPv4-literal bind and --allow-remote (:648-655); P6b _cfg_timeout shape with bound 3600 (:401-409)."
    - "P7 listener with a connection cap, no reverse DNS, type-only error log; P8 _HeaderDeadlineReader + setup/handle_one_request/parse_request (Scripts/mcp-proxy.py:1999-2124)."
    - "P9 structure-only log_message; P10 _refuse with an Anthropic JSON body; P11 _single_header; P12 precheck order defects -> path -> Host -> Origin -> bearer, then 4b misplaced token (Scripts/mcp-proxy.py:2126-2223)."
    - "P13 Content-Length-only framing, bounded exact read (Scripts/mcp-proxy.py:2296-2325); P14 SSE head then queue loop (:2430-2464); P15 a write OSError is a disconnect (:2276-2287), but here a disconnect DOES stop the upstream."
    - "P16 _log_value verbatim with _LOG_VALUE_WIDTH = 80, _LOG_KEYS_SHOWN = 16 (Scripts/mcp-proxy.py:753-775, :308-309); P17 atomic 0600 ready file (:1878-1894); P18 bind first, one-line refusal, exit 2 (:2546-2552, :2633-2696)."
    - "P19 public-only classifier hand copy (Scripts/_mcp_chrome.py:5770-5833), resolve-once policy and one-deadline connect adapted as _rt_resolve/_rt_open_socket (:5836-5922)."
    - "P20 verifying connection: assert CERT_REQUIRED + check_hostname + >= TLS 1.2, wrap_socket(..., suppress_ragged_eofs=False) (Scripts/_mcp_chrome.py:6062-6069, :6127-6141, floor raise :6503-6504); P21 exception -> one-line refusal and bounded body read (:6081-6117, :6181-6208)."
