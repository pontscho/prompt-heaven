        name, fd, (st_dev, st_ino)), never recursion, never shutil.rmtree. FLATTEN strategy (M0:9,
        item 4b) keeps every mutation at most 50 levels below the workdir:
          (a) walk a segment from its top, fd-relative (O_RDONLY|O_DIRECTORY|O_NOFOLLOW, steps 1-4
              per directory), at most _FLATTEN_DEPTH levels deep -- the open frames ARE the fd
              window, so at most 50 directory fds are open at once (plus root, quarantine, lock);
