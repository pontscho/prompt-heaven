# +25 (old ~546-641, section 3 type-definition prose), +26 (old 642-673), +47 (old 674-717),
# +50 (old 718-735), +56 (old 736-~763), +57 (old ~764-~814), +59 (old ~815-1282, i.e.
# section 5 docs through Steps 0-9). E.g. task-036's plan:1235-1248 is now plan:1294-1307.
#
# TASK COUNT IS INTENTIONAL (57 tasks, more than the "13+ tasks, consider splitting" guideline):
# this is ONE feature sequenced by six gates (G1-G6) that each must pass before the next layer
# is built on it, and the plan already splits the delivery by consumer commit (Steps 11, 12,
# 13 each land alone and revert alone). Splitting it into several requirements.yaml plans
