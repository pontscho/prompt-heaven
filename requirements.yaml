      function_name: main
      type: test
      status: completed
      size: s
      size_rationale: "One ~60-line throwaway probe script; the value is the recorded result."
      implementation_details: |
        Plan Step 1 item 1. For /usr/local/bin/python3 (and python3.9 if present) record
        hasattr(os, "waitid") (expected False on macOS -- MEASURED True on 3.14.0, False on 3.9.21,
        M0:1; the darwin path is selected by sys.platform) and hasattr(select, "kqueue"). Fork a
        child that os.setsid()s, spawns a sleeping grandchild and _exit(0)s; in the parent register
        select.kevent(pid, filter=select.KQ_FILTER_PROC, flags=select.KQ_EV_ADD | select.KQ_EV_ONESHOT,
        fflags=select.KQ_NOTE_EXIT) right after fork; kq.control(None, 1, timeout) observes the exit;
        assert the child is still UNREAPED (`/bin/ps -o stat= -p <pid>` shows Z); os.killpg(pid,
        SIGKILL) kills the grandchild; record the errno killpg returns once only the zombie remains
        (expected EPERM); waitpid reaps. Also the ESRCH-on-registration case (child exits before the
        kevent is added). Pattern: the fork/pipe/waitpid shape of the seed probe. A failure STOPS M1
        (R-5: no silent downgrade to a reaping waitpid poll).
      code_references:
        - file: /Users/zoltan.ponekker/Code/prompt-heaven/.claude/tmp/rlimit-probe/probe.py
          function: run_case
          note: "The M0 seed (plan 'Pattern to follow'): fork + setup pipe + exec + waitpid with signal decoding."
          pattern_excerpt: &px_rlimit_probe |
            def run_case(limname, argv):
                r, w = os.pipe()
                pid = os.fork()
                if pid == 0:
                    os.close(r)
                    msg = ""
                    try:
                        resource.setrlimit(NAMES[limname], (LIMIT, LIMIT))
                        msg = "setrlimit=ok"
                    except (ValueError, OSError) as e:
                        msg = "setrlimit=RAISED %s errno=%s" % (type(e).__name__, getattr(e, "errno", None))
                    ...
                    os.write(w, msg.encode())
                    os.close(w)
                    ...
                    try:
                        os.execvp(argv[0], argv)
                    except OSError as e:
                        os.write(2, ("exec failed: %r" % e).encode())
                        os._exit(127)
                os.close(w)
                info = b""
                while True:
                    chunk = os.read(r, 4096)
                    if not chunk:
                        break
                    info += chunk
                os.close(r)
                _, status = os.waitpid(pid, 0)
                if os.WIFSIGNALED(status):
                    res = "signal %s" % signal.Signals(os.WTERMSIG(status)).name
