context_summary:
  error_handling: |
    Two opposite polarities. The helper fail-CLOSED: on unknown platform, missing
    sandbox binary, or an injection-tainted --write path it writes a one-line reason to
    stderr and exits non-zero, NEVER running the command unsandboxed. The gate fail-SAFE:
    any parse error, malformed payload, missing cwd, metacharacter, unknown flag, or
    non-matching wrapper identity is a bare return -> empty stdout -> normal permission
    prompt, and it ALWAYS exits 0 (try/except: pass around main()).
  memory_management: |
    Not applicable in the C/RAII sense (Python stdlib). The only resource concern is
    resource.setrlimit on RLIMIT_AS / RLIMIT_CPU / RLIMIT_NPROC set in-process BEFORE
    os.execvp (limits survive exec - KD-4), with the RLIMIT_NPROC per-UID caveat
    documented (it counts all of the user's processes; leave headroom for the engine to
    fork its target).
  logging_pattern: |
    The gate emits ONLY the allow JSON on stdout or nothing (never logs, stderr stays
    empty - a test invariant). The helper writes a single one-line reason to stderr only
    on the fail-closed path; otherwise it exec-replaces its own image so the target owns
    stdout/stderr.
  naming_conventions: |
    Stdlib-only Python; shebang #!/usr/bin/env python3; module docstring with a Usage:
    line (P4); snake_case; pure per-backend builders named _seatbelt_argv / _bwrap_argv;
    shared-contract functions resolve_scope / project_root / inside_project /
    secret_paths / canonicalize. Skill directory bare "sandbox-run" and frontmatter
    name: sandbox-run (no p: prefix - the plugin applies p: at invocation time).
  key_patterns:
    - "(1) The gate copies ONLY the ~10-line PreToolUse envelope, imports nothing, and REJECTS a metacharacter blocklist rather than seeing through obfuscation (KD-1 / GRAFT 1 / inverted safety model)."
    - "(2) The gate authorizes wrapper IDENTITY (canonicalized toks[0] == WRAPPER_PATH), NEVER os.path.basename == 'sbx' (KD-6 / C1 / CWE-290) - a basename match is a forbidden false-allow."
    - "(3) ONE path-resolution rule (resolve_scope / project_root / separator-safe containment) DUPLICATED across gate+helper because the gate imports nothing (P8), pinned by the mandatory cross-file parity test (H-A / NFR-8)."
    - "(4) All side effects (argparse dispatch, scratch makedirs, setrlimit, execvp) live behind `if __name__ == \"__main__\":`; the module top level defines only pure objects so the offline suite can import and call the builders (M3)."
    - "(5) secret_paths(cwd) is a pure FUNCTION (not a module-level constant) that walks EVERY ancestor .git from cwd to the filesystem root (M-A / sec-MED-2)."
    - "(6) Containment uses os.path.commonpath separator-safe test, not str.startswith, so /x/repo-evil is not a false sibling of /x/repo (sec-MED-1)."
    - "(7) resource.setrlimit runs in-process BEFORE os.execvp so the limits survive exec (KD-4)."
    - "(8) PreToolUse invariants: rc==0 always; AUTOALLOW == parsed permissionDecision:'allow'; PROMPT == literally no stdout; stderr empty (mirror test_mcp_first_guard.py:1002-1005)."
