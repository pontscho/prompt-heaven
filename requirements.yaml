            def read_sse(resp):
                """Parse a close-delimited text/event-stream line by line until EOF."""
                out = {"lines": [], "comments": [], "events": [], "ids": []}
                event, data = None, []
                while True:
                    raw = resp.readline()
                    if not raw:
