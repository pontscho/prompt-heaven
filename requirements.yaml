context_summary:
  error_handling: >-
    Config: ConfigError (Scripts/llm-router.py:208) whose message names the JSON path and the
    rule, never a value (P3); ConfigConflict(ConfigError) for a file that changed shape under
    the writer. Request path: ApiError / UpstreamError(status, err_type, message) rendered by
    _rt_error_body; upstream non-2xx via _UPSTREAM_STATUS / _STATUS_TO_TYPE, 401/403 -> 502
    (KD-8) except an OAuth-profile 401 after the forced refresh -> 401 authentication_error with
    "run llm-router.py login --backend <n>" (KD-16). Stream failures are ONE `event: error` and
    never a message_stop after it (P9). OSError is mapped to ConfigError/UpstreamError by type
    name only (`(type(exc).__name__)`). Import-time table checks raise RuntimeError naming the
    row. In _mcp_oauth.py every refusal is OAuthError(kind in OAUTH_ERROR_KINDS, code
    allow-listed in OAUTH_ERROR_CODES or "other"); error_description is never read (S8).
  memory_management: >-
    Python, so bounds instead of allocation: every input has a _LIMIT/_CAP constant (no MAX_
    stem, CAP_CONST_RX). _rt_send returns (conn, resp) the caller closes with the
    `for closer in (resp.close, conn.close)` loop; once the pump starts it owns both. File
    descriptors are closed in finally; the checked directory descriptor `dfd` is closed by the
    caller of _rt_config_dir_check; the <config>.lock file is never deleted. The scrubber never
    mutates a container in place: add()/pin() build new _dynamic/_pins/_ordered and rebind,
    _ordered last. Unit 5 adapters keep at most _RT_MS_PENDING_CAP pending entries keyed by
    id(inbound), no lock.
  logging_pattern: >-
    log = logging.getLogger("llm-router"); structure only (ADR 0011, P16): values go through
    _log_value, e.g. log.warning("upstream credential rejected: backend %s", _log_value(name)).
    Never log a token, code, verifier, URL query, body or encrypted_content. WARNING for a
    refusal or a persist failure (backend name + exception type name), INFO for "config changed
    since load; merged backends.<n>.oauth only" and sweep counts (never a file name).
    _configure_logging is the generated _mcp_logging.py block.
  naming_conventions: >-
    Router: _rt_ prefix for functions, _RT_ for constants, _Rt for private classes; unit-5
    Responses helpers _rt_rs_*, Mistral helpers _rt_ms_*; secret-bearing NamedTuples are a
    `_XBase(NamedTuple)` plus a subclass with `__slots__ = ()` and a _rt_redacted_repr __repr__.
    OAuth source: _oauth_ functions, OAUTH_ constants, OAuthError / OAuthProvider classes, no
    annotations. Tests: group_<letter>(suite, fixture_root), group labels GA..GO ("K. ..."),
    case ids letter+number, sentinels TF_* minted with secrets.token_hex, harness `H`.
  key_patterns:
    - "Data, not code (NFR-2): per-dialect differences live in rows (_RT_RESPONSES_PROFILES, _RT_KIND_AUTH_PROFILES, _RT_CODEX_IDENTITY, _RT_OAUTH_PROVIDERS, _RT_RS_EFFORT_BANDS, _RT_RS_ERROR_CODES); multi-line tables are a builder function plus one single-target assignment, checked at import."
    - "Per-kind tables are Adapter class attributes with safe base defaults (P1); new hooks upstream_head(inbound, cred) -> (accept_or_None, extra_pairs) and stream_policy(inbound) -> StreamPolicy(line_limit, require_event_stream) default to today's behaviour."
    - "The 501 guard in _post (Scripts/llm-router.py:3658-3665) answers a kind in KIND_CLASSES but not in ADAPTERS, so every intermediate commit loads and stays green."
    - "_rt_send (:2927-2975) is the single framing owner and the only putheader site; _rt_upstream_headers is the only client_headers reader and writes the credential LAST."
    - "Sans-IO translators: begin/feed(line)/finish/fail(type,msg)/ping, properties started/closed/dropped_thinking (P9); output bodies are NEW dicts from an explicit key list (_rt_ms_translate)."
    - "Deterministic ids: _rt_b62(sha256(DOMAIN_PREFIX + id), width) with a per-request map built from the history (P10); the Responses map uses its own domain prefix b\"llm-router/rs-call-id/v1\\0\"."
    - "Hardened file read on the descriptor: O_NOFOLLOW, fstat regular / euid / mode & 0o077 == 0 (P5); duplicate-key-refusing json.loads with object_pairs_hook=_rt_no_duplicate_keys (P7)."
    - "Raw upstream sockets are registered in srv.inflight under srv.inflight_lock and unblocked at shutdown with socket.socket.shutdown(sock, SHUT_RDWR), never close() (P23, P24)."
    - "Everything a handler reads is set on _RouterHttpServer BEFORE super().__init__ binds and listens (L4)."
    - "Static rules are functions of the source text, each with a planted negative control in GJ_CONTROLS checked by gj_control (P19)."
    - "Tests: GROUP_ORDER is iterated and an absent group is skipped (globals().get); K-O must run before group_i and group_j because I1 sweeps every collected log and J9/J10 compare start-of-run snapshots (P25, H1)."
    - "A missing module or symbol is one red problem per case, never a crash (gj_missing); every declared case id is recorded exactly once."

