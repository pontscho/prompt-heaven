      file_path: /Users/zoltan.ponekker/Code/prompt-heaven/ClaudeCode/skills/sandbox-run/scripts/sbx
      function_name: _supervise
      type: create
      status: completed
      size: m
      size_rationale: "Eight-step supervisor (~90 lines) with signal-handler save/restore and three outcomes."
      implementation_details: |
        Plan Step 4 `_supervise(scope, engine_path, argv, env) -> int` (when scope.timeout):
        1. r, w = os.pipe() (CLOEXEC) -- setup-error channel.
        2. NPROC +N: count = uid_process_count(os.getuid()); add ("RLIMIT_NPROC", count + N).
        3. SIGTERM/SIGINT/SIGHUP handlers that set a flag, installed BEFORE fork (R2:L3); previous
           handlers saved.
        4. pid = os.fork(). Child: FIRST restore SIG_DFL for the three signals; close r; close
           scope.status_fd; os.setsid(); err = _strict_rlimits(limits) -> on err write it to w,
           os._exit(127); os.execve(engine_path, argv, env); on OSError write and _exit(127).
        5. Parent: close w; read r to EOF; non-empty -> reap, write exit/refused (no spawned), one
           stderr line, return 3 (a flag set meanwhile is honoured right after).
        6. Write spawned {"pid": pid, "pgid": pid}.
        7. exited = _wait_exit_unreaped(pid, deadline) -> _sweep -> outcome exited/signaled; deadline
           or trapped signal -> _sweep (linux also os.kill(pid, SIGKILL)) -> outcome timeout (or
           signaled).
        8. Terminal exit line; stderr marker "sbx: timeout: wall-clock limit of %gs reached; process
           group killed" on timeout; restore the saved handlers; return 0/target code, 124 on
           timeout, 128 + signo when signaled (KD-1).
        The status fd is never inherited by the target (closed in the child; T8).
