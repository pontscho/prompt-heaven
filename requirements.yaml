requirements:
  - category: interface
    question: What is the final sbx command-line interface and how is the target argv separated from sbx flags?
    answer: |
      sbx [--write DIR]... [--net] [--ro] -- <cmd> [args...]. The helper MANUALLY
      slices argv at the first bare "--" (NOT argparse.REMAINDER): the left side is
      fed to argparse, the right side is kept verbatim as the target argv and passed
      to os.execvp as argv list elements, never through a shell. --write is
      action="append" (repeatable); --ro denies all writes incl. the scratch default;
      --net enables network. A --dry-run mode prints the resolved plan and runs
      NOTHING. Missing "--" or empty target argv -> non-zero usage error.
    details:
      - FR-2 / FR-3 / Step 1
      - The wrapper is invoked and auto-allowed ONLY by its absolute deployed path ~/.claude/skills/p/skills/sandbox-run/scripts/sbx (H2 invocation contract).
    options: []
    status: answered
  - category: architecture
    question: How is the sandbox helper structured across platforms and how does it fail when a platform or binary is unavailable?
    answer: |
      A fail-closed registry BACKENDS = {"darwin": _seatbelt_argv, "linux": _bwrap_argv}
      keyed on a sys.platform prefix; builder = BACKENDS.get(platform_key). If builder
      is None (unknown platform) OR shutil.which cannot find the engine binary
      (sandbox-exec / bwrap) -> one-line reason to stderr + sys.exit(non-zero) WITHOUT
      ever constructing or running a target. There is NO unsandboxed fallback ever.
      No class hierarchy (ARCHITECTURE.md forbids speculative abstraction) - two pure
      Scope->argv builder functions plus a dict. Adding a third OS later = one function
      + one dict entry; seccomp is an OFF-by-default `if scope.seccomp:` branch inside
      _bwrap_argv.
    details:
      - NFR-1 / NFR-2 / NFR-9 / KD-3 / R20
    options: []
    status: answered
  - category: security
    question: How does the gate decide auto-allow versus prompt, and what is its safe direction on any doubt?
    answer: |
      Grant-only PreToolUse(Bash) gate. Auto-allow IFF the command is provably a
      single, clean, un-wrapped invocation of the ONE deployed sbx wrapper - verified
      by canonical-path IDENTITY (canonicalize toks[0] and require == WRAPPER_PATH,
      NEVER os.path.basename == "sbx") - with NO shell metacharacter anywhere, its
      declared scope inside the project, and --net absent. Under ANY doubt (a
      metacharacter, a parse ambiguity, an unknown field/flag, missing cwd, or a first
      token that does not canonicalize to WRAPPER_PATH) it emits EMPTY stdout and the
      normal prompt runs. Fail-safe == fail-to-prompt, never fail-to-allow. The gate
      only ever emits "allow" or silence; it NEVER emits "deny". It copies ONLY the
      ~10-line JSON envelope + main() skeleton from mcp-first-guard.py, imports nothing,
      and REJECTS metacharacters rather than seeing through them (inverted safety model).
    details:
      - FR-5 / FR-7 / KD-1 / KD-6 / P3 / GRAFT 1
    options: []
    status: answered
  - category: security
    question: Which secrets are protected and how is the deny set produced single-source?
    answer: |
      Secrets are denied BOTH read and write even when inside an otherwise-allowed
      scope. The set is produced ONCE by a pure, import-side-effect-free FUNCTION
      secret_paths(cwd) -> tuple[str, ...] in the helper (a FUNCTION, not a
      module-level constant, because the .git/config entries are cwd-derived - M-A).
      It returns the home-anchored ~/.ssh, ~/.aws, ~/.gnupg, ~/.config/gh, ~/.claude
      (expanduser, cwd-independent) PLUS os.path.join(d, ".git", "config") for EVERY
      ancestor d of cwd (inclusive) whose <d>/.git exists, walking from cwd up to the
      filesystem root (sec-MED-2) - so a planted nested .git cannot un-protect the real
      repo-root .git/config. Each backend translates the tuple to its own deny syntax
      (policy single-source, expression per-backend, KD-2).
    details:
      - FR-6 / KD-2 / KD-8 / R16 / R17 / R22 / R22b / sec-MED-2
    options: []
    status: answered
  - category: implementation
    question: How is drift between the gate and helper prevented given the gate imports nothing?
    answer: |
      resolve_scope (KD-7: realpath(join(base, expanduser(dir))) with base==cwd),
      project_root (KD-8: nearest .git-bearing ancestor of cwd, else cwd), and the
      separator-safe containment test (commonpath, NOT str.startswith - sec-MED-1) are
      ONE logical contract but - because the gate imports nothing and is deployed in a
      different tree (P8) - are DELIBERATELY DUPLICATED as two physical copies (one in
      the gate, one in the helper) that MUST produce byte-identical output. A mandatory
      cross-file PARITY TEST in tests/test_sbx_gate.py imports BOTH copies (gate via
      harness load_module_from_path; helper via importlib.machinery.SourceFileLoader -
      the helper is extension-less, H3) and asserts byte-identical output over ~, .,
      /etc, a relative ../sibling, and a temp symlink. A one-sided edit == a containment
      escape, which the parity test is the enforcement against.
    details:
      - NFR-8 / H-A / KD-7 / KD-8 / H1
    options: []
    status: answered
  - category: data
    question: How is the write-scope resolved and injection-checked?
    answer: |
      Default sole writable scope is <cwd>/.claude/tmp (created at runtime dispatch via
      os.makedirs(exist_ok=True), never a shell mkdir). Each --write DIR adds
      canonicalize(DIR) = resolve_scope(DIR, cwd) then REJECT (fail-closed exit non-zero)
      any raw-or-resolved path containing " ' ( ) backslash or newline (R14). --ro
      overrides to an empty writable set (R21). Containment ("is this --write inside the
      project?") uses the separator-safe commonpath test in BOTH gate and helper
      (inside_project), never str.startswith.
    details:
      - FR-3 / KD-7 / NFR-4 / R14 / R21 / sec-MED-1
    options: []
    status: answered
  - category: implementation
    question: Where do the offline helper containment assertions live - a standalone test_sbx.py or folded into the gate suite?
    answer: |
      RESOLVED (locked minimum). There is NO standalone tests/test_sbx.py, NO run_sbx
      wrapper in tests/run.py, and NO separate sbx forge test target. Step 9's offline
      pure-builder containment assertions (a)-(d), the H3 SourceFileLoader import of the
      extension-less sbx helper, the setrlimit-before-execvp structural check, and the
      M3 import-side-effect-free proof are all FOLDED INTO tests/test_sbx_gate.py as a
      SECOND GROUP. Only tests/test_sbx_gate.py (create), one run_sbx_gate wrapper + one
      SUITES row in tests/run.py, and one sbx_gate forge test target exist for tests.
      In reference lists, tests/test_mcp_first_guard.py is the mirror reference.
    details:
      - Step 9 "Flag" (the locked minimum alternative) / FR-8
    options: []
    status: answered
  - category: dependencies
    question: What external dependencies does this feature introduce?
    answer: |
      None. Python 3 stdlib only (house style verified checkpoint.py:1-16,
      reindex.py:1-27). The plugin ships NO hooks block; there is no installer and no
      self-check; the user registers the gate manually in ~/.claude/settings.json
      (locked decision c). macOS relies on the deprecated-but-present sandbox-exec;
      Linux relies on bwrap; any missing binary -> fail-closed.
    details:
      - NFR-3 / locked decision c
    options: []
    status: answered
constraints:
  - type: technical
    description: |
      The PreToolUse contract is rigid: the gate must ALWAYS sys.exit(0); AUTOALLOW is
      the "allow" JSON on stdout; PROMPT is literally NO stdout; stderr must be empty;
      the hookSpecificOutput JSON shape is fixed (mcp-first-guard.py:585-599).
    impact: |
      Breaking any of these breaks the hook silently. The Step-8 suite pins the exact
      envelope and the rc==0 / stderr-empty invariants (mirror test_mcp_first_guard.py:1002-1005).
  - type: technical
    description: |
      The tree must stay bytecode-free and stdlib-only: no .pyc may leak. Test loaders
      set sys.dont_write_bytecode; forge runs under PYTHONDONTWRITEBYTECODE=1
      (project-forge.yaml:19-20); the forge clean pycache target is the backstop.
    impact: |
      Every whitebox/SourceFileLoader import in the folded group must be wrapped so no
      __pycache__ appears; forge clean pycache must leave zero .pyc.
  - type: security
    description: |
      No unsandboxed fallback EVER. Unknown platform or missing sandbox binary -> the
      helper exits non-zero and never runs the command raw; the gate under any doubt ->
      empty stdout (prompt).
    impact: |
      BACKENDS.get(...) must have a fail-closed default; shutil.which must gate the
      engine binary before any target is constructed (NFR-1, R20).
  - type: technical
    description: |
      The sbx helper is intentionally extension-less (the CLI name is "sbx", NOT
      "sbx.py"). The forge `syntax` target globs *.py under Scripts/tests/ClaudeCode/hooks
      only, so it compile-checks sbx-gate.py and test_sbx_gate.py but does NOT cover the
      sbx helper (wrong tree + no .py extension).
    impact: |
      The folded offline group MUST import the helper via importlib.machinery.SourceFileLoader,
      NOT the harness spec_from_file_location-based load_module_from_path (which crashes
      on a suffix-less path - H3). The helper must NOT be renamed to sbx.py.
  - type: business
    description: |
      Registration is the USER's responsibility; the plugin ships no hooks block and no
      installer (locked decision c). Two PreToolUse(Bash) hooks (mcp-first-guard.py +
      sbx-gate.py) coexist with disjoint polarities (deny|empty vs allow|empty).
    impact: |
      An un-registered hook degrades to a normal prompt (safe). Claude Code's multi-hook
      aggregation semantics are NOT verified in-repo and must be confirmed empirically at
      registration time; SKILL.md must document the manual PascalCase registration.
  - type: security
    description: |
      The macOS secret-READ boundary rests on SBPL last-match-wins ordering, which is
      UNVERIFIED in-repo (no existing SBPL). The PreToolUse `cwd` payload field is also
      unexercised anywhere in this repo.
    impact: |
      The boundary is probe-verified, NOT CI-verified: the live self-test probe (d) is
      the only proof and is deliberately kept OUT of portable CI; the ADR must record
      this residual risk (M2/A05/CWE-696). The gate must fail-safe (prompt) if cwd is
      absent, so the cwd assumption can never cause a false-allow.
