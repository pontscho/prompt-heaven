# requirements.yaml -- sbx restricted mode + mcp-sandbox (stdio script runner) + mcp-skill
# (read-only skill loader/runner client) + mcp-proxy per-child `relist`.
#
# Source of truth: docs/specs/spec-sbx-restricted-runner.md (validated in 5 rounds, correctness +
# security, both lanes APPROVE; round ids R2:/R3:/R4:/R5: and C-*/S-* point into it). It is
# authoritative; this file only breaks its 20 Steps into function-level tasks in the plan's order,
# keeping every red-first row group BEFORE (and as a dependency of) the code it gates. "Step N" =
# Section 6 of that plan; "P<n>", "KD-<n>", "T<n>", "R-<n>", "FR-<n>", "SC-<n>" point into it too.
# Row ids are always written <suite>:<row> (plan C-L5).
#
# M0 REFINEMENT (2026-10-11): the Step 1 measurements (.claude/tmp/m0/results.md, tasks 001-010)
# were applied to the plan as tags M0:1..M0:15 and to the pending tasks here: kqueue selected by
# sys.platform; (target same-sandbox); realpath exec literals + Python.app; symlinked parent dirs as
# read literals; PATH-gated exec-dir metadata; restricted /dev/null literal; /private/var/select/sh
# on every darwin plan; file-write-acl ONLY; the literal 100x depth cap (row sbx_restrict:L12); the
# KD-18 FLATTEN remover (row mcp_sandbox:H19); the measured ENV_ADDITIONS; E34 asserts the setuid
# refusal; _KEG_SCAN_MAX_FILES = 512; the config template contract; the hostile-depth limit (R-13).
# No STOP rule fired. Typed counts: sbx_restrict 102 -> 103, mcp_sandbox 140 -> 141.
#
# Every code anchor below was re-read in the working tree on 2026-10-11 (after commit 4d3640c, which
# landed the sbx /dev/null hunk = PC-1 MET; sbx line anchors are unchanged by it). Line numbers move
# as soon as a step edits a host: always locate by SYMBOL first, line second; tests/run.py is edited
# BY CONTENT, never by line number (plan P16).
#
# CONVENTIONS OF THIS FILE
# - A test task that adds rows ALSO moves that suite's typed count and ledger comment in tests/run.py
#   in the same step (CASE COUNT DRIFT is a hard failure -- the `CASE COUNT DRIFT -- a declared
#   count no longer matches the run` print in tests/run.py, currently :828; plan R4:L4). The count
#   after the task is named in its test_requirements. tests/run.py is a second file for those tasks:
#   edit it hunk-level, by content (PC-2).
# - Shared pattern excerpts are YAML anchors (&px_*) defined at first use and re-used as aliases
#   (*px_*); a YAML loader resolves them, a reader finds the anchor by searching for "&px_<name>".
# - TASK COUNT IS INTENTIONAL (119 tasks, far above the "13+, consider splitting" guideline): the
#   plan is one validated unit whose red-first ordering and per-step typed counts cannot be split
#   into separate plans without a red fleet suite between them (plan R3:M1, R5:L2). total_effort
#   follows the validator's aggregation rule (largest task L + 2 levels = xxl); no task is above L.
#
# NOT tasks (done by the orchestrator): every git commit (incl. `git apply --cached` staging of our
# hunks, PC-2), filing the deferred roadmap items with roadmap.py (plan Step 20 "Roadmap"), and any
# deployment to ~/mcp (out of scope). M0 (Step 1) probes run through p:minion-builder; never on
# 192.168.2.245 (PC-3).

original_request: >-
  Write requirements.yaml from the validated feature plan docs/feature-implementation-plan.md:
  sbx restricted mode (restricted reads + --read/--exec, clean env + --env, supervised wall-clock
  timeout with a status fd and group kill, strict rlimits, gate narrowing policy), a new stdio MCP
  script runner Scripts/mcp-sandbox.py (sandbox_call: run_script, capabilities) behind a dedicated
  mcp-proxy --http, a new read-only skill server Scripts/mcp-skill.py (skill_call: load, run, list,
  validate) that is the runner's only client, and an opt-in per-child "relist" in mcp-proxy -- for
  ai-soul's sandbox-runner spec (R-0020 on the ai-soul side).
goal: >-
  Let ai-soul run household/private skill scripts safely: close every escape path at the lowest
  layer that can enforce it (sbx restricted Seatbelt/bwrap profiles, exec filter, two-layer clean
  env, supervised timeout with kill-before-reap, strict rlimits), put policy and bounded I/O in a
  stdio runner (Mach-O read set, VSZ-based AS limits, self-refreshing interpreter plans, fd-relative
  workdirs with an iterative remover and a bounded quarantine, a global concurrency cap), expose it
  only through the existing hardened mcp-proxy HTTP front, and handle untrusted skill text at the
  edge the model reads (mcp-skill: strict index, UTF-16-bounded description, file hygiene,
  sanitizer hand copy, nonce framing, a bounded stdlib Streamable HTTP client). Every new row group
  is observed RED before its implementation, every fleet gate stays green per commit, and the
  decisions are recorded in ADR 0031/0032 plus append-only addenda to ADR 0005, 0008 (x2) and 0027.
complete: true

