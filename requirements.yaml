          note: "Verified mcp-clangd.py:455-466 — the request/response correlation primitive; default timeout 10.0."
          pattern_excerpt: |
            async def _request(self, method: str, params: Any, timeout: float = 10.0) -> dict:
                req_id = self._next_id
                self._next_id += 1
                loop = asyncio.get_running_loop()
                fut: asyncio.Future = loop.create_future()
                self._pending[req_id] = fut
                await self._send({"jsonrpc": "2.0", "id": req_id, "method": method, "params": params})
                try:
                    return await asyncio.wait_for(fut, timeout=timeout)
                except asyncio.TimeoutError:
                    self._pending.pop(req_id, None)
                    return {"error": {"message": f"timeout waiting for {method}"}}
