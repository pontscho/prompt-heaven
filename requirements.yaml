original_request: |
  Write the function-level requirements.yaml for Phase 0 of the mcp-purity
  unification: merge the semantic code-navigation capabilities of the
  mcp-clangd and mcp-cuda MCP servers into the existing mcp-purity server,
  behind the unchanged purity_call entry point. The server grows inward — it
  gains a layered backend architecture (sync file layer + async LSP backend
  layer + filetype routing) while its tool name, dispatcher tool, and the
  project-wide purity_call convention stay exactly as they are. Phase 0 is the
  skeleton: establish the abstract backend interface, fold clangd+cuda into a
  single clangd-family backend, add the 10 semantic functions to the
  purity_call dispatcher, unify the duplicated grep core, fix the truncated
  CUDA fallback bug, and keep every legacy name working via aliases.

goal: |
  Phase 0 (skeleton) of unifying mcp-clangd + mcp-cuda into mcp-purity: fold the
  common LSP core into Scripts/mcp-purity.py behind an abstract backend
  interface, add a clangd-family backend (C/C++/CUDA in one backend, language as
  config), wire 10 semantic functions into the purity_call dispatcher with
  symbol/at routing, DRY up the grep fallback core, extend the alias layer onto
  last-wins precedence, fix 3 bugs (CUDA _symbol_to_location truncation,
  clangd-crash future leak, _resolve_aliases precedence divergence), add lazy LSP
  init, flip the tools/call dispatch path to async, rewrite the purity_call tool
  description, and confine semantic path params to --project-root. Out of scope:
  luals backend (Phase 1); retiring clangd_call/cuda_call tools and the skill /
  minion rewrites (Phase 2).

complete: true

