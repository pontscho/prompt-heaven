context_summary:
  error_handling: >-
    Host refusals raise the host's ConfigError (exit 2), passed INTO the generated blocks as the
    `error` argument (_http_token_value(value, where, min_len, error), _http_write_ready_file(path,
    port, error)); `from None` is kept where the original has it; a refusal message never contains
    the token value (P-H, Scripts/mcp-proxy.py:735-741, :1967-1968). _http_remove_ready_file never
    raises (best effort). Test-side, every generator call in new cases is wrapped in
    `except (Exception, SystemExit) as exc:  # noqa: BLE001` and recorded as a FAIL naming
    type(exc).__name__ and str(exc)[:200] (router J13's shape, tests/test_llm_router.py:18582-18589).
  memory_management: "Not applicable (Python). Resource rule kept: the stdlib's stock rfile is closed at once after the _HeaderDeadlineReader swap (an unclosed makefile keeps the socket fd alive); the ready-file write is .tmp + os.replace with the .tmp removed in a finally."
  logging_pattern: >-
    ADR 0011 structure-only: failure lines carry the exception TYPE only, e.g.
    self.front_log.warning("http handler failed: %s", type(sys.exc_info()[1]).__name__). Loggers are
    log = logging.getLogger("mcp-proxy") (Scripts/mcp-proxy.py:246) and
    logging.getLogger("llm-router") (Scripts/llm-router.py:197). Generated server blocks log through
    self.front_log (class attribute front_log = log, PD-3); the ready-file remover logs through its
    `logger` argument at DEBUG ("ready file left: not this pid" / "ready file left: %s" with a type
    name). The router gains exactly those two DEBUG lines (KD-6). Never a header, token, query or body.
  naming_conventions: >-
    Lifted blocks keep mcp-proxy's names verbatim (_http_token_value, _HeaderDeadlineReader,
    _http_write_ready_file, _http_remove_ready_file, _HTTP_STDLIB_REFUSAL_HEADERS, plus the stdlib
    method names). Router-only module names use the _rt_ prefix (ADR 0028 :139-142; not gated).
    Test tables use HTTPFRONT_* (HTTPFRONT_HOSTS, HTTPFRONT_SERVER, HTTPFRONT_HANDLER,
    HTTPFRONT_MODULE, HTTPFRONT_ADAPTATIONS, HTTPFRONT_PIN_CLEAN, HTTPFRONT_SOURCE,
    HTTPFRONT_CANONICAL_NAME); router static rules rule_jNN with GJ_JNN_CLEAN / GJ_JNN_PLANTED; proxy
    static checkers k5_front_policy + K5_PLANT; new generated_region group label GI. Python is
    4-space indented in both hosts and in the source.
  key_patterns:
    - "P-A in-class generated region: `# Refresh: python3 Scripts/amalgamate.py -- do not edit inside the region (§8).` then `# BEGIN GENERATED: <source> :: <names>` ... `# END GENERATED: <hash>`, at the marker's column (Scripts/mcp-proxy.py:2038-2047). Its source is a TOP-LEVEL def; the generator dedents and re-indents by the marker column. A new END is written unhashed (`# END GENERATED:`) and filled by a plain generator run."
    - "P-B canonical source header: shebang, PEP 723 block (requires-python >=3.9, dependencies = []), a docstring naming the ONE domain, the block contract (builtins + module imports + own args), and 'No server imports this module' (Scripts/_mcp_oauth.py:1-38)."
    - "P-C free-name audit refusal: the generator raises SystemExit naming the missing names (Scripts/amalgamate.py:633-640); free_names binds ast.arg, def and Store names."
    - "P-D registry entry = one line in each of two registries: Scripts/amalgamate.py CANONICAL_NAMES (:77-80) and the suite's mirror (path constant, *_CANONICAL_NAME, CANONICAL_NAMES in tests/test_generated_region.py:143-184); sources-registered compares them sorted."
    - "P-E group E record: problems = []; ...; suite.record(GE, '<id>', problems, detail=[...]); problem_if(cond, msg) at tests/test_generated_region.py:589; modules loaded with H.load_module_from_path."
    - "P-F router static rule + planted control: rule_jNN(source) -> [finding]; GJ_STATIC_CASES tuple; GJ_JNN_CLEAN/GJ_JNN_PLANTED texts; GJ_CONTROLS {case: (checker, clean, planted, needles)}; gj_control; group_j_static records live rules by explicit blocks (the J37 block) and every GJ_STATIC_CASES id at the end."
    - "P-G proxy static case: group_k parses the source once and records suite.record(GK, '<id>', _findings(found), detail=[...]); the parse-failure branch lists every K case id; K5 carries its own plant in the shape of J25_PLANT."
    - "P-H error handling: ConfigError passed in, from None kept, token never in a message."
    - "P-I logging: ADR 0011 type-only lines; the logger object identity is unchanged."
    - "P-J naming: verbatim proxy names for lifted code; _rt_ for router-only names."
    - "P-K router rig patch: FastRouter setattr()s module constants and patches _RouterHandler.timeout in step with _HTTP_HEADER_TIMEOUT_S (tests/test_llm_router.py:518-525) -- why parse_request reads self.timeout."
    - "Test-recording pattern (red-first): run the forge target, observe the named case FAIL with the expected finding text, record the run (it is quoted in ADR 0029), then land the code and observe it PASS; characterisation cases are reddened by a reverted scratch mutation."
    - "Test-recording pattern (counts): typed case counts live in tests/run.py SUITES (generated_region :454, py_deps :645, mcp_proxy :705 + history :686-694, llm_router :716 + table :706-708); a count that moves is the alarm, so every new case updates its count in the same Step."
    - "Twins before lift (KD-1): Steps 2-3 rewrite both hosts by hand into byte-identical twins with policy injected; Step 4 only wraps them in markers, so the generator rewrite is a no-op on every body."

