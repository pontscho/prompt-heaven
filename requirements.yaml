  tasks:
    # ===================== Step 1: red-first scaffold, stub, suite registration, early probe =====================
    - task_id: task-001
      description: "Early amalgamate probe: baseline `amalgamate --check` on the clean tree and verification in a scratch copy that the generator fills a marker pair whose END carries no hash."
